<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D TPS ウォーターバトル P2P</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { touch-action: none; overflow: hidden; }
    
    @keyframes secretFlashAnimation {
      0% { opacity: 0.8; }
      100% { opacity: 0; }
    }
    .secret-flash {
      animation: secretFlashAnimation 0.15s ease-out forwards;
    }

    @keyframes tvScale {
      0% { transform: scale(0) rotate(-5deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .tv-popup {
      animation: tvScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes screenNuke {
      0% { opacity: 0; }
      50% { opacity: 1; background: white; }
      100% { opacity: 0; }
    }
    .nuke-flash {
      animation: screenNuke 1.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-2 select-none">

  <!-- 自分だけにしか見えない隠し発動用フラッシュオーバーレイ -->
  <div id="secret-flash-overlay" class="pointer-events-none fixed inset-0 bg-cyan-300 opacity-0 z-50"></div>
  
  <!-- 全画面爆発エフェクト -->
  <div id="nuke-overlay" class="pointer-events-none fixed inset-0 bg-white opacity-0 z-50"></div>

  <!-- 1. ロビー画面 -->
  <div id="lobby-view" class="w-full max-w-sm bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-6 text-center z-10">
    <div>
      <div class="text-4xl mb-2">💦</div>
      <h1 class="text-xl font-bold text-slate-100">3D TPS ウォーターバトル</h1>
      <p class="text-xs text-slate-400 mt-1">左手で移動 / 右手スワイプで視点変更！</p>
    </div>

    <!-- ホスト -->
    <div class="p-4 bg-slate-700/50 rounded-2xl border border-slate-600 space-y-3">
      <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-wider">部屋を作る（Host）</h2>
      <button onclick="createRoom()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 font-bold rounded-xl text-sm transition">
        ルームコードを発行
      </button>
      <div id="room-id-display" class="hidden p-3 bg-slate-900 rounded-xl text-2xl font-mono font-bold tracking-widest text-emerald-400 border border-emerald-500/30"></div>
    </div>

    <div class="text-xs text-slate-500 font-bold">OR</div>

    <!-- ゲスト -->
    <div class="p-4 bg-slate-700/50 rounded-2xl border border-slate-600 space-y-3">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">部屋に入る（Guest）</h2>
      <input type="number" id="join-room-id" placeholder="4桁のコードを入力" pattern="\d*" maxlength="4"
        class="w-full px-3 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-lg text-center font-mono text-white tracking-widest focus:outline-none focus:border-amber-400">
      <button onclick="joinRoom()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 font-bold rounded-xl text-sm transition">
        対戦に参加
      </button>
    </div>

    <p id="status-text" class="text-xs text-slate-400">接続待機中...</p>
  </div>

  <!-- 2. ゲーム画面 -->
  <div id="game-view" class="hidden flex-col items-center space-y-2 relative w-full max-w-md">
    <!-- HPバー -->
    <div class="flex items-center justify-between w-full px-4 py-2 bg-slate-800/80 backdrop-blur rounded-2xl border border-slate-700">
      <div class="text-left w-32">
        <div class="text-[10px] text-cyan-400 font-bold">YOU (濡れ度)</div>
        <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden mt-1">
          <div id="hp-you" class="bg-cyan-400 h-full w-full transition-all duration-200"></div>
        </div>
      </div>
      <div class="text-xs font-bold text-slate-500">VS</div>
      <div class="text-right w-32">
        <div class="text-[10px] text-rose-400 font-bold">ENEMY (濡れ度)</div>
        <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden mt-1">
          <div id="hp-enemy" class="bg-rose-400 h-full w-full transition-all duration-200"></div>
        </div>
      </div>
    </div>

    <!-- 3Dキャンバス表示エリア -->
    <div id="view-touch-area" class="relative w-full h-[380px] rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-slate-950 touch-none">
      <div id="canvas-container" class="w-full h-full"></div>

      <!-- 自分だけに分かる極小隠し進行度インジケーター (9個の極小ドット) -->
      <div id="secret-dots" class="absolute top-2 left-2 flex space-x-1 opacity-40 pointer-events-none">
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
      </div>

      <!-- 照準（クロスヘア） -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-3 h-3 rounded-full border-2 border-cyan-400/80 bg-cyan-400/20"></div>
      </div>

      <!-- 警告インジケーター -->
      <div id="warning-banner" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-red-600/90 text-white font-black text-xs px-4 py-1 rounded-full animate-bounce border border-red-300 shadow-lg">
        ⚠️ 巨大隕石・超接近中 ⚠️
      </div>

      <!-- TV放映カットイン -->
      <div id="tv-overlay" class="hidden absolute inset-x-8 top-12 bg-slate-900 border-4 border-slate-700 rounded-3xl p-3 shadow-2xl z-30 tv-popup">
        <div class="bg-slate-950 border-2 border-slate-800 rounded-2xl p-3 text-center space-y-2 relative overflow-hidden">
          <div class="absolute top-2 right-2 flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            <span class="text-[9px] font-bold text-red-500">LIVE</span>
          </div>
          <div class="text-xs font-bold text-amber-400">📺 臨時ニュース速報</div>
          <div class="text-2xl animate-pulse">📺💥☄️</div>
          <p class="text-[11px] font-bold text-slate-200">「未確認の巨大隕石群が落下中！間もなく衝撃波が到達します！」</p>
          <div id="tv-timer" class="text-2xl font-black text-red-500 font-mono">5</div>
        </div>
      </div>

      <!-- カウントダウン表示 -->
      <div id="countdown-overlay" class="hidden absolute inset-0 bg-slate-950/40 backdrop-blur-[2px] rounded-2xl flex items-center justify-center z-10">
        <div id="countdown-text" class="text-7xl font-black text-amber-400 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)] scale-125 transition-transform duration-200">3</div>
      </div>

      <!-- 勝敗・再戦待機オーバレイ -->
      <div id="result-overlay" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center space-y-4 z-20">
        <div id="result-text" class="text-3xl font-extrabold tracking-wider"></div>
        <p id="retry-status-text" class="text-xs text-slate-300">「もう一度遊ぶ」を押してください</p>
        <button id="retry-btn" onclick="requestRetry()" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 active:scale-95 transition rounded-xl font-bold text-sm shadow-lg">
          もう一度遊ぶ 🔄
        </button>
      </div>
    </div>

    <!-- 操作エリア -->
    <div class="w-full h-32 bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700 relative overflow-hidden flex items-center justify-between px-6">
      <div id="touch-zone" class="w-36 h-full flex items-center justify-center relative touch-none">
        <div class="text-[10px] text-slate-500 pointer-events-none">移動（前後左右）</div>
        <div id="stick-base" class="hidden absolute w-16 h-16 bg-slate-700/60 rounded-full border border-slate-500/50 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
          <div id="stick-knob" class="absolute w-8 h-8 bg-cyan-500/80 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        </div>
      </div>

      <button id="shoot-btn" class="w-24 h-24 bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 font-bold rounded-2xl text-xs shadow-lg flex flex-col items-center justify-center active:scale-95 transition-transform z-10">
        <span class="text-xl mb-1">💦</span>
        <span>SHOOT</span>
      </button>
    </div>
  </div>

  <script>
    let peer = null, conn = null, isHost = false;
    const FIELD_SIZE = 24;
    let isGameOver = false;
    let isGamePlaying = false;
    let myRetryReady = false, enemyRetryReady = false;

    // 隠し機能用ステート
    let secretModeActive = false;
    let tapPattern = [];
    let lastTapTime = 0;
    let pressStartTime = 0;
    const SOS_PATTERN = ['S','S','S','L','L','L','S','S','S'];

    // プレイヤー状態
    let myHp = 100, enemyHp = 100;
    let myPos = { x: -6, z: 6, angle: 0 };
    let enemyPos = { x: 6, z: -6, angle: Math.PI };
    let waterBullets = [];
    let meteors = [];
    let clones = [];

    // カメラ視点管理
    let cameraYaw = 0;
    let cameraPitch = 0.25;

    const obstaclesData = [
      { x: -3, z: -2, w: 3, d: 3 },
      { x: 3, z: 2, w: 3, d: 3 },
      { x: 0, z: 0, w: 2.5, d: 2.5 }
    ];

    let joystickVector = { x: 0, y: 0, active: false };
    let scene, camera, renderer;
    let myStickman, enemyStickman;

    function createRoom() {
      const shortCode = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer('water-battle-' + shortCode);
      document.getElementById('status-text').innerText = "部屋を作成中...";

      peer.on('open', () => {
        isHost = true;
        document.getElementById('room-id-display').innerText = shortCode;
        document.getElementById('room-id-display').classList.remove('hidden');
        document.getElementById('status-text').innerText = "相手に「" + shortCode + "」を伝えてください";
      });

      peer.on('connection', (c) => { conn = c; setupCommunication(); });
      peer.on('error', (err) => { if (err.type === 'unavailable-id') createRoom(); });
    }

    function joinRoom() {
      const inputCode = document.getElementById('join-room-id').value.trim();
      if(!inputCode) return alert("4桁のコードを入力してください");

      peer = new Peer();
      document.getElementById('status-text').innerText = "接続中...";

      peer.on('open', () => {
        isHost = false;
        conn = peer.connect('water-battle-' + inputCode);
        setupCommunication();
      });

      peer.on('error', () => {
        document.getElementById('status-text').innerText = "部屋が見つかりません。コードを確認してください。";
      });
    }

    function setupCommunication() {
      conn.on('open', () => {
        document.getElementById('lobby-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        init3DGame();
        startCountdown();
      });

      conn.on('data', (data) => {
        if (data.type === 'state' && !isGameOver) {
          enemyPos.x = -data.pos.x;
          enemyPos.z = -data.pos.z;
          enemyPos.angle = data.pos.angle + Math.PI;

          if (data.newWater) {
            spawnWaterBullet(-data.newWater.x, -data.newWater.z, -data.newWater.vx, -data.newWater.vz, false);
          }
          if (data.triggerSecret) {
            startEnemySecretSequence();
          }
        } else if (data.type === 'hit' && !isGameOver && !secretModeActive) {
          takeDamage(data.damage);
        } else if (data.type === 'retry_request') {
          enemyRetryReady = true;
          updateRetryUI();
          checkBothReadyToReset();
        }
      });
    }

    function startCountdown() {
      isGamePlaying = false;
      const overlay = document.getElementById('countdown-overlay');
      const text = document.getElementById('countdown-text');
      overlay.classList.remove('hidden');

      let count = 3;
      text.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          text.innerText = count;
        } else if (count === 0) {
          text.innerText = "GO!";
          text.className = "text-6xl font-black text-emerald-400 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]";
        } else {
          clearInterval(timer);
          overlay.classList.add('hidden');
          text.className = "text-7xl font-black text-amber-400 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]";
          isGamePlaying = true;
        }
      }, 900);
    }

    function init3DGame() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const floorGeo = new THREE.PlaneGeometry(FIELD_SIZE, FIELD_SIZE);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const grid = new THREE.GridHelper(FIELD_SIZE, 12, 0x38bdf8, 0x334155);
      grid.position.y = 0.01;
      scene.add(grid);

      obstaclesData.forEach(obs => {
        const geo = new THREE.BoxGeometry(obs.w, 2, obs.d);
        const mat = new THREE.MeshStandardMaterial({ color: 0x475569 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(obs.x, 1, obs.z);
        scene.add(mesh);
      });

      myStickman = createStickman(0x38bdf8);
      enemyStickman = createStickman(0xf43f5e);
      scene.add(myStickman);
      scene.add(enemyStickman);

      setupControls();
      setupShootDetector();
      requestAnimationFrame(gameLoop);
    }

    function createStickman(colorHex) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: colorHex });

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), mat);
      head.position.y = 1.45;
      group.add(head);

      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.7), mat);
      body.position.y = 0.85;
      group.add(body);

      const gunGroup = new THREE.Group();
      const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.5), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
      gunGroup.add(gunBody);
      gunGroup.position.set(0.25, 0.95, -0.2);
      group.add(gunGroup);

      return group;
    }

    // モールス信号検知
    function setupShootDetector() {
      const btn = document.getElementById('shoot-btn');

      const onStart = (e) => {
        e.preventDefault();
        pressStartTime = Date.now();
      };

      const onEnd = (e) => {
        e.preventDefault();
        const duration = Date.now() - pressStartTime;
        const now = Date.now();

        if (now - lastTapTime > 3000) tapPattern = [];
        lastTapTime = now;

        const tapType = duration >= 200 ? 'L' : 'S';
        const expected = SOS_PATTERN[tapPattern.length];
        if (tapType === expected) {
          tapPattern.push(tapType);
        } else {
          tapPattern = (tapType === SOS_PATTERN[0]) ? [tapType] : [];
        }

        updateSecretDotsUI();

        if (!secretModeActive && tapPattern.length === SOS_PATTERN.length) {
          secretModeActive = true;
          triggerFlashEffect();
          startSecretSequence();
          if (conn && conn.open) conn.send({ type: 'state', pos: myPos, triggerSecret: true });
        }

        executeShootAction();
      };

      btn.addEventListener('touchstart', onStart, { passive: false });
      btn.addEventListener('touchend', onEnd);
      btn.addEventListener('mousedown', onStart);
      btn.addEventListener('mouseup', onEnd);
    }

    function updateSecretDotsUI() {
      const dots = document.querySelectorAll('#secret-dots div');
      dots.forEach((dot, index) => {
        dot.className = index < tapPattern.length 
          ? "w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_5px_#38bdf8]"
          : "w-1.5 h-1.5 rounded-full bg-slate-600";
      });
    }

    function triggerFlashEffect() {
      const flashOverlay = document.getElementById('secret-flash-overlay');
      flashOverlay.classList.remove('secret-flash');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('secret-flash');
    }

    // --- 隠しシーケンス展開（発動者側） ---
    function startSecretSequence() {
      for (let i = 0; i < 5; i++) {
        const clone = createStickman(0x38bdf8);
        const offsetX = (i - 2) * 2.5;
        clone.position.set(myPos.x + offsetX, 0, myPos.z);
        scene.add(clone);
        clones.push(clone);
      }

      setTimeout(() => {
        document.getElementById('warning-banner').classList.remove('hidden');
        spawnMeteors();
      }, 10000);

      setTimeout(() => {
        const tv = document.getElementById('tv-overlay');
        tv.classList.remove('hidden');
        let tvCount = 5;
        const tvTimerElem = document.getElementById('tv-timer');

        const interval = setInterval(() => {
          tvCount--;
          if (tvCount >= 0) tvTimerElem.innerText = tvCount;
          if (tvCount <= 0) {
            clearInterval(interval);
            triggerBigExplosion(true); // 自分＝WIN
          }
        }, 1000);
      }, 12000);
    }

    // --- 相手側チート発動時の同期用シーケンス ---
    function startEnemySecretSequence() {
      for (let i = 0; i < 5; i++) {
        const clone = createStickman(0xf43f5e);
        const offsetX = (i - 2) * 2.5;
        clone.position.set(enemyPos.x + offsetX, 0, enemyPos.z);
        scene.add(clone);
        clones.push(clone);
      }

      setTimeout(() => {
        document.getElementById('warning-banner').classList.remove('hidden');
        spawnMeteors();
      }, 10000);

      setTimeout(() => {
        const tv = document.getElementById('tv-overlay');
        tv.classList.remove('hidden');
        let tvCount = 5;
        const tvTimerElem = document.getElementById('tv-timer');

        const interval = setInterval(() => {
          tvCount--;
          if (tvCount >= 0) tvTimerElem.innerText = tvCount;
          if (tvCount <= 0) {
            clearInterval(interval);
            triggerBigExplosion(false); // 相手発動＝LOSE
          }
        }, 1000);
      }, 12000);
    }

    function spawnMeteors() {
      for (let i = 0; i < 15; i++) {
        setTimeout(() => {
          if (isGameOver) return;
          const geo = new THREE.SphereGeometry(1.2 + Math.random(), 16, 16);
          const mat = new THREE.MeshStandardMaterial({ color: 0xff4400, roughness: 0.1 });
          const mesh = new THREE.Mesh(geo, mat);
          
          mesh.position.set((Math.random() - 0.5) * FIELD_SIZE, 20 + Math.random() * 10, (Math.random() - 0.5) * FIELD_SIZE);
          scene.add(mesh);
          meteors.push(mesh);
        }, i * 300);
      }
    }

    function triggerBigExplosion(isWin) {
      const nuke = document.getElementById('nuke-overlay');
      nuke.classList.add('nuke-flash');

      setTimeout(() => {
        if (isWin) {
          enemyHp = 0;
          document.getElementById('hp-enemy').style.width = '0%';
        } else {
          myHp = 0;
          document.getElementById('hp-you').style.width = '0%';
        }
        endGame(isWin);
      }, 700);
    }

    let lastShot = 0;

    function executeShootAction() {
      const now = Date.now();
      if (!secretModeActive && (now - lastShot < 300 || myHp <= 0 || !isGamePlaying || isGameOver)) return;
      lastShot = now;

      const speed = 0.55;
      const vx = -Math.sin(myPos.angle) * speed;
      const vz = -Math.cos(myPos.angle) * speed;

      spawnWaterBullet(myPos.x, myPos.z, vx, vz, true);

      if (secretModeActive) {
        clones.forEach(clone => {
          spawnWaterBullet(clone.position.x, clone.position.z, vx, vz, true);
        });
      }

      if (conn && conn.open) {
        conn.send({
          type: 'state',
          pos: myPos,
          newWater: { x: myPos.x, z: myPos.z, vx: vx, vz: vz }
        });
      }
    }

    function setupControls() {
      const zone = document.getElementById('touch-zone');
      const base = document.getElementById('stick-base');
      const knob = document.getElementById('stick-knob');
      let joyTouchId = null, startX = 0, startY = 0;

      const handleJoyStart = (e) => {
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        joyTouchId = touch.identifier ?? 'mouse';
        const rect = zone.getBoundingClientRect();
        startX = touch.clientX - rect.left;
        startY = touch.clientY - rect.top;

        base.style.left = `${startX}px`;
        base.style.top = `${startY}px`;
        base.classList.remove('hidden');
        joystickVector.active = true;
      };

      const handleJoyMove = (e) => {
        if (!joystickVector.active) return;
        let touch = e.touches ? Array.from(e.touches).find(t => t.identifier === joyTouchId) : e;
        if (!touch) return;

        const rect = zone.getBoundingClientRect();
        let dx = (touch.clientX - rect.left) - startX;
        let dy = (touch.clientY - rect.top) - startY;
        const dist = Math.hypot(dx, dy);
        const maxRadius = 32;

        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }

        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joystickVector.x = dx / maxRadius;
        joystickVector.y = dy / maxRadius;
      };

      const handleJoyEnd = () => {
        joystickVector.active = false;
        joystickVector.x = 0; joystickVector.y = 0;
        base.classList.add('hidden');
      };

      zone.addEventListener('touchstart', handleJoyStart, { passive: false });
      zone.addEventListener('touchmove', handleJoyMove, { passive: false });
      zone.addEventListener('touchend', handleJoyEnd);
      zone.addEventListener('mousedown', handleJoyStart);

      const touchArea = document.getElementById('view-touch-area');
      let lookTouchId = null;
      let lastTouchX = 0, lastTouchY = 0;

      const handleLookStart = (e) => {
        if (e.touches) {
          for (let i = 0; i < e.touches.length; i++) {
            let t = e.touches[i];
            if (t.identifier !== joyTouchId && lookTouchId === null) {
              lookTouchId = t.identifier;
              lastTouchX = t.clientX;
              lastTouchY = t.clientY;
              break;
            }
          }
        } else {
          lookTouchId = 'mouse';
          lastTouchX = e.clientX;
          lastTouchY = e.clientY;
        }
      };

      const handleLookMove = (e) => {
        if (lookTouchId === null) return;
        let t = e.touches ? Array.from(e.touches).find(touch => touch.identifier === lookTouchId) : e;
        if (!t) return;

        let deltaX = t.clientX - lastTouchX;
        let deltaY = t.clientY - lastTouchY;
        lastTouchX = t.clientX;
        lastTouchY = t.clientY;

        const sensitivity = 0.008;
        cameraYaw += deltaX * sensitivity;
        cameraPitch += deltaY * sensitivity;

        cameraPitch = Math.max(-0.2, Math.min(0.8, cameraPitch));
      };

      const handleLookEnd = (e) => {
        if (e.touches) {
          let activeTouches = Array.from(e.touches).map(t => t.identifier);
          if (!activeTouches.includes(lookTouchId)) lookTouchId = null;
        } else {
          lookTouchId = null;
        }
      };

      touchArea.addEventListener('touchstart', handleLookStart, { passive: false });
      touchArea.addEventListener('touchmove', handleLookMove, { passive: false });
      touchArea.addEventListener('touchend', handleLookEnd);
      touchArea.addEventListener('mousedown', handleLookStart);

      window.addEventListener('mousemove', (e) => {
        handleJoyMove(e);
        handleLookMove(e);
      });
      window.addEventListener('mouseup', () => {
        handleJoyEnd();
        handleLookEnd({});
      });
    }

    function spawnWaterBullet(x, z, vx, vz, isMy) {
      const geo = new THREE.SphereGeometry(0.22, 8, 8);
      const mat = new THREE.MeshStandardMaterial({
        color: isMy ? 0x00f0ff : 0xff0055,
        transparent: true,
        opacity: 0.85
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 1.0, z);
      scene.add(mesh);

      waterBullets.push({ mesh, vx, vz, isMy, life: 50 });
    }

    function gameLoop() {
      if (isGamePlaying && !isGameOver) {
        updateMovement();
        updateWaterBullets();
        updateMeteors();

        if (secretModeActive) {
          myHp = 100;
          document.getElementById('hp-you').style.width = '100%';
          executeShootAction();
        }

        if (conn && conn.open) {
          conn.send({ type: 'state', pos: myPos });
        }
      }

      myPos.angle = cameraYaw;
      myStickman.position.set(myPos.x, 0, myPos.z);
      myStickman.rotation.y = myPos.angle;

      clones.forEach((clone, idx) => {
        const offsetX = (idx - 2) * 2.5;
        if (secretModeActive) {
          clone.position.set(myPos.x + offsetX, 0, myPos.z);
          clone.rotation.y = myPos.angle;
        } else {
          clone.position.set(enemyPos.x + offsetX, 0, enemyPos.z);
          clone.rotation.y = enemyPos.angle;
        }
      });

      enemyStickman.position.set(enemyPos.x, 0, enemyPos.z);
      enemyStickman.rotation.y = enemyPos.angle;

      const camDist = 4.0;
      const camHeight = 1.2 + Math.sin(cameraPitch) * 3.0;
      const horizontalDist = Math.cos(cameraPitch) * camDist;

      camera.position.x = myPos.x + Math.sin(cameraYaw) * horizontalDist;
      camera.position.z = myPos.z + Math.cos(cameraYaw) * horizontalDist;
      camera.position.y = camHeight;

      const targetX = myPos.x - Math.sin(cameraYaw) * 10;
      const targetZ = myPos.z - Math.cos(cameraYaw) * 10;
      camera.lookAt(targetX, 1.2, targetZ);

      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    function updateMeteors() {
      meteors.forEach(m => {
        m.position.y -= 0.4;
        if (m.position.y <= 0) m.position.y = 20;
      });
    }

    function updateMovement() {
      if (myHp <= 0 || !joystickVector.active) return;

      const speed = 0.12;
      const inputForward = -joystickVector.y;
      const inputStrafe = joystickVector.x;

      const sin = Math.sin(cameraYaw);
      const cos = Math.cos(cameraYaw);

      let moveX = (-sin * inputForward + cos * inputStrafe) * speed;
      let moveZ = (-cos * inputForward - sin * inputStrafe) * speed;

      let nextX = myPos.x + moveX;
      let nextZ = myPos.z + moveZ;

      const bound = FIELD_SIZE / 2 - 0.5;
      if (Math.abs(nextX) < bound && Math.abs(nextZ) < bound) {
        let collide = false;
        for (let obs of obstaclesData) {
          if (nextX > obs.x - obs.w/2 - 0.4 && nextX < obs.x + obs.w/2 + 0.4 &&
              nextZ > obs.z - obs.d/2 - 0.4 && nextZ < obs.z + obs.d/2 + 0.4) {
            collide = true; break;
          }
        }
        if (!collide) {
          myPos.x = nextX;
          myPos.z = nextZ;
        }
      }
    }

    function updateWaterBullets() {
      for (let i = waterBullets.length - 1; i >= 0; i--) {
        let b = waterBullets[i];
        b.mesh.position.x += b.vx;
        b.mesh.position.z += b.vz;
        b.life--;

        let hitObs = false;
        for (let obs of obstaclesData) {
          if (b.mesh.position.x > obs.x - obs.w/2 && b.mesh.position.x < obs.x + obs.w/2 &&
              b.mesh.position.z > obs.z - obs.d/2 && b.mesh.position.z < obs.z + obs.d/2) {
            hitObs = true; break;
          }
        }

        if (b.life <= 0 || hitObs || Math.abs(b.mesh.position.x) > FIELD_SIZE/2 || Math.abs(b.mesh.position.z) > FIELD_SIZE/2) {
          scene.remove(b.mesh);
          waterBullets.splice(i, 1);
          continue;
        }

        if (b.isMy && !secretModeActive) {
          const dist = Math.hypot(b.mesh.position.x - enemyPos.x, b.mesh.position.z - enemyPos.z);
          if (dist < 0.7) {
            enemyHp = Math.max(0, enemyHp - 15);
            document.getElementById('hp-enemy').style.width = enemyHp + '%';

            if (conn && conn.open) conn.send({ type: 'hit', damage: 15 });

            scene.remove(b.mesh);
            waterBullets.splice(i, 1);

            if (enemyHp <= 0) endGame(true);
          }
        }
      }
    }

    function takeDamage(amount) {
      if (isGameOver || secretModeActive) return;
      myHp = Math.max(0, myHp - amount);
      document.getElementById('hp-you').style.width = myHp + '%';

      if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
      if (myHp <= 0) endGame(false);
    }

    function endGame(isWin) {
      isGameOver = true;
      isGamePlaying = false;
      const overlay = document.getElementById('result-overlay');
      const text = document.getElementById('result-text');

      overlay.classList.remove('hidden');
      if (isWin) {
        text.innerText = "YOU WIN! ☄️";
        text.className = "text-3xl font-extrabold text-cyan-400 tracking-wider";
      } else {
        text.innerText = "びしょ濡れ... LOSE ☔";
        text.className = "text-3xl font-extrabold text-rose-400 tracking-wider";
      }
    }

    function requestRetry() {
      myRetryReady = true;
      document.getElementById('retry-btn').disabled = true;
      document.getElementById('retry-btn').classList.add('opacity-50', 'cursor-not-allowed');

      if (conn && conn.open) conn.send({ type: 'retry_request' });

      updateRetryUI();
      checkBothReadyToReset();
    }

    function updateRetryUI() {
      const statusText = document.getElementById('retry-status-text');
      if (myRetryReady && enemyRetryReady) {
        statusText.innerText = "両者が準備完了！再開します...";
      } else if (myRetryReady) {
        statusText.innerText = "相手の「もう一度遊ぶ」を待っています...";
      } else if (enemyRetryReady) {
        statusText.innerText = "相手が「もう一度遊ぶ」を押しました！";
      }
    }

    function checkBothReadyToReset() {
      if (myRetryReady && enemyRetryReady) {
        setTimeout(() => { resetGame(); }, 800);
      }
    }

    function resetGame() {
      myHp = 100;
      enemyHp = 100;
      secretModeActive = false;
      tapPattern = [];
      updateSecretDotsUI();

      document.getElementById('hp-you').style.width = '100%';
      document.getElementById('hp-enemy').style.width = '100%';
      document.getElementById('warning-banner').classList.add('hidden');
      document.getElementById('tv-overlay').classList.add('hidden');
      document.getElementById('nuke-overlay').classList.remove('nuke-flash');

      myPos = { x: -6, z: 6, angle: 0 };
      enemyPos = { x: 6, z: -6, angle: Math.PI };
      cameraYaw = 0;
      cameraPitch = 0.25;

      waterBullets.forEach(b => scene.remove(b.mesh));
      waterBullets = [];

      meteors.forEach(m => scene.remove(m));
      meteors = [];

      clones.forEach(c => scene.remove(c));
      clones = [];

      isGameOver = false;
      myRetryReady = false;
      enemyRetryReady = false;

      document.getElementById('result-overlay').classList.add('hidden');
      document.getElementById('retry-btn').disabled = false;
      document.getElementById('retry-btn').classList.remove('opacity-50', 'cursor-not-allowed');
      document.getElementById('retry-status-text').innerText = "「もう一度遊ぶ」を押してください";

      startCountdown();
    }
  </script>
</body>
