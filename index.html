<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コンビニ店長シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; }
    .log-entry { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-2 sm:p-4">

  <!-- ヘッダー（ダッシュボード） -->
  <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4 shadow-xl flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">🏪</span>
      <div>
        <h1 class="font-black text-xl bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">マート・マスター</h1>
        <div class="text-xs text-slate-400">日 AUTOMATIC SIMULATOR</div>
      </div>
    </div>

    <div class="flex items-center space-x-6 bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
      <div>
        <div class="text-[10px] text-slate-500 font-bold">経過日数</div>
        <div id="day-display" class="text-lg font-black text-amber-400 font-mono">第 1 日目</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-500 font-bold">所持金</div>
        <div id="money-display" class="text-lg font-black text-emerald-400 font-mono">¥50,000</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-500 font-bold">本日の天候</div>
        <div id="weather-display" class="text-sm font-bold text-cyan-300">☀️ 晴れ</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-500 font-bold">評判</div>
        <div id="reputation-display" class="text-sm font-bold text-pink-400">⭐️ 50</div>
      </div>
    </div>

    <button id="btn-next-day" onclick="nextDay()" class="px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black rounded-xl text-sm transition shadow-lg active:scale-95">
      翌日へ進む ➔
    </button>
  </div>

  <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
    
    <!-- 左カラム: 仕入れ & 在庫管理 -->
    <div class="md:col-span-2 space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
        <h2 class="text-sm font-bold text-slate-300 mb-3 flex items-center justify-between">
          <span>📦 商品の仕入れ & 価格設定</span>
          <span class="text-xs text-slate-500 font-normal">棚容量: <span id="shelf-usage">0</span> / <span id="shelf-capacity">100</span> 個</span>
        </h2>

        <div id="item-list" class="space-y-3">
          <!-- 動的生成される商品カード -->
        </div>
      </div>

      <!-- 店舗設備 & バイト採用 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
        <h2 class="text-sm font-bold text-slate-300">🛠 店舗拡張 & 雇用</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
            <div>
              <div class="text-xs font-bold text-slate-200">大型陳列棚の追加</div>
              <div class="text-[10px] text-slate-500">容量 +50個 (コスト: ¥20,000)</div>
            </div>
            <button onclick="upgradeShelf()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg text-xs">拡張</button>
          </div>

          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
            <div>
              <div class="text-xs font-bold text-slate-200">アルバイト雇用</div>
              <div class="text-[10px] text-slate-500">ワンオペ防止/日給: ¥5,000</div>
              <div class="text-[10px] text-amber-400">現在: <span id="staff-count">0</span>人</div>
            </div>
            <button onclick="hireStaff()" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-xs">雇う</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右カラム: ニュース & 日報ログ -->
    <div class="space-y-4">
      <!-- ニュース・トレンド -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
        <h2 class="text-sm font-bold text-slate-300 mb-2">📰 本日のトレンド・噂</h2>
        <div id="news-box" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-amber-300 leading-relaxed font-mono">
          平和な一日になりそうだ...
        </div>
      </div>

      <!-- 日報・経営ログ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col h-[380px]">
        <h2 class="text-sm font-bold text-slate-300 mb-2">📋 営業ログ</h2>
        <div id="log-box" class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex-1 overflow-y-auto space-y-2 text-xs font-mono text-slate-300">
          <div class="text-slate-500">開店準備を整えて「翌日へ進む」を押してください。</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ゲームデータ
    let day = 1;
    let money = 50000;
    let reputation = 50;
    let shelfCapacity = 100;
    let staffCount = 0;

    const weathers = [
      { name: '☀️ 晴れ', factor: 1.2, itemBonus: 'ice' },
      { name: '☁️ 曇り', factor: 1.0, itemBonus: null },
      { name: '☔️ 雨', factor: 0.7, itemBonus: 'umbrella' },
      { name: '❄️ 猛暑/大雨', factor: 0.5, itemBonus: 'hot' }
    ];
    let currentWeather = weathers[0];

    const items = [
      { id: 'onigiri', name: 'おにぎり', icon: '🍙', cost: 80, price: 130, stock: 20, sales: 0, type: 'food' },
      { id: 'bento', name: '幕の内弁当', icon: '🍱', cost: 300, price: 500, stock: 10, sales: 0, type: 'food' },
      { id: 'drink', name: 'ペットボトル茶', icon: '🍵', cost: 60, price: 150, stock: 30, sales: 0, type: 'drink' },
      { id: 'ice', name: 'アイスクリーム', icon: '🍦', cost: 90, price: 160, stock: 0, sales: 0, type: 'ice' },
      { id: 'umbrella', name: 'ビニール傘', icon: '☂️', cost: 200, price: 600, stock: 0, sales: 0, type: 'umbrella' },
      { id: 'hotCoffee', name: 'カウンターコーヒー', icon: '☕️', cost: 40, price: 120, stock: 15, sales: 0, type: 'hot' }
    ];

    // UI初期化
    function initUI() {
      const list = document.getElementById('item-list');
      list.innerHTML = '';

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'bg-slate-950 p-3 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-2';
        div.innerHTML = `
          <div class="flex items-center space-x-3 w-36">
            <span class="text-2xl">${item.icon}</span>
            <div>
              <div class="text-xs font-bold text-slate-200">${item.name}</div>
              <div class="text-[10px] text-slate-400">原価: ¥${item.cost}</div>
            </div>
          </div>

          <div class="flex items-center space-x-2">
            <span class="text-[10px] text-slate-500">販売価格:</span>
            <input type="number" value="${item.price}" onchange="updatePrice('${item.id}', this.value)" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-emerald-400 font-mono font-bold text-center">
            <span class="text-xs text-slate-400">円</span>
          </div>

          <div class="flex items-center space-x-2">
            <span class="text-[10px] text-slate-500">在庫:</span>
            <span id="stock-${item.id}" class="text-xs font-bold font-mono text-cyan-400 w-8 text-right">${item.stock}</span>
          </div>

          <div class="flex space-x-1">
            <button onclick="buyStock('${item.id}', 10)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded">+10仕入</button>
            <button onclick="buyStock('${item.id}', 30)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded">+30仕入</button>
          </div>
        `;
        list.appendChild(div);
      });

      updateHeader();
    }

    function updateHeader() {
      document.getElementById('day-display').innerText = `第 ${day} 日目`;
      document.getElementById('money-display').innerText = `¥${money.toLocaleString()}`;
      document.getElementById('weather-display').innerText = currentWeather.name;
      document.getElementById('reputation-display').innerText = `⭐️ ${reputation}`;
      document.getElementById('staff-count').innerText = staffCount;

      const totalStock = items.reduce((sum, item) => sum + item.stock, 0);
      document.getElementById('shelf-usage').innerText = totalStock;
      document.getElementById('shelf-capacity').innerText = shelfCapacity;
    }

    function updatePrice(id, val) {
      const item = items.find(i => i.id === id);
      if (item) item.price = Math.max(0, parseInt(val) || 0);
    }

    function buyStock(id, count) {
      const item = items.find(i => i.id === id);
      const totalStock = items.reduce((sum, i) => sum + i.stock, 0);

      if (totalStock + count > shelfCapacity) {
        alert("陳列棚の容量オーバーです！棚を拡張するか在庫を減らしてください。");
        return;
      }

      const cost = item.cost * count;
      if (money < cost) {
        alert("資金が不足しています！");
        return;
      }

      money -= cost;
      item.stock += count;
      document.getElementById(`stock-${item.id}`).innerText = item.stock;
      updateHeader();
    }

    function upgradeShelf() {
      if (money < 20000) return alert("資金不足です（要 ¥20,000）");
      money -= 20000;
      shelfCapacity += 50;
      updateHeader();
      log("🛠 店舗を拡張して陳列容量を増やしました！", "text-cyan-400");
    }

    function hireStaff() {
      if (money < 5000) return alert("資金不足です（要 ¥5,000）");
      money -= 5000;
      staffCount++;
      updateHeader();
      log("👔 新しいアルバイトを採用しました！（人件費が発生します）", "text-amber-400");
    }

    // 日進進行ロジック
    function nextDay() {
      // 1. 人件費支払い
      const wages = staffCount * 5000;
      money -= wages;

      // 2. 営業計算
      let dayRevenue = 0;
      let dayProfit = 0;
      let logMessages = [];

      items.forEach(item => {
        if (item.stock <= 0) return;

        // 需要計算（価格感応度 + 天候補正）
        const idealPrice = item.cost * 1.8;
        let demandFactor = Math.max(0.1, 1.5 - (item.price / idealPrice));

        if (currentWeather.itemBonus === item.type) {
          demandFactor *= 2.0; // 特需
        }

        let baseVisitors = Math.floor((reputation * 0.8) + Math.random() * 20);
        let potentialSales = Math.floor(baseVisitors * demandFactor * currentWeather.factor);
        let actualSales = Math.min(item.stock, potentialSales);

        if (actualSales > 0) {
          item.stock -= actualSales;
          const revenue = actualSales * item.price;
          dayRevenue += revenue;
          logMessages.push(`${item.icon} ${item.name}: ${actualSales}個販売 (+¥${revenue.toLocaleString()})`);
        }
      });

      money += dayRevenue;

      // 3. ランダムイベント発生
      let eventText = "";
      const rand = Math.random();
      if (rand < 0.15) {
        // 万引き/トラブル
        if (staffCount === 0) {
          const loss = Math.floor(money * 0.05);
          money -= loss;
          reputation = Math.max(0, reputation - 5);
          eventText = `⚠️ 万引き被害！ワンオペだったため抑止できず ¥${loss.toLocaleString()} の損害。`;
        } else {
          eventText = `🛡 万引き未遂！アルバイトの目配りにより未然に防ぎました。`;
        }
      } else if (rand > 0.85) {
        // SNSでバズる
        reputation += 10;
        eventText = `✨ インフルエンサーに紹介されて評判が上がりました！（評判+10）`;
      }

      // 4. 天候更新
      currentWeather = weathers[Math.floor(Math.random() * weathers.length)];

      // 5. 画面更新 & ログ出力
      day++;
      initUI();

      // ログ書き出し
      log(`--- 【第 ${day - 1} 日目の営業結果】 ---`, "text-slate-400 font-bold");
      if (wages > 0) log(`💸 バイト人件費: -¥${wages.toLocaleString()}`, "text-rose-400");
      log(`💰 本日の総売上: +¥${dayRevenue.toLocaleString()}`, "text-emerald-400 font-bold");
      if (eventText) log(eventText, "text-amber-300");

      // ニュース更新
      let news = "特になし。平常通りの営業です。";
      if (currentWeather.itemBonus === 'ice') news = "🔥 明日は猛暑予報！冷たいアイスが爆売れの予感？";
      if (currentWeather.itemBonus === 'umbrella') news = "☔️ 明日は大雨予報！ビニール傘の在庫は大丈夫？";
      document.getElementById('news-box').innerText = news;

      // 破産判定
      if (money < 0) {
        alert("💸 資金が底をつき、店舗は倒産しました... ゲームオーバー！");
        location.reload();
      }
    }

    function log(msg, colorClass = "text-slate-300") {
      const box = document.getElementById('log-box');
      const div = document.createElement('div');
      div.className = `log-entry ${colorClass}`;
      div.innerText = msg;
      box.insertBefore(div, box.firstChild);
    }

    // 初期化実行
    initUI();
  </script>
</body>
</html>
