<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <!-- ★検索結果に表示させない設定★ -->
    <meta name="robots" content="noindex,nofollow">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-TRACKER PROTOCOL | PRIVATE NETWORK</title>

    <!-- 近未来フォント Exo 2 -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet (地図用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <!-- PubNub (リアルタイム通信用) -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

    <style>
        :root {
            --spy-red: #ff0033;
            --spy-cyan: #00ffff;
            --spy-dark-bg: #030303;
            --spy-card-bg: #0f0f0f;
            --glow-cyan: 0 0 10px rgba(0, 255, 255, 0.6);
            --glow-red: 0 0 10px rgba(255, 0, 51, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; font-weight: 300; }

        body {
            background-color: var(--spy-dark-bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border: 1px solid var(--spy-cyan); /* 画面外枠 */
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        /* --- ヘッダー（グリッチエフェクト付き） --- */
        header {
            background: rgba(15, 15, 15, 0.9);
            padding: 18px;
            text-align: center;
            border-bottom: 2px solid var(--spy-cyan);
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            position: relative;
            animation: glitch 3s infinite; /* グリッチアニメ */
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            1% { transform: translate(-2px, 2px); color: var(--spy-red); }
            2% { transform: translate(2px, -2px); color: var(--spy-cyan); }
            3% { transform: translate(0); }
        }

        header p {
            font-size: 0.7rem;
            color: var(--spy-red);
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: var(--glow-red);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
            width: 100%;
        }

        /* --- セクションタイトル（ネオン発光） --- */
        .section-title {
            font-size: 0.8rem;
            color: var(--spy-cyan);
            font-weight: 600;
            border-left: 3px solid var(--spy-red);
            padding-left: 10px;
            margin: 18px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--glow-cyan);
        }

        /* 地図（Mapping） */
        #map {
            height: 220px;
            width: 100%;
            border-radius: 4px;
            border: 1px solid var(--spy-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* カメラと操作系 */
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #333;
            margin-bottom: 12px;
        }

        video {
            width: 100%;
            display: block;
            max-height: 300px;
            object-fit: cover;
        }

        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--spy-red);
            padding: 5px 10px;
            border-radius: 2px;
            font-size: 0.7rem;
            color: var(--spy-red);
            font-family: monospace;
            letter-spacing: 1px;
            text-shadow: var(--glow-red);
        }

        /* 撮影ボタン（未来型） */
        .btn-capture {
            width: 100%;
            padding: 16px;
            background: none;
            color: var(--spy-cyan);
            border: 2px solid var(--spy-cyan);
            border-radius: 0; /* 角を尖らせる */
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: var(--glow-cyan), inset 0 0 10px rgba(0, 255, 255, 0.4);
            transition: all 0.2s;
        }

        .btn-capture:active {
            transform: scale(0.97);
            background: var(--spy-cyan);
            color: var(--spy-dark-bg);
            box-shadow: 0 0 30px var(--spy-cyan);
        }

        /* --- タイムライン（目撃フィード） --- */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-card {
            background: var(--spy-card-bg);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-top: 3px solid var(--spy-cyan);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .post-info {
            padding: 12px;
            font-size: 0.8rem;
        }

        .post-location {
            color: var(--spy-cyan);
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
            text-shadow: var(--glow-cyan);
        }

        .post-time {
            color: #ccc;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        /* 地図ポップアップ画像調整 */
        .leaflet-popup-content-wrapper { background: var(--spy-card-bg); border: 1px solid var(--spy-cyan); color: #fff; }
        .leaflet-popup-tip { background: var(--spy-cyan); }
        .leaflet-popup-content img { width: 100%; border-radius: 2px; }
    </style>
</head>
<body>

<header>
    <h1>S-TRACKER</h1>
    <p>CLASSIFIED / SPIDER NETWORK PROTOCOL</p>
</header>

<div class="container">
    <!-- 地図セクション -->
    <div class="section-title">GLOBAL MAPPING</div>
    <div id="map"></div>

    <!-- カメラセクション -->
    <div class="section-title">TARGET CAMERA</div>
    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="hud-overlay" id="hudLocation">INITIALIZING GPS...</div>
    </div>

    <button class="btn-capture" onclick="captureAndBroadcast()">UPLOAD TO NETWORK</button>

    <!-- フィードセクション -->
    <div class="section-title">LIVE PROTOCOL FEED</div>
    <div class="feed-list" id="feedList"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // --- PubNubの設定（デモキーを使用） ---
    const pubnub = new PubNub({
        publishKey: "demo",
        subscribeKey: "demo",
        userId: "protocol_agent_" + Math.floor(Math.random() * 100000)
    });

    const CHANNEL_NAME = "spider_tracker_noindex_protocol_2026"; // 独自の通信部屋

    // --- 地図（Leaflet）の初期化 ---
    let currentLat = 35.6812; // デフォルト位置（東京）
    let currentLng = 139.7671;
    
    const map = L.map('map', { attributionControl: false }).setView([currentLat, currentLng], 13);

    // ダークモード地図タイル（CartoDB Dark Matter）
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    }).addTo(map);

    // --- カメラとGPSのセットアップ ---
    const video = document.getElementById('webcam');
    const hudLocation = document.getElementById('hudLocation');

    // 外向きカメラの起動
    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" }, 
        audio: false 
    }).then(stream => {
        video.srcObject = stream;
    }).catch(err => {
        hudLocation.textContent = "CAMERA ERROR";
    });

    // 高精度GPS追跡
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(pos => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            hudLocation.textContent = `📍 ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
            
            // 地図移動
            map.setView([currentLat, currentLng]);
        }, err => {
            hudLocation.textContent = "GPS ERROR";
        });
    }

    // --- リアルタイム受信処理 ---
    pubnub.subscribe({ channels: [CHANNEL_NAME] });
    
    pubnub.addListener({
        message: (event) => {
            const data = event.message;
            addSightingToFeedAndMap(data);
        }
    });

    // --- 撮影およびデータ配信 ---
    function captureAndBroadcast() {
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        
        // 軽量化のため画像解像度を320x240に
        canvas.width = 320;
        canvas.height = 240;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // JPEG画像として保存（圧縮率40%）
        const imageData = canvas.toDataURL('image/jpeg', 0.4);

        const payload = {
            id: Date.now(),
            image: imageData,
            lat: currentLat,
            lng: currentLng,
            time: new Date().toLocaleTimeString()
        };

        // クラウドへアップロード
        pubnub.publish({
            channel: CHANNEL_NAME,
            message: payload
        });
    }

    // --- 画面への反映処理 ---
    function addSightingToFeedAndMap(data) {
        // ① 地図マーカーを追加
        const circleMarker = L.circleMarker([data.lat, data.lng], {
            color: '#00ffff', // シアン（発光効果用）
            fillColor: '#00ffff',
            fillOpacity: 0.8,
            radius: 9,
            weight: 3,
            className: 'glowing-marker' // 発光用CSSクラス
        }).addTo(map);

        circleMarker.bindPopup(`
            <div style="color:#00ffff; font-family: 'Exo 2', sans-serif;">
                <b style="color:var(--spy-red);">🕷️ DETECTED</b><br>
                <img src="${data.image}" style="margin-top:5px; border:1px solid var(--spy-cyan);"><br>
                <small style="color:#fff;">TIME: ${data.time}</small>
            </div>
        `, { maxWidth: 200 });

        // ② フィード一覧に追加
        const feedList = document.getElementById('feedList');
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
            <img src="${data.image}">
            <div class="post-info">
                <span class="post-location">📍 COORD: ${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}</span>
                <span class="post-time">⏱️ TIME: ${data.time}</span>
            </div>
        `;

        feedList.insertBefore(card, feedList.firstChild);
    }
</script>

</body>
</html>
