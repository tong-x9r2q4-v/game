<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC PeerJS 情報表示</title>
    <!-- PeerJS ライブラリの読み込み -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .status { font-weight: bold; color: #007bff; margin: 15px 0; }
        #info-display {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
            padding: 20px;
            border: 2px dashed #28a745;
            border-radius: 8px;
            margin-top: 20px;
            background-color: #f8fff9;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>NFC リアルタイム情報共有</h1>
    
    <!-- 受信モード（PCなどで表示する用） -->
    <div id="receiver-view">
        <p>あなたの接続用URL（これをNFCに書き込んでください）:</p>
        <p class="status" id="nfc-url">PeerJSに接続中...</p>
        
        <div id="info-display">NFCをかざすとここに情報が表示されます</div>
    </div>

    <!-- 送信モード（スマホでNFCを読み取った時に裏で動く用） -->
    <div id="sender-view" class="hidden">
        <p class="status">データを送信しています...</p>
        <p>送信完了後、この画面は閉じてかまいません。</p>
    </div>
</div>

<script>
    // URLのパラメータからルームID（相手のPeerID）を取得
    const urlParams = new URLSearchParams(window.location.search);
    const targetRoomId = urlParams.get('room');

    // PeerJSの初期化（無料のパブリックサーバーを利用）
    const peer = new Peer();

    peer.on('open', (id) => {
        if (!targetRoomId) {
            // 【受信側】ルームIDがない場合は、自分のURLを生成して表示
            const currentUrl = window.location.href.split('?')[0];
            const nfcUrl = `${currentUrl}?room=${id}`;
            document.getElementById('nfc-url').innerText = nfcUrl;
        } else {
            // 【送信側】ルームIDがある場合は、表示を切り替えて自動送信
            document.getElementById('receiver-view').classList.add('hidden');
            document.getElementById('sender-view').classList.remove('hidden');
            
            // 受信側に接続
            const conn = peer.connect(targetRoomId);
            conn.on('open', () => {
                // ここで送信したい「情報」を設定（例：スマホの時刻やメッセージなど）
                const dataToSend = `📱 スマホが接続されました！ (${new Date().toLocaleTimeString()})`;
                conn.send(dataToSend);
                
                // 送信後少し待って通信を終了
                setTimeout(() => conn.close(), 1000);
            });
        }
    });

    // 【受信側】データを受け取ったときの処理
    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            document.getElementById('info-display').innerText = data;
        });
    });
</script>
</body>
</html>
