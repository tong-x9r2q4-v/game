<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENBEI FACTORY AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-orange: #ff6600;
            --neon-gold: #ffcc00;
            --neon-cyan: #00ffff;
            --bg-dark: #0a0a0c;
            --panel-bg: rgba(20, 20, 28, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; user-select: none; }
        body { background: var(--bg-dark); color: #fff; max-width: 500px; margin: 0 auto; padding: 12px; }

        header {
            border-bottom: 2px solid var(--neon-orange);
            padding-bottom: 8px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        h1 { font-size: 1.1rem; color: var(--neon-orange); font-weight: 900; letter-spacing: 1px; }
        .version { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--neon-cyan); }

        /* スコア表示 */
        .score-board {
            background: var(--panel-bg); border: 1px solid var(--neon-gold);
            border-radius: 6px; padding: 12px; margin-bottom: 12px; text-align: center;
        }
        .score-val { font-family: 'Share Tech Mono', monospace; font-size: 1.8rem; color: var(--neon-gold); font-weight: bold; }
        .cps-val { font-size: 0.75rem; color: var(--neon-cyan); margin-top: 4px; }

        /* メインせんべいボタン */
        .click-area {
            display: flex; justify-content: center; margin: 20px 0;
        }
        .senbei-btn {
            width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle, #e68a00 0%, #995c00 100%);
            border: 4px solid var(--neon-gold);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
            font-size: 4rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.05s;
        }
        .senbei-btn:active { transform: scale(0.92); }

        /* ショップ & アップグレード */
        .section-title {
            font-size: 0.75rem; color: var(--neon-orange); border-left: 3px solid var(--neon-orange);
            padding-left: 6px; margin: 12px 0 6px 0; font-weight: bold;
        }
        
        .item-list { display: flex; flex-direction: column; gap: 6px; }
        .item-card {
            background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; padding: 8px 12px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer;
        }
        .item-card.disabled { opacity: 0.4; pointer-events: none; }
        .item-card:hover { border-color: var(--neon-cyan); }
        
        .item-name { font-size: 0.8rem; font-weight: bold; }
        .item-desc { font-size: 0.65rem; color: #aaa; }
        .item-cost { font-family: 'Share Tech Mono'; color: var(--neon-gold); font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>
    <h1>🍘 SENBEI FACTORY AI</h1>
    <div class="version">v1.0.0</div>
</header>

<!-- ポイント＆生産量表示 -->
<div class="score-board">
    <div class="score-val" id="count">0</div>
    <div style="font-size: 0.65rem; color: #aaa;">TOTAL SENBEI</div>
    <div class="cps-val">毎秒生産: <span id="cps">0</span> 枚/秒</div>
</div>

<!-- クリックボタン -->
<div class="click-area">
    <div class="senbei-btn" onclick="clickSenbei()">🍘</div>
</div>

<!-- AI装置（自動生産） -->
<div class="section-title">AI生産設備（自動生産）</div>
<div class="item-list" id="buildingList"></div>

<!-- AI味覚研究（強化） -->
<div class="section-title">AI味覚学習（製造効率アップ）</div>
<div class="item-list" id="upgradeList"></div>

<script>
    let senbeiCount = 0;
    let clickPower = 1;

    // 設備データ
    const buildings = [
        { id: 'b1', name: '全自動AI手焼き機', cost: 15, cps: 0.5, count: 0 },
        { id: 'b2', name: '醤油塗布ロボット', cost: 100, cps: 4, count: 0 },
        { id: 'b3', name: '高速AI焼きライン', cost: 1100, cps: 32, count: 0 },
        { id: 'b4', name: '量子せんべい工場', cost: 12000, cps: 260, count: 0 }
    ];

    // アップグレードデータ
    const upgrades = [
        { id: 'u1', name: '特製しょうゆ味', cost: 100, mult: 2, bought: false },
        { id: 'u2', name: '高級のり巻き', cost: 500, mult: 3, bought: false },
        { id: 'u3', name: '激辛トウガラシ', cost: 5000, mult: 5, bought: false }
    ];

    // クリック処理
    function clickSenbei() {
        senbeiCount += clickPower;
        updateUI();
    }

    // 総毎秒生産量（CPS）計算
    function getCPS() {
        return buildings.reduce((sum, b) => sum + (b.cps * b.count), 0);
    }

    // 設備購入
    function buyBuilding(index) {
        const b = buildings[index];
        if (senbeiCount >= b.cost) {
            senbeiCount -= b.cost;
            b.count++;
            b.cost = Math.floor(b.cost * 1.15); // 次のコスト上昇
            updateUI();
        }
    }

    // アップグレード購入
    function buyUpgrade(index) {
        const u = upgrades[index];
        if (senbeiCount >= u.cost && !u.bought) {
            senbeiCount -= u.cost;
            u.bought = true;
            clickPower *= u.mult;
            updateUI();
        }
    }

    // ゲームループ（1秒ごとに自動加算）
    setInterval(() => {
        senbeiCount += getCPS() / 10; // 0.1秒ごとに加算
        updateUI();
    }, 100);

    // UI更新処理
    function updateUI() {
        document.getElementById('count').textContent = Math.floor(senbeiCount).toLocaleString();
        document.getElementById('cps').textContent = getCPS().toFixed(1);

        // 設備リスト生成
        const bList = document.getElementById('buildingList');
        bList.innerHTML = '';
        buildings.forEach((b, i) => {
            const card = document.createElement('div');
            card.className = `item-card ${senbeiCount < b.cost ? 'disabled' : ''}`;
            card.onclick = () => buyBuilding(i);
            card.innerHTML = `
                <div>
                    <div class="item-name">${b.name} (${b.count}台)</div>
                    <div class="item-desc">+${b.cps} 枚/秒</div>
                </div>
                <div class="item-cost">${b.cost.toLocaleString()} 🍘</div>
            `;
            bList.appendChild(card);
        });

        // アップグレードリスト生成
        const uList = document.getElementById('upgradeList');
        uList.innerHTML = '';
        upgrades.forEach((u, i) => {
            if (!u.bought) {
                const card = document.createElement('div');
                card.className = `item-card ${senbeiCount < u.cost ? 'disabled' : ''}`;
                card.onclick = () => buyUpgrade(i);
                card.innerHTML = `
                    <div>
                        <div class="item-name">${u.name}</div>
                        <div class="item-desc">手焼きパワー ${u.mult}倍</div>
                    </div>
                    <div class="item-cost">${u.cost.toLocaleString()} 🍘</div>
                `;
                uList.appendChild(card);
            }
        });
    }

    updateUI();
</script>

</body>
</html>
