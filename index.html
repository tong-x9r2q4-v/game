<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEDROOM HQ SECURITY GATE</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05050a;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      text-align: center;
      user-select: none;
    }
    .full-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      padding: 20px;
      transition: background 0.3s;
    }
    .gate-box {
      border: 2px solid #00ff66;
      border-radius: 12px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
      background: rgba(0, 20, 10, 0.6);
    }
    h1 { font-size: 18px; letter-spacing: 2px; margin: 0 0 5px 0; }
    .subtitle { color: #888; font-size: 11px; margin-bottom: 25px; }
    .status-text {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hint { font-size: 12px; color: #555; margin-top: 15px; }
    
    video, canvas { display: none; } /* カメラ処理は裏で行うため隠す */

    /* 警告画面 */
    .denied { background: #350000 !important; color: #ff3333 !important; }
    .denied .gate-box { border-color: #ff3333; box-shadow: 0 0 25px rgba(255, 51, 51, 0.8); background: rgba(40, 0, 0, 0.8); }
  </style>
</head>
<body onclick="enableGate()">

<div id="main-screen" class="full-screen">
  <div class="gate-box">
    <h1>BEDROOM HQ SECURITY</h1>
    <div class="subtitle">--- FULL MOTION & NFC GATE ---</div>
    
    <div id="status" class="status-text">👆 画面を1回タップして<br>セキュリティ監視を起動</div>
    <div id="hint" class="hint">タッチで認証 / 無断通過で警報</div>
  </div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" width="160" height="120"></canvas>

<script>
const CEO_CARD_ID = "04:aa:65:a6:72:26:81";

let isRunning = false;
let audioCtx = null;
let isAuthorized = false; // 通過許可フラグ
let authTimer = null;
let resetTimer = null;
let lastFrameData = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function enableGate() {
  initAudio();

  if (!isRunning) {
    playTone(880, 0.1);
    setTimeout(() => playTone(1760, 0.1), 100);

    document.getElementById('hint').style.display = 'none';
    requestWakeLock();
    isRunning = true;
    
    await startCamera();
    startNfcLoop();
  }
}

// 1. カメラ動体検知（無断通過監視）
async function startCamera() {
  try {
    const video = document.getElementById('video');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    video.srcObject = stream;
    setInterval(detectMotion, 150); // 150msごとに動きをチェック
  } catch (err) {
    console.log("カメラエラー: " + err);
  }
}

function detectMotion() {
  if (!isRunning) return;

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

  if (lastFrameData) {
    let diff = 0;
    // 画素の変化量を計算
    for (let i = 0; i < currentFrame.data.length; i += 4) {
      diff += Math.abs(currentFrame.data[i] - lastFrameData.data[i]);
    }

    // 人が前を横切った（大きな動きを検知）
    if (diff > 600000) { 
      if (!isAuthorized) {
        // カード未かざし（無断通過） ➔ 🚨 警報発動！
        triggerInruderAlarm();
      }
    }
  }
  lastFrameData = currentFrame;
}

// 2. NFC待機ループ
async function startNfcLoop() {
  const statusDiv = document.getElementById('status');

  if (!('NDEFReader' in window)) {
    statusDiv.innerText = "エラー: Web NFC非対応環境です";
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    
    statusDiv.innerText = "🟢 監視中...\nカードをタッチして通過してください";
    statusDiv.style.color = "#00ff66";

    ndef.addEventListener("reading", ({ serialNumber }) => {
      handleCardScan(serialNumber);
    });

  } catch (error) {
    statusDiv.innerText = "NFCエラー: " + error;
    setTimeout(startNfcLoop, 3000);
  }
}

// 3. カードタッチ判定
function handleCardScan(serialNumber) {
  const statusDiv = document.getElementById('status');
  const screen = document.getElementById('main-screen');

  initAudio();
  clearTimeout(authTimer);
  clearTimeout(resetTimer);

  if (serialNumber === CEO_CARD_ID) {
    // 【正規通過】認証成功
    isAuthorized = true; // カメラの警報を10秒間解除
    screen.className = "full-screen";
    statusDiv.innerText = "【ACCESS GRANTED】\nようこそCEO\n(10秒以内に通過してください)";
    statusDiv.style.color = "#00ff66";
    playTone(880, 0.2);

    // 10秒経過したら自動で再び「ロック状態」へ
    authTimer = setTimeout(() => {
      isAuthorized = false;
      statusDiv.innerText = "🟢 監視中...\nカードをタッチして通過してください";
    }, 10000);

  } else {
    // 未登録カード
    triggerInruderAlarm("🚨【ACCESS DENIED】\n未登録のカードです");
  }
}

// 4. 侵入警報処理
function triggerInruderAlarm(msg = "🚨【WARNING】\n無断通過を検知しました！") {
  const statusDiv = document.getElementById('status');
  const screen = document.getElementById('main-screen');

  initAudio();
  clearTimeout(resetTimer);

  screen.className = "full-screen denied";
  statusDiv.innerText = msg;
  playAlarm();

  // 5秒後に監視状態へ復帰
  resetTimer = setTimeout(() => {
    screen.className = "full-screen";
    statusDiv.innerText = "🟢 監視中...\nカードをタッチして通過してください";
    statusDiv.style.color = "#00ff66";
  }, 5000);
}

// 音声処理
function playTone(freq, duration) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.value = 0.3;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playAlarm() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4); // ウーというサイレン音
  gain.gain.value = 0.5;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);
}

async function requestWakeLock() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (err) {}
}
</script>

</body>
</html>
