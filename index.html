<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tong Typing</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
}

header {
    height: 70px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #007aff;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #666;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #34c759;
}

.container {
    width: min(1100px, calc(100% - 32px));
    margin: 40px auto;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: clamp(38px, 6vw, 64px);
    margin: 0;
    letter-spacing: -3px;
}

.hero p {
    color: #777;
    font-size: 17px;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 10px 35px rgba(0,0,0,.07);
    margin-bottom: 22px;
}

.room-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-size: 14px;
    color: #666;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 14px;
    font-size: 16px;
    outline: none;
    background: #fafafa;
}

input:focus,
select:focus {
    border-color: #007aff;
    background: white;
}

button {
    border: 0;
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
}

.primary {
    background: #007aff;
    color: white;
}

.secondary {
    background: #eee;
    color: #222;
}

.full {
    width: 100%;
    margin-top: 15px;
}

.room-code {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 8px;
    text-align: center;
    margin: 20px 0;
}

.hidden {
    display: none !important;
}

.players {
    display: grid;
    gap: 10px;
}

.player {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 18px;
    background: #f5f5f7;
    border-radius: 14px;
}

.player-name {
    font-weight: 700;
}

.ready {
    color: #34c759;
    font-weight: 700;
}

.waiting {
    color: #999;
}

.game {
    text-align: center;
}

.timer {
    font-size: 48px;
    font-weight: 800;
}

.progress {
    height: 10px;
    background: #eee;
    border-radius: 99px;
    overflow: hidden;
    margin: 20px 0;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #007aff;
    transition: width .1s linear;
}

.question {
    font-size: 27px;
    font-weight: 700;
    line-height: 1.7;
    background: #f5f5f7;
    border-radius: 18px;
    padding: 25px;
    margin: 20px 0;
}

.typing-input {
    font-size: 22px;
    text-align: center;
    padding: 18px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.stat {
    background: #f5f5f7;
    padding: 20px;
    border-radius: 16px;
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
}

.stat-label {
    color: #777;
    font-size: 13px;
}

.ranking {
    display: grid;
    gap: 10px;
}

.rank {
    display: grid;
    grid-template-columns: 55px 1fr 100px;
    align-items: center;
    padding: 15px;
    border-radius: 14px;
    background: #f5f5f7;
}

.rank-number {
    font-size: 22px;
    font-weight: 800;
}

.rank-score {
    text-align: right;
    font-weight: 700;
}

.message {
    margin-top: 12px;
    color: #666;
    text-align: center;
    min-height: 22px;
}

@media (max-width: 700px) {
    .room-area {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .question {
        font-size: 21px;
    }

    header {
        padding: 0 16px;
    }

    .container {
        margin-top: 25px;
    }
}
</style>

</head>

<body>

<header>
    <div class="logo">Tong<span>Typing</span></div>

```
<div class="status">
    <div class="status-dot"></div>
    <span id="connectionStatus">オンライン</span>
</div>
```

</header>

<main class="container">

```
<section class="hero">
    <h1>みんなでタイピング。</h1>
    <p>学校の授業やタイピング大会に。</p>
</section>

<!-- ルーム作成 -->
<section id="roomSetup" class="card">

    <div class="room-area">

        <div>
            <h2>先生として開始</h2>

            <label for="teacherName">
                先生の名前
            </label>

            <input
                id="teacherName"
                type="text"
                placeholder="先生"
                maxlength="20"
            >

            <label
                for="duration"
                style="margin-top:15px;"
            >
                制限時間
            </label>

            <select id="duration">
                <option value="30">30秒</option>
                <option value="60" selected>60秒</option>
                <option value="120">120秒</option>
            </select>

            <button
                id="createRoom"
                class="primary full"
            >
                ルームを作成
            </button>
        </div>

        <div>
            <h2>生徒として参加</h2>

            <label for="studentName">
                名前
            </label>

            <input
                id="studentName"
                type="text"
                placeholder="名前"
                maxlength="20"
            >

            <label
                for="roomInput"
                style="margin-top:15px;"
            >
                ルームコード
            </label>

            <input
                id="roomInput"
                type="text"
                placeholder="例：482913"
                maxlength="6"
                inputmode="numeric"
            >

            <button
                id="joinRoom"
                class="secondary full"
            >
                ルームに参加
            </button>
        </div>

    </div>

    <div
        id="setupMessage"
        class="message"
    ></div>

</section>


<!-- 待機室 -->
<section
    id="waitingRoom"
    class="card hidden"
>

    <h2>🏫 タイピングルーム</h2>

    <div class="room-code" id="roomCode">
        ------
    </div>

    <p style="text-align:center;color:#777;">
        このコードをクラスのみんなに共有してください
    </p>

    <h3>参加者</h3>

    <div
        id="players"
        class="players"
    ></div>

    <button
        id="startGame"
        class="primary full"
    >
        タイピング開始
    </button>

    <button
        id="leaveRoom"
        class="secondary full"
    >
        ルームを退出
    </button>

</section>


<!-- ゲーム -->
<section
    id="gameScreen"
    class="card game hidden"
>

    <div class="timer">
        <span id="timer">60</span>秒
    </div>

    <div class="progress">
        <div
            id="progressBar"
            class="progress-bar"
        ></div>
    </div>

    <div
        id="question"
        class="question"
    >
        準備してください
    </div>

    <input
        id="typingInput"
        class="typing-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="ここに入力"
    >

    <div class="stats">

        <div class="stat">
            <div
                id="speed"
                class="stat-value"
            >
                0
            </div>
            <div class="stat-label">
                CPM
            </div>
        </div>

        <div class="stat">
            <div
                id="accuracy"
                class="stat-value"
            >
                100%
            </div>
            <div class="stat-label">
                正確率
            </div>
        </div>

        <div class="stat">
            <div
                id="mistakes"
                class="stat-value"
            >
                0
            </div>
            <div class="stat-label">
                ミス
            </div>
        </div>

    </div>

</section>


<!-- 結果 -->
<section
    id="resultScreen"
    class="card hidden"
>

    <h2>🎉 タイピング終了</h2>

    <div class="stats">

        <div class="stat">
            <div
                id="finalSpeed"
                class="stat-value"
            >
                0
            </div>
            <div class="stat-label">
                CPM
            </div>
        </div>

        <div class="stat">
            <div
                id="finalAccuracy"
                class="stat-value"
            >
                100%
            </div>
            <div class="stat-label">
                正確率
            </div>
        </div>

        <div class="stat">
            <div
                id="finalMistakes"
                class="stat-value"
            >
                0
            </div>
            <div class="stat-label">
                ミス
            </div>
        </div>

    </div>

    <h3 style="margin-top:30px;">
        🏆 現在の順位
    </h3>

    <div
        id="ranking"
        class="ranking"
    ></div>

    <button
        id="backToRoom"
        class="secondary full"
    >
        待機室に戻る
    </button>

</section>
```

</main>

<script>

const questions = [
    "今日は楽しくタイピングを練習しましょう。",
    "正確に入力することを意識しましょう。",
    "コンピューターを上手に使いこなしましょう。",
    "毎日少しずつ練習することが上達への近道です。",
    "学校で楽しくタイピング大会を開催しましょう。",
    "速さだけではなく正確さも大切です。",
    "新しい技術を楽しく学びましょう。",
    "集中して一文字ずつ入力しましょう。"
];

let roomCode = "";
let playerName = "";
let isTeacher = false;

let players = [];

let gameTime = 60;
let remainingTime = 60;
let timerInterval = null;

let currentQuestion = "";
let startTime = 0;

let typedCharacters = 0;
let correctCharacters = 0;
let mistakes = 0;

const roomSetup = document.getElementById("roomSetup");
const waitingRoom = document.getElementById("waitingRoom");
const gameScreen = document.getElementById("gameScreen");
const resultScreen = document.getElementById("resultScreen");

const setupMessage = document.getElementById("setupMessage");

function generateRoomCode() {

    return Math.floor(
        100000 + Math.random() * 900000
    ).toString();

}

function showMessage(text) {

    setupMessage.textContent = text;

}

function createPlayer(name, teacher = false) {

    return {
        name: name || "名無し",
        teacher,
        score: 0,
        accuracy: 100,
        ready: true
    };

}

function renderPlayers() {

    const container =
        document.getElementById("players");

    container.innerHTML = "";

    players.forEach(player => {

        const div =
            document.createElement("div");

        div.className = "player";

        div.innerHTML = `
            <div>
                <div class="player-name">
                    ${escapeHtml(player.name)}
                </div>
                <small>
                    ${player.teacher ? "先生" : "生徒"}
                </small>
            </div>

            <div class="ready">
                ● 準備OK
            </div>
        `;

        container.appendChild(div);

    });

}

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

document
    .getElementById("createRoom")
    .addEventListener("click", () => {

        const name =
            document
                .getElementById("teacherName")
                .value
                .trim();

        playerName = name || "先生";

        isTeacher = true;

        roomCode = generateRoomCode();

        players = [
            createPlayer(
                playerName,
                true
            )
        ];

        document
            .getElementById("roomCode")
            .textContent = roomCode;

        renderPlayers();

        roomSetup.classList.add("hidden");
        waitingRoom.classList.remove("hidden");

    });


document
    .getElementById("joinRoom")
    .addEventListener("click", () => {

        const name =
            document
                .getElementById("studentName")
                .value
                .trim();

        const code =
            document
                .getElementById("roomInput")
                .value
                .trim();

        if (!name) {

            showMessage(
                "名前を入力してください。"
            );

            return;

        }

        if (!/^\d{6}$/.test(code)) {

            showMessage(
                "6桁のルームコードを入力してください。"
            );

            return;

        }

        playerName = name;

        isTeacher = false;

        roomCode = code;

        players = [
            createPlayer(
                playerName,
                false
            )
        ];

        document
            .getElementById("roomCode")
            .textContent = roomCode;

        renderPlayers();

        roomSetup.classList.add("hidden");
        waitingRoom.classList.remove("hidden");

        showMessage("");

    });


document
    .getElementById("startGame")
    .addEventListener("click", startGame);


function startGame() {

    gameTime =
        Number(
            document
                .getElementById("duration")
                .value
        ) || 60;

    remainingTime = gameTime;

    typedCharacters = 0;
    correctCharacters = 0;
    mistakes = 0;

    currentQuestion =
        questions[
            Math.floor(
                Math.random() * questions.length
            )
        ];

    document
        .getElementById("question")
        .textContent =
            currentQuestion;

    document
        .getElementById("typingInput")
        .value = "";

    document
        .getElementById("timer")
        .textContent =
            remainingTime;

    document
        .getElementById("speed")
        .textContent = "0";

    document
        .getElementById("accuracy")
        .textContent = "100%";

    document
        .getElementById("mistakes")
        .textContent = "0";

    waitingRoom.classList.add("hidden");
    resultScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    startTime = Date.now();

    document
        .getElementById("typingInput")
        .focus();

    clearInterval(timerInterval);

    timerInterval =
        setInterval(() => {

            remainingTime--;

            document
                .getElementById("timer")
                .textContent =
                    remainingTime;

            const progress =
                ((gameTime - remainingTime)
                / gameTime) * 100;

            document
                .getElementById("progressBar")
                .style.width =
                    `${progress}%`;

            updateStats();

            if (remainingTime <= 0) {

                finishGame();

            }

        }, 1000);

}


document
    .getElementById("typingInput")
    .addEventListener("input", event => {

        const value =
            event.target.value;

        typedCharacters =
            value.length;

        let correct = 0;

        for (
            let i = 0;
            i < value.length;
            i++
        ) {

            if (
                value[i] ===
                currentQuestion[i]
            ) {

                correct++;

            }

        }

        correctCharacters = correct;

        mistakes =
            typedCharacters -
            correctCharacters;

        if (
            value === currentQuestion
        ) {

            players[0].score +=
                correctCharacters;

            currentQuestion =
                questions[
                    Math.floor(
                        Math.random() *
                        questions.length
                    )
                ];

            event.target.value = "";

            document
                .getElementById("question")
                .textContent =
                    currentQuestion;

            typedCharacters = 0;
            correctCharacters = 0;
            mistakes = 0;

        }

        updateStats();

    });


function updateStats() {

    const elapsed =
        Math.max(
            (Date.now() - startTime) / 60000,
            0.001
        );

    const cpm =
        Math.round(
            correctCharacters / elapsed
        );

    const accuracy =
        typedCharacters > 0
            ? Math.round(
                correctCharacters /
                typedCharacters *
                100
            )
            : 100;

    document
        .getElementById("speed")
        .textContent =
            cpm;

    document
        .getElementById("accuracy")
        .textContent =
            `${accuracy}%`;

    document
        .getElementById("mistakes")
        .textContent =
            mistakes;

}


function finishGame() {

    clearInterval(timerInterval);

    updateStats();

    const elapsed =
        Math.max(
            (Date.now() - startTime) / 60000,
            0.001
        );

    const cpm =
        Math.round(
            correctCharacters / elapsed
        );

    const accuracy =
        typedCharacters > 0
            ? Math.round(
                correctCharacters /
                typedCharacters *
                100
            )
            : 100;

    document
        .getElementById("finalSpeed")
        .textContent =
            cpm;

    document
        .getElementById("finalAccuracy")
        .textContent =
            `${accuracy}%`;

    document
        .getElementById("finalMistakes")
        .textContent =
            mistakes;

    players[0].score = cpm;
    players[0].accuracy = accuracy;

    renderRanking();

    gameScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

}


function renderRanking() {

    const ranking =
        document.getElementById("ranking");

    ranking.innerHTML = "";

    const sorted =
        [...players].sort(
            (a, b) =>
                b.score - a.score
        );

    sorted.forEach(
        (player, index) => {

            const div =
                document.createElement("div");

            div.className = "rank";

            div.innerHTML = `
                <div class="rank-number">
                    ${index + 1}
                </div>

                <div>
                    <strong>
                        ${escapeHtml(player.name)}
                    </strong>
                </div>

                <div class="rank-score">
                    ${player.score} CPM
                </div>
            `;

            ranking.appendChild(div);

        }
    );

}


document
    .getElementById("leaveRoom")
    .addEventListener("click", () => {

        clearInterval(timerInterval);

        roomSetup.classList.remove("hidden");
        waitingRoom.classList.add("hidden");

    });


document
    .getElementById("backToRoom")
    .addEventListener("click", () => {

        resultScreen.classList.add("hidden");
        waitingRoom.classList.remove("hidden");

        renderPlayers();

    });

</script>

</body>
</html>
