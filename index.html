<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtime P2P Water Balloon Fight</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #111; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; text-align: center;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      max-width: 600px; margin: 0 auto; background: #222;
    }
    canvas {
      display: block; width: 100%; height: 100%; background: #87CEEB;
    }
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 15px;
    }
    .interactive { pointer-events: auto; }
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10;
    }
    .hidden { display: none !important; }
    button {
      padding: 12px 24px; font-size: 18px; font-weight: bold;
      background: #ff4757; color: white; border: none; border-radius: 8px;
      cursor: pointer; margin: 10px; box-shadow: 0 4px 0 #2f3542;
    }
    button:active { transform: translateY(4px); box-shadow: none; }
    input[type="text"] {
      padding: 10px; font-size: 16px; border-radius: 4px; border: none;
      text-align: center; margin-bottom: 10px; width: 80%; max-width: 300px;
    }
    .peer-id-display {
      font-size: 24px; font-weight: bold; color: #eccc68;
      letter-spacing: 2px; margin: 10px 0; user-select: all;
    }
    .hud {
      display: flex; justify-content: space-between; width: 100%;
      font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000;
    }
    .hp-bar-container {
      width: 40%; height: 20px; background: #555; border-radius: 10px; overflow: hidden; border: 2px solid #fff;
    }
    .hp-bar { height: 100%; background: #2ed573; transition: width 0.2s; }
    #controls {
      display: flex; justify-content: space-between; width: 100%; padding-bottom: 20px;
    }
    .btn-group { display: flex; gap: 10px; }
    .ctrl-btn {
      width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.3);
      border: 2px solid #fff; color: white; font-size: 20px;
      display: flex; justify-content: center; align-items: center; user-select: none;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.6); }
    #tv-effect {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.5s;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
    }
    #tv-effect.active { opacity: 1; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="tv-effect"></div>

  <!-- UI Layer -->
  <div class="ui-layer">
    <div class="hud">
      <div style="width: 45%;">
        <div>YOU</div>
        <div class="hp-bar-container"><div id="my-hp" class="hp-bar" style="width: 100%;"></div></div>
      </div>
      <div style="width: 45%; text-align: right;">
        <div>ENEMY</div>
        <div class="hp-bar-container" style="margin-left: auto;"><div id="enemy-hp" class="hp-bar" style="width: 100%;"></div></div>
      </div>
    </div>

    <div id="controls" class="interactive">
      <div class="btn-group">
        <div id="btn-left" class="ctrl-btn">◀</div>
        <div id="btn-right" class="ctrl-btn">▶</div>
      </div>
      <div id="btn-shoot" class="ctrl-btn" style="background: rgba(255,71,87,0.6);">💧</div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="screen interactive">
    <h1>水鉄砲 P2P バトル</h1>
    <p>あなたのID:</p>
    <div id="my-id" class="peer-id-display">接続中...</div>
    <br>
    <input type="text" id="join-id" placeholder="相手のIDを入力">
    <button id="btn-connect">対戦開始</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="screen hidden interactive">
    <h1 id="game-result">RESULT</h1>
    <button id="btn-restart">もう一度遊ぶ</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // PeerJS & Network Setup
  let peer = new Peer();
  let conn = null;
  let myPeerId = '';

  peer.on('open', (id) => {
    myPeerId = id;
    document.getElementById('my-id').innerText = id;
  });

  peer.on('connection', (c) => {
    conn = c;
    setupConnection();
  });

  document.getElementById('btn-connect').addEventListener('click', () => {
    const destId = document.getElementById('join-id').value.trim();
    if (destId) {
      conn = peer.connect(destId);
      setupConnection();
    }
  });

  function setupConnection() {
    conn.on('open', () => {
      document.getElementById('start-screen').classList.add('hidden');
      initGame();
    });

    conn.on('data', (data) => {
      handleNetworkData(data);
    });

    conn.on('close', () => {
      alert('通信が切断されました');
      location.reload();
    });
  }

  // Game State Variables
  let gameState = 'WAITING'; // WAITING, PLAYING, GAMEOVER
  const MAX_HP = 100;
  let myHp = MAX_HP;
  let enemyHp = MAX_HP;

  let player = { x: 0, y: 0, radius: 20, speed: 5 };
  let enemy = { x: 0, y: 0, radius: 20 };
  let bullets = []; // { x, y, vx, vy, isMine }
  let particles = [];
  let meteors = [];

  // Input Handling
  let keys = { left: false, right: false };

  // Secret SOS Sequence Logic
  let tapTimings = [];
  let pressStartTime = 0;
  let secretModeActive = false;
  let clones = [];
  const SOS_PATTERN = ['S', 'S', 'S', 'L', 'L', 'L', 'S', 'S', 'S']; // S: 短, L: 長

  const btnShoot = document.getElementById('btn-shoot');

  function handlePressStart(e) {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;
    pressStartTime = Date.now();
    shootWater();
  }

  function handlePressEnd(e) {
    e.preventDefault();
    if (gameState !== 'PLAYING' || pressStartTime === 0) return;
    const duration = Date.now() - pressStartTime;
    pressStartTime = 0;

    const type = duration < 200 ? 'S' : 'L';
    tapTimings.push(type);
    if (tapTimings.length > SOS_PATTERN.length) {
      tapTimings.shift();
    }

    // Check SOS Pattern match
    if (tapTimings.length === SOS_PATTERN.length && tapTimings.every((val, index) => val === SOS_PATTERN[index])) {
      triggerSecretMode();
      tapTimings = [];
    }
  }

  btnShoot.addEventListener('touchstart', handlePressStart, { passive: false });
  btnShoot.addEventListener('touchend', handlePressEnd, { passive: false });
  btnShoot.addEventListener('mousedown', handlePressStart);
  btnShoot.addEventListener('mouseup', handlePressEnd);

  // Movement Controls Setup
  const bindTouch = (elem, keyName) => {
    elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; }, { passive: false });
    elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; }, { passive: false });
    elem.addEventListener('mousedown', () => keys[keyName] = true);
    elem.addEventListener('mouseup', () => keys[keyName] = false);
  };
  bindTouch(document.getElementById('btn-left'), 'left');
  bindTouch(document.getElementById('btn-right'), 'right');

  function initGame() {
    myHp = MAX_HP;
    enemyHp = MAX_HP;
    updateHPUI();

    player.x = canvas.width / 2;
    player.y = canvas.height - 50;
    enemy.x = canvas.width / 2;
    enemy.y = 50;

    bullets = [];
    particles = [];
    meteors = [];
    clones = [];
    secretModeActive = false;
    document.getElementById('tv-effect').classList.remove('active');

    gameState = 'PLAYING';
    requestAnimationFrame(gameLoop);
  }

  function shootWater() {
    const bullet = {
      x: player.x,
      y: player.y - player.radius,
      vx: (Math.random() - 0.5) * 2,
      vy: -10,
      isMine: true
    };
    bullets.push(bullet);

    // Send bullet coordinates relative to opponent's view (flipped Y)
    if (conn && conn.open) {
      conn.send({
        type: 'shoot',
        x: canvas.width - bullet.x, // Flip X relative to screen width
        y: canvas.height - bullet.y,
        vx: -bullet.vx,
        vy: -bullet.vy
      });
    }
  }

  function triggerSecretMode() {
    if (secretModeActive) return;
    secretModeActive = true;

    // 相手に秘密モード発動を即座に同期通知
    if (conn && conn.open) {
      conn.send({ type: 'triggerSecret' });
    }

    startSecretSequence();
  }

  function startSecretSequence() {
    document.getElementById('tv-effect').classList.add('active');

    // Create Clones
    clones = [
      { x: canvas.width * 0.2, y: canvas.height - 50 },
      { x: canvas.width * 0.8, y: canvas.height - 50 }
    ];

    // Rapid firing interval
    const cloneShootInterval = setInterval(() => {
      if (gameState !== 'PLAYING') {
        clearInterval(cloneShootInterval);
        return;
      }
      clones.forEach(c => {
        bullets.push({
          x: c.x, y: c.y - 20,
          vx: (Math.random() - 0.5) * 4, vy: -12,
          isMine: true
        });
      });
    }, 150);

    // Spawn Meteors after delay
    setTimeout(() => {
      if (gameState !== 'PLAYING') return;
      for (let i = 0; i < 15; i++) {
        meteors.push({
          x: Math.random() * canvas.width,
          y: -Math.random() * 300,
          radius: 15 + Math.random() * 20,
          vy: 3 + Math.random() * 4
        });
      }
    }, 3000);

    // Big Explosion & Victory Execution
    setTimeout(() => {
      clearInterval(cloneShootInterval);
      if (gameState === 'PLAYING') {
        triggerBigExplosion();
      }
    }, 12000);
  }

  function triggerBigExplosion() {
    for (let i = 0; i < 150; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 20,
        vy: (Math.random() - 0.5) * 20,
        radius: Math.random() * 8 + 2,
        color: ['#ff4757', '#ffa502', '#2ed573', '#1e90ff'][Math.floor(Math.random() * 4)],
        life: 100
      });
    }

    setTimeout(() => {
      // 発動者側：勝利メッセージの確定＆相手へ敗北コマンド送信
      if (conn && conn.open) {
        conn.send({ type: 'secretDefeat' });
      }
      endGame(true);
    }, 1500);
  }

  function handleNetworkData(data) {
    if (data.type === 'pos') {
      enemy.x = canvas.width - data.x; // Invert X axis for relative positioning
    } else if (data.type === 'shoot') {
      bullets.push({
        x: data.x,
        y: data.y,
        vx: data.vx,
        vy: data.vy,
        isMine: false
      });
    } else if (data.type === 'hit') {
      enemyHp = Math.max(0, enemyHp - data.damage);
      updateHPUI();
      if (enemyHp <= 0) endGame(true);
    } else if (data.type === 'triggerSecret') {
      // 受信側でも secretModeActive フラグを正しくセットして同期を開始
      secretModeActive = true;
      startSecretSequence();
    } else if (data.type === 'secretDefeat') {
      // 相手からの秘術演出による敗北通知を受信
      myHp = 0;
      updateHPUI();
      endGame(false);
    }
  }

  function updateHPUI() {
    document.getElementById('my-hp').style.width = (myHp / MAX_HP * 100) + '%';
    document.getElementById('enemy-hp').style.width = (enemyHp / MAX_HP * 100) + '%';
  }

  function gameLoop() {
    if (gameState !== 'PLAYING') return;

    // Player Movement Update
    if (keys.left && player.x - player.radius > 0) player.x -= player.speed;
    if (keys.right && player.x + player.radius < canvas.width) player.x += player.speed;

    // Send Position
    if (conn && conn.open) {
      conn.send({ type: 'pos', x: player.x });
    }

    // Clear Canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Render Clones
    clones.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(30, 144, 255, 0.5)';
      ctx.fill();
      ctx.closePath();
    });

    // Render Player
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#1e90ff';
    ctx.fill();
    ctx.closePath();

    // Render Enemy
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4757';
    ctx.fill();
    ctx.closePath();

    // Update & Render Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;

      ctx.beginPath();
      ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = b.isMine ? '#70a1ff' : '#ff6b81';
      ctx.fill();
      ctx.closePath();

      // Hit Detection on Self (Only check enemy bullets)
      if (!b.isMine) {
        let dist = Math.hypot(b.x - player.x, b.y - player.y);
        if (dist < player.radius + 6) {
          bullets.splice(i, 1);
          takeDamage(10);
          continue;
        }
      }

      // Out of bounds cleanup
      if (b.y < 0 || b.y > canvas.height || b.x < 0 || b.x > canvas.width) {
        bullets.splice(i, 1);
      }
    }

    // Update & Render Meteors
    for (let i = meteors.length - 1; i >= 0; i--) {
      let m = meteors[i];
      m.y += m.vy;

      ctx.beginPath();
      ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ff6348';
      ctx.fill();
      ctx.closePath();

      // Hit Check on Player
      let dist = Math.hypot(m.x - player.x, m.y - player.y);
      if (dist < player.radius + m.radius) {
        takeDamage(15);
        meteors.splice(i, 1);
        continue;
      }

      if (m.y > canvas.height + 50) meteors.splice(i, 1);
    }

    // Update & Render Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.closePath();

      if (p.life <= 0) particles.splice(i, 1);
    }

    requestAnimationFrame(gameLoop);
  }

  function takeDamage(dmg) {
    myHp = Math.max(0, myHp - dmg);
    updateHPUI();

    if (conn && conn.open) {
      conn.send({ type: 'hit', damage: dmg });
    }

    if (myHp <= 0) {
      endGame(false);
    }
  }

  function endGame(isWin) {
    gameState = 'GAMEOVER';
    const screen = document.getElementById('gameover-screen');
    const resultText = document.getElementById('game-result');

    resultText.innerText = isWin ? 'YOU WIN!' : 'YOU LOSE...';
    resultText.style.color = isWin ? '#2ed573' : '#ff4757';
    screen.classList.remove('hidden');
  }

  document.getElementById('btn-restart').addEventListener('click', () => {
    location.reload();
  });
</script>
</body>
</html>
