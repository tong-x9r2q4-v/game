<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>P2P リアルタイム タンクバトル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-2 select-none">

  <!-- 1. ロビー画面 -->
  <div id="lobby-view" class="w-full max-w-sm bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-6 text-center">
    <div>
      <div class="text-4xl mb-2">💣</div>
      <h1 class="text-xl font-bold text-slate-100">P2P Tank Battle</h1>
      <p class="text-xs text-slate-400 mt-1">1ファイルで動くリアルタイム対戦シューティング</p>
    </div>

    <!-- ホスト -->
    <div class="p-4 bg-slate-700/50 rounded-2xl border border-slate-600 space-y-3">
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">部屋を作る（Host）</h2>
      <button onclick="createRoom()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-sm transition">
        ルームIDを発行
      </button>
      <div id="room-id-display" class="hidden p-2 bg-slate-900 rounded-lg text-xs font-mono text-emerald-400 border border-emerald-500/30 break-all select-all"></div>
    </div>

    <div class="text-xs text-slate-500 font-bold">OR</div>

    <!-- ゲスト -->
    <div class="p-4 bg-slate-700/50 rounded-2xl border border-slate-600 space-y-3">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">部屋に入る（Guest）</h2>
      <input type="text" id="join-room-id" placeholder="相手のルームIDを入力" 
        class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-xl text-xs text-center font-mono text-white focus:outline-none focus:border-amber-400">
      <button onclick="joinRoom()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 font-bold rounded-xl text-sm transition">
        対戦に参加
      </button>
    </div>

    <p id="status-text" class="text-xs text-slate-400">接続待機中...</p>
  </div>

  <!-- 2. ゲーム画面 -->
  <div id="game-view" class="hidden flex-col items-center space-y-2">
    <!-- HPバー -->
    <div class="flex items-center justify-between w-[320px] px-4 py-2 bg-slate-800 rounded-2xl border border-slate-700">
      <div class="text-left w-28">
        <div class="text-[10px] text-indigo-400 font-bold">YOU (HP)</div>
        <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden mt-1">
          <div id="hp-you" class="bg-indigo-500 h-full w-full transition-all"></div>
        </div>
      </div>
      <div class="text-xs font-bold text-slate-500">VS</div>
      <div class="text-right w-28">
        <div class="text-[10px] text-rose-400 font-bold">ENEMY (HP)</div>
        <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden mt-1">
          <div id="hp-enemy" class="bg-rose-500 h-full w-full transition-all"></div>
        </div>
      </div>
    </div>

    <!-- ゲームキャンバス -->
    <canvas id="gameCanvas" width="320" height="320" class="bg-slate-950 rounded-2xl border-2 border-slate-700 shadow-2xl"></canvas>

    <!-- モバイル用コントローラー -->
    <div class="w-[320px] grid grid-cols-3 gap-2 pt-2">
      <div class="grid grid-cols-3 gap-1 col-span-2">
        <div></div>
        <button onmousedown="inputs.up=true" onmouseup="inputs.up=false" ontouchstart="inputs.up=true" ontouchend="inputs.up=false" class="bg-slate-800 p-3 rounded-xl active:bg-slate-700 text-center">▲</button>
        <div></div>
        <button onmousedown="inputs.left=true" onmouseup="inputs.left=false" ontouchstart="inputs.left=true" ontouchend="inputs.left=false" class="bg-slate-800 p-3 rounded-xl active:bg-slate-700 text-center">◀</button>
        <button onmousedown="inputs.down=true" onmouseup="inputs.down=false" ontouchstart="inputs.down=true" ontouchend="inputs.down=false" class="bg-slate-800 p-3 rounded-xl active:bg-slate-700 text-center">▼</button>
        <button onmousedown="inputs.right=true" onmouseup="inputs.right=false" ontouchstart="inputs.right=true" ontouchend="inputs.right=false" class="bg-slate-800 p-3 rounded-xl active:bg-slate-700 text-center">▶</button>
      </div>
      <div class="flex items-center justify-center">
        <button onclick="shoot()" class="w-full h-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 font-bold rounded-2xl text-xs shadow-lg">
          FIRE<br>🔥
        </button>
      </div>
    </div>
  </div>

  <script>
    let peer = null, conn = null, isHost = false;
    const CANVAS_SIZE = 320;
    let canvas, ctx;

    // ゲーム状態
    let myHp = 100, enemyHp = 100;
    let myTank = { x: 50, y: 270, angle: -Math.PI/2 };
    let enemyTank = { x: 270, y: 50, angle: Math.PI/2 };
    let bullets = []; // {x, y, vx, vy, isMy}

    // 障害物（固定ブロック）
    const obstacles = [
      { x: 60, y: 120, w: 60, h: 20 },
      { x: 200, y: 180, w: 60, h: 20 },
      { x: 140, y: 140, w: 40, h: 40 }
    ];

    // 入力状態
    const inputs = { up: false, down: false, left: false, right: false };

    // キーボード操作対応
    window.addEventListener('keydown', (e) => {
      if(e.key === 'w' || e.key === 'ArrowUp') inputs.up = true;
      if(e.key === 's' || e.key === 'ArrowDown') inputs.down = true;
      if(e.key === 'a' || e.key === 'ArrowLeft') inputs.left = true;
      if(e.key === 'd' || e.key === 'ArrowRight') inputs.right = true;
      if(e.key === ' ') shoot();
    });
    window.addEventListener('keyup', (e) => {
      if(e.key === 'w' || e.key === 'ArrowUp') inputs.up = false;
      if(e.key === 's' || e.key === 'ArrowDown') inputs.down = false;
      if(e.key === 'a' || e.key === 'ArrowLeft') inputs.left = false;
      if(e.key === 'd' || e.key === 'ArrowRight') inputs.right = false;
    });

    // --- P2P接続 ---
    function createRoom() {
      peer = new Peer();
      peer.on('open', (id) => {
        isHost = true;
        document.getElementById('room-id-display').innerText = id;
        document.getElementById('room-id-display').classList.remove('hidden');
        document.getElementById('status-text').innerText = "相手の接続を待っています...";
      });
      peer.on('connection', (c) => { conn = c; setupCommunication(); });
    }

    function joinRoom() {
      const id = document.getElementById('join-room-id').value.trim();
      if(!id) return alert("IDを入力してください");
      peer = new Peer();
      peer.on('open', () => {
        isHost = false;
        conn = peer.connect(id);
        setupCommunication();
      });
    }

    function setupCommunication() {
      conn.on('open', () => {
        document.getElementById('lobby-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        initGame();
      });

      conn.on('data', (data) => {
        if (data.type === 'state') {
          // 相手の位置受取（座標反転）
          enemyTank.x = CANVAS_SIZE - data.tank.x;
          enemyTank.y = CANVAS_SIZE - data.tank.y;
          enemyTank.angle = data.tank.angle + Math.PI;

          // 相手が撃った弾を追加
          if (data.newBullet) {
            bullets.push({
              x: CANVAS_SIZE - data.newBullet.x,
              y: CANVAS_SIZE - data.newBullet.y,
              vx: -data.newBullet.vx,
              vy: -data.newBullet.vy,
              isMy: false
            });
          }
        }
      });
    }

    // --- ゲームループ ---
    function initGame() {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      requestAnimationFrame(gameLoop);
    }

    let lastShot = 0;
    function shoot() {
      const now = Date.now();
      if (now - lastShot < 400 || myHp <= 0) return; // 連射制限
      lastShot = now;

      const b = {
        x: myTank.x + Math.cos(myTank.angle) * 15,
        y: myTank.y + Math.sin(myTank.angle) * 15,
        vx: Math.cos(myTank.angle) * 5,
        vy: Math.sin(myTank.angle) * 5,
        isMy: true
      };
      bullets.push(b);

      // 弾を撃ったイベントを送る
      if (conn && conn.open) {
        conn.send({
          type: 'state',
          tank: myTank,
          newBullet: { x: b.x, y: b.y, vx: b.vx, vy: b.vy }
        });
      }

      if (navigator.vibrate) navigator.vibrate(30);
    }

    function gameLoop() {
      updateTank();
      updateBullets();
      
      // 定期的に自機位置を送信
      if (conn && conn.open && Math.random() < 0.3) {
        conn.send({ type: 'state', tank: myTank });
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function updateTank() {
      if (myHp <= 0) return;
      const speed = 2;
      const rotSpeed = 0.05;

      if (inputs.left) myTank.angle -= rotSpeed;
      if (inputs.right) myTank.angle += rotSpeed;

      let nextX = myTank.x;
      let nextY = myTank.y;

      if (inputs.up) {
        nextX += Math.cos(myTank.angle) * speed;
        nextY += Math.sin(myTank.angle) * speed;
      }
      if (inputs.down) {
        nextX -= Math.cos(myTank.angle) * speed;
        nextY -= Math.sin(myTank.angle) * speed;
      }

      // 壁・障害物判定
      if (nextX > 10 && nextX < CANVAS_SIZE - 10 && nextY > 10 && nextY < CANVAS_SIZE - 10) {
        let collide = false;
        for (let obs of obstacles) {
          if (nextX > obs.x && nextX < obs.x + obs.w && nextY > obs.y && nextY < obs.y + obs.h) {
            collide = true;
            break;
          }
        }
        if (!collide) {
          myTank.x = nextX;
          myTank.y = nextY;
        }
      }
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // 壁判定
        if (b.x < 0 || b.x > CANVAS_SIZE || b.y < 0 || b.y > CANVAS_SIZE) {
          bullets.splice(i, 1);
          continue;
        }

        // 障害物判定
        let hitObs = false;
        for (let obs of obstacles) {
          if (b.x > obs.x && b.x < obs.x + obs.w && b.y > obs.y && b.y < obs.y + obs.h) {
            hitObs = true;
            break;
          }
        }
        if (hitObs) {
          bullets.splice(i, 1);
          continue;
        }

        // 敵の弾が「自分」に当たったか判定
        if (!b.isMy) {
          const dist = Math.hypot(b.x - myTank.x, b.y - myTank.y);
          if (dist < 12) {
            myHp = Math.max(0, myHp - 15);
            document.getElementById('hp-you').style.width = myHp + '%';
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            bullets.splice(i, 1);
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // 障害物描画
      ctx.fillStyle = '#475569';
      for (let obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }

      // 弾描画
      for (let b of bullets) {
        ctx.fillStyle = b.isMy ? '#818cf8' : '#f87171';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 自機（青）
      drawTank(myTank.x, myTank.y, myTank.angle, '#6366f1');
      // 敵機（赤）
      drawTank(enemyTank.x, enemyTank.y, enemyTank.angle, '#f43f5e');
    }

    function drawTank(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // 車体
      ctx.fillStyle = color;
      ctx.fillRect(-10, -10, 20, 20);

      // 砲身
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -2, 14, 4);

      ctx.restore();
    }
  </script>
</body>
</html>
