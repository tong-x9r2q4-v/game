<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mob Rush - 広告風大群バトル</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      touch-action: none;
    }
    .info {
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="600"></canvas>
  <div class="info">左右にドラッグして「倍率ゲート」を通ろう！</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let score = 0;
    let playerX = canvas.width / 2;
    let isDragging = false;

    // 自軍プレイヤーの大群データ
    let mobList = [];
    const MOB_RADIUS = 5;

    // 障害物・ゲート・敵軍のデータ
    let gates = [];
    let enemies = [];
    let speed = 3;
    let frame = 0;

    // タッチ/マウス操作
    function handleMove(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      playerX = (clientX - rect.left) * (canvas.width / rect.width);
      if (playerX < 30) playerX = 30;
      if (playerX > canvas.width - 30) playerX = canvas.width - 30;
    }

    canvas.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e); if(!isPlaying) startGame(); });
    canvas.addEventListener('mousemove', (e) => { if (isDragging) handleMove(e); });
    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('touchstart', (e) => { isDragging = true; handleMove(e); if(!isPlaying) startGame(); });
    canvas.addEventListener('touchmove', (e) => { if (isDragging) handleMove(e); });
    window.addEventListener('touchend', () => isDragging = false);

    function startGame() {
      isPlaying = true;
      score = 0;
      speed = 3.5;
      frame = 0;
      playerX = canvas.width / 2;
      mobList = [{ x: playerX, y: 500 }];
      gates = [];
      enemies = [];
      loop();
    }

    // 大群の人数を増減する処理
    function adjustMobCount(targetCount) {
      targetCount = Math.min(Math.max(1, targetCount), 200); // 最大200人制限
      while (mobList.length < targetCount) {
        // 集団の近くに新メンバーをポップ
        const leader = mobList[0] || { x: playerX, y: 500 };
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (Math.sqrt(mobList.length) * 4);
        mobList.push({
          x: leader.x + Math.cos(angle) * dist,
          y: leader.y + Math.sin(angle) * dist
        });
      }
      while (mobList.length > targetCount) {
        mobList.pop();
      }
    }

    // ゲート生成（「+10」や「×2」など）
    function spawnGate() {
      const isMultiplier = Math.random() > 0.4;
      const val1 = isMultiplier ? Math.floor(Math.random() * 2) + 2 : Math.floor(Math.random() * 15) + 5;
      const val2 = isMultiplier ? Math.floor(Math.random() * 2) + 2 : Math.floor(Math.random() * 10) + 1;

      gates.push({
        y: -60,
        left: { type: isMultiplier ? 'mul' : 'add', val: val1 },
        right: { type: 'add', val: val2 }
      });
    }

    // 敵の大群生成（押し寄せる壁）
    function spawnEnemyCluster() {
      const enemyCount = Math.floor(mobList.length * (0.8 + Math.random() * 0.6)) + 5;
      const clusterX = Math.random() * (canvas.width - 120) + 60;
      let cluster = [];
      
      for (let i = 0; i < enemyCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (Math.sqrt(enemyCount) * 4);
        cluster.push({
          x: clusterX + Math.cos(angle) * dist,
          y: -80 + Math.sin(angle) * dist
        });
      }
      enemies.push(cluster);
    }

    function loop() {
      if (!isPlaying) return;
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 1. プレイヤー（青い大群）の移動演算 ---
      const leaderY = 500;
      mobList.forEach((m, idx) => {
        if (idx === 0) {
          m.x += (playerX - m.x) * 0.2;
          m.y = leaderY;
        } else {
          // リーダーを追従して固まる物理挙動
          const target = mobList[0];
          const dx = target.x - m.x;
          const dy = target.y - m.y;
          m.x += dx * 0.08 + (Math.random() - 0.5) * 2;
          m.y += dy * 0.08 + (Math.random() - 0.5) * 2;
        }

        // 描画（自軍青色）
        ctx.beginPath();
        ctx.arc(m.x, m.y, MOB_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
      });

      // 人数カウンター描画
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      if (mobList.length > 0) {
        ctx.fillText(`👥 ${mobList.length}`, mobList[0].x, mobList[0].y - 25);
      }

      // --- 2. ゲートの移動と判定 ---
      if (frame % 120 === 0) spawnGate();

      for (let i = gates.length - 1; i >= 0; i--) {
        let g = gates[i];
        g.y += speed;

        // 左ゲート
        ctx.fillStyle = 'rgba(14, 165, 233, 0.7)';
        ctx.fillRect(10, g.y, canvas.width / 2 - 15, 40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(g.left.type === 'mul' ? `×${g.left.val}` : `+${g.left.val}`, canvas.width / 4, g.y + 25);

        // 右ゲート
        ctx.fillStyle = 'rgba(59, 130, 246, 0.7)';
        ctx.fillRect(canvas.width / 2 + 5, g.y, canvas.width / 2 - 15, 40);
        ctx.fillText(g.right.type === 'mul' ? `×${g.right.val}` : `+${g.right.val}`, (canvas.width / 4) * 3, g.y + 25);

        // 接触判定
        if (g.y > leaderY - 20 && g.y < leaderY + 20) {
          const chosenGate = playerX < canvas.width / 2 ? g.left : g.right;
          let newCount = mobList.length;
          if (chosenGate.type === 'mul') newCount *= chosenGate.val;
          else newCount += chosenGate.val;

          adjustMobCount(newCount);
          gates.splice(i, 1);
        } else if (g.y > canvas.height) {
          gates.splice(i, 1);
        }
      }

      // --- 3. 敵軍（赤色）の移動とぶつかり合い（バトル） ---
      if (frame % 180 === 0) spawnEnemyCluster();

      for (let i = enemies.length - 1; i >= 0; i--) {
        let cluster = enemies[i];
        let clusterY = 0;

        cluster.forEach(e => {
          e.y += speed * 0.8;
          clusterY = e.y;

          // 赤い敵描画
          ctx.beginPath();
          ctx.arc(e.x, e.y, MOB_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = '#ef4444';
          ctx.fill();
        });

        // 敵人数表示
        ctx.fillStyle = '#fca5a5';
        ctx.font = 'bold 14px sans-serif';
        if (cluster.length > 0) {
          ctx.fillText(`👿 ${cluster.length}`, cluster[0].x, cluster[0].y - 15);
        }

        // 自軍との激突（押し引き・相殺バトル）
        if (clusterY > leaderY - 40 && clusterY < leaderY + 40) {
          // お互いの人数を同時に減らす
          const killRate = 2; // 相殺スピード
          for (let k = 0; k < killRate; k++) {
            if (mobList.length > 0 && cluster.length > 0) {
              mobList.pop();
              cluster.pop();
              score += 10;
            }
          }

          if (cluster.length === 0) {
            enemies.splice(i, 1);
          }

          if (mobList.length === 0) {
            isPlaying = false;
            drawGameOver();
            return;
          }
        } else if (clusterY > canvas.height + 50) {
          enemies.splice(i, 1);
        }
      }

      // スコア描画
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 15, 30);

      requestAnimationFrame(loop);
    }

    function drawStartScreen() {
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('MOB RUSH', canvas.width / 2, 220);

      ctx.fillStyle = '#fff';
      ctx.font = '14px sans-serif';
      ctx.fillText('ドラッグしてスタート！', canvas.width / 2, 300);
      ctx.fillText('「×2」を通って99人以上を目指せ！', canvas.width / 2, 330);
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('全滅...', canvas.width / 2, 240);

      ctx.fillStyle = '#fff';
      ctx.font = '16px sans-serif';
      ctx.fillText(`撃破スコア: ${score} pt`, canvas.width / 2, 290);

      ctx.fillStyle = '#38bdf8';
      ctx.font = '14px sans-serif';
      ctx.fillText('タップしてリトライ', canvas.width / 2, 350);
    }

    drawStartScreen();
  </script>
</body>
</html>
