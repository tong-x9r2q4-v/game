<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 検索結果に表示させない設定 -->
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENBEI TRACKER | PRIVATE NETWORK</title>

    <!-- 近未来フォント Exo 2 -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet (地図用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <!-- PubNub (リアルタイム通信用) -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

    <style>
        :root {
            --spy-red: #ff0033;
            --spy-cyan: #00ffff;
            --spy-gold: #ffcc00;
            --spy-dark-bg: #030303;
            --spy-card-bg: #0f0f0f;
            --glow-cyan: 0 0 10px rgba(0, 255, 255, 0.6);
            --glow-red: 0 0 10px rgba(255, 0, 51, 0.6);
            --glow-gold: 0 0 10px rgba(255, 204, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; font-weight: 300; }

        body {
            background-color: var(--spy-dark-bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border: 1px solid var(--spy-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        /* ヘッダー */
        header {
            background: rgba(15, 15, 15, 0.9);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--spy-cyan);
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            1% { transform: translate(-2px, 2px); color: var(--spy-red); }
            2% { transform: translate(2px, -2px); color: var(--spy-cyan); }
            3% { transform: translate(0); }
        }

        header p {
            font-size: 0.7rem;
            color: var(--spy-red);
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: var(--glow-red);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
            width: 100%;
        }

        /* ポイント表示パネル */
        .point-box {
            background: rgba(255, 204, 0, 0.1);
            border: 1px solid var(--spy-gold);
            padding: 10px 15px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: var(--glow-gold);
        }

        .point-title {
            font-size: 0.85rem;
            color: var(--spy-gold);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .point-val {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--spy-gold);
            text-shadow: var(--glow-gold);
        }

        /* セクションタイトル */
        .section-title {
            font-size: 0.8rem;
            color: var(--spy-cyan);
            font-weight: 600;
            border-left: 3px solid var(--spy-red);
            padding-left: 10px;
            margin: 18px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--glow-cyan);
        }

        /* 地図 */
        #map {
            height: 200px;
            width: 100%;
            border-radius: 4px;
            border: 1px solid var(--spy-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* カメラ */
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #333;
            margin-bottom: 12px;
        }

        video {
            width: 100%;
            display: block;
            max-height: 250px;
            object-fit: cover;
        }

        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--spy-red);
            padding: 5px 10px;
            border-radius: 2px;
            font-size: 0.7rem;
            color: var(--spy-red);
            font-family: monospace;
            text-shadow: var(--glow-red);
        }

        /* 撮影ボタン */
        .btn-capture {
            width: 100%;
            padding: 16px;
            background: none;
            color: var(--spy-cyan);
            border: 2px solid var(--spy-cyan);
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: var(--glow-cyan), inset 0 0 10px rgba(0, 255, 255, 0.4);
            transition: all 0.2s;
        }

        .btn-capture:active {
            transform: scale(0.97);
            background: var(--spy-cyan);
            color: var(--spy-dark-bg);
        }

        /* 過去画像ギャラリー */
        .gallery-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .gallery-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid var(--spy-cyan);
            border-radius: 4px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery-thumb:hover {
            transform: scale(1.05);
            box-shadow: var(--glow-cyan);
        }

        /* タイムライン */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-card {
            background: var(--spy-card-bg);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-top: 3px solid var(--spy-cyan);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .post-info {
            padding: 12px;
            font-size: 0.8rem;
        }

        .post-location {
            color: var(--spy-cyan);
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
            text-shadow: var(--glow-cyan);
        }

        .post-time { color: #ccc; font-size: 0.75rem; }

        /* ポップアップ */
        .leaflet-popup-content-wrapper { background: var(--spy-card-bg); border: 1px solid var(--spy-cyan); color: #fff; }
        .leaflet-popup-tip { background: var(--spy-cyan); }
        .leaflet-popup-content img { width: 100%; border-radius: 2px; }
    </style>
</head>
<body>

<header>
    <h1>🧸 SENBEI TRACKER</h1>
    <p>ぬいぐるみのせんべい捜索ネットワーク</p>
</header>

<div class="container">
    <!-- ポイント表示 -->
    <div class="point-box">
        <span class="point-title">🏆 獲得ポイント</span>
        <span class="point-val"><span id="pointCount">0</span> PT</span>
    </div>

    <!-- 地図セクション -->
    <div class="section-title">MAPPING（目撃エリア）</div>
    <div id="map"></div>

    <!-- カメラセクション -->
    <div class="section-title">TARGET CAMERA（せんべいを撮影）</div>
    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="hud-overlay" id="hudLocation">GPS 取得中...</div>
    </div>

    <button class="btn-capture" onclick="captureAndBroadcast()">📸 目撃情報を共有 (+100PT)</button>

    <!-- 過去画像ログ -->
    <div class="section-title">IMAGE LOG（過去の撮影ログ）</div>
    <div class="gallery-container" id="galleryList"></div>

    <!-- フィードセクション -->
    <div class="section-title">LIVE FEED（最新目撃情報）</div>
    <div class="feed-list" id="feedList"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // --- PubNubの設定 ---
    const pubnub = new PubNub({
        publishKey: "demo",
        subscribeKey: "demo",
        userId: "senbei_tracker_" + Math.floor(Math.random() * 100000)
    });

    const CHANNEL_NAME = "senbei_nuigurumi_tracker_2026";

    // --- ポイント管理（ローカルストレージ保存） ---
    let userPoints = parseInt(localStorage.getItem('senbei_points') || '0');
    document.getElementById('pointCount').textContent = userPoints;

    function addPoints(pt) {
        userPoints += pt;
        localStorage.setItem('senbei_points', userPoints);
        document.getElementById('pointCount').textContent = userPoints;
    }

    // --- 地図の初期化 ---
    let currentLat = 35.6812;
    let currentLng = 139.7671;
    
    const map = L.map('map', { attributionControl: false }).setView([currentLat, currentLng], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    }).addTo(map);

    // --- カメラ & GPS ---
    const video = document.getElementById('webcam');
    const hudLocation = document.getElementById('hudLocation');

    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" }, 
        audio: false 
    }).then(stream => {
        video.srcObject = stream;
    }).catch(err => {
        hudLocation.textContent = "カメラエラー";
    });

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(pos => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            hudLocation.textContent = `📍 ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
            map.setView([currentLat, currentLng]);
        }, err => {
            hudLocation.textContent = "GPS エラー";
        });
    }

    // --- リアルタイム受信 ---
    pubnub.subscribe({ channels: [CHANNEL_NAME] });
    
    pubnub.addListener({
        message: (event) => {
            addSightingToFeedAndMap(event.message);
        }
    });

    // --- 撮影 ＆ 送信 ---
    function captureAndBroadcast() {
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        
        canvas.width = 320;
        canvas.height = 240;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/jpeg', 0.4);

        const payload = {
            id: Date.now(),
            image: imageData,
            lat: currentLat,
            lng: currentLng,
            time: new Date().toLocaleTimeString()
        };

        // ポイント加算
        addPoints(100);

        // クラウドへ送信
        pubnub.publish({
            channel: CHANNEL_NAME,
            message: payload
        });
    }

    // --- 画面更新（地図・フィード・過去ログ） ---
    function addSightingToFeedAndMap(data) {
        // ① 地図マーカー追加
        const circleMarker = L.circleMarker([data.lat, data.lng], {
            color: '#00ffff',
            fillColor: '#00ffff',
            fillOpacity: 0.8,
            radius: 9,
            weight: 3
        }).addTo(map);

        circleMarker.bindPopup(`
            <div style="color:#00ffff; font-family: 'Exo 2', sans-serif;">
                <b style="color:var(--spy-gold);">🧸 せんべい目撃！</b><br>
                <img src="${data.image}" style="margin-top:5px; border:1px solid var(--spy-cyan);"><br>
                <small style="color:#fff;">時間: ${data.time}</small>
            </div>
        `, { maxWidth: 200 });

        // ② フィード追加
        const feedList = document.getElementById('feedList');
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
            <img src="${data.image}">
            <div class="post-info">
                <span class="post-location">📍 位置: ${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}</span>
                <span class="post-time">⏱️ 時刻: ${data.time}</span>
            </div>
        `;
        feedList.insertBefore(card, feedList.firstChild);

        // ③ 過去画像ログに追加
        const galleryList = document.getElementById('galleryList');
        const imgThumb = document.createElement('img');
        imgThumb.src = data.image;
        imgThumb.className = 'gallery-thumb';
        imgThumb.onclick = () => window.open(data.image, '_blank');
        galleryList.insertBefore(imgThumb, galleryList.firstChild);
    }
</script>

</body>
</html>
