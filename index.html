<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC ID Reader</title>
  <style>
    body { background: #111; color: #fff; font-family: monospace; text-align: center; padding: 20px; }
    button { background: #00ff66; color: #000; font-size: 18px; font-weight: bold; padding: 15px 30px; border: none; border-radius: 8px; margin-bottom: 20px; }
    .card { background: #222; border: 2px solid #444; border-radius: 8px; padding: 20px; margin-top: 15px; }
    .id-text { font-size: 22px; color: #00ff66; word-break: break-all; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>NFC ID 読み取りテスト</h2>
  <button onclick="startScan()">1. スキャン開始</button>
  <div id="log">ボタンを押してカードをかざしてください</div>

  <div class="card">
    <div>検出された固有ID (serialNumber):</div>
    <div id="result-id" class="id-text">---</div>
  </div>

<script>
async function startScan() {
  const log = document.getElementById('log');
  const resultId = document.getElementById('result-id');

  if (!('NDEFReader' in window)) {
    log.innerText = '⚠️ このブラウザ/端末は Web NFC に未対応です (AndroidのChromeで開いてください)';
    log.style.color = '#ff4444';
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    log.innerText = '📲 スマホの裏にカードをかざしてください...';
    log.style.color = '#ffff00';

    ndef.addEventListener("reading", ({ serialNumber }) => {
      if (serialNumber) {
        resultId.innerText = serialNumber;
        log.innerText = '✅ 読み取り成功！';
        log.style.color = '#00ff66';
        
        // ピコッと電子音を鳴らす
        playBeep();
      } else {
        resultId.innerText = 'IDなし（タグデータのみ）';
      }
    });
  } catch (error) {
    log.innerText = 'エラー: ' + error;
    log.style.color = '#ff4444';
  }
}

function playBeep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.frequency.value = 1000;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.1);
}
</script>

</body>
</html>
