<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC GATE STABLE</title>
  <style>
    body {
      background: #08080c;
      color: #00ff66;
      font-family: monospace;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }
    .box {
      border: 2px solid #00ff66;
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      margin: 0 auto;
      background: rgba(0, 20, 10, 0.6);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
    }
    h1 { font-size: 18px; margin-bottom: 5px; }
    #status {
      font-size: 20px;
      font-weight: bold;
      margin: 30px 0;
      min-height: 80px;
      white-space: pre-wrap;
    }
    button {
      background: #00ff66;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      padding: 14px 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .denied {
      background: #250505 !important;
      color: #ff4444 !important;
    }
    .denied .box { border-color: #ff4444; background: rgba(30, 0, 0, 0.6); }
  </style>
</head>
<body>

<div class="box" id="gateBox">
  <h1>BEDROOM GATE</h1>
  <p style="color:#888; font-size:12px;">NFC STABLE MODE</p>
  
  <button id="startBtn" onclick="initNfc()">システムを起動する</button>
  
  <div id="status">ボタンを押して起動してください</div>
</div>

<script>
const CEO_CARD_ID = "04:aa:65:a6:72:26:81";
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function initNfc() {
  unlockAudio();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('startBtn');

  if (!('NDEFReader' in window)) {
    statusEl.innerText = "エラー: このブラウザはWeb NFCに対応していません";
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    
    // 起動成功したらボタンを隠して監視中にする
    btn.style.display = 'none';
    statusEl.innerText = "🟢 監視中...\nカードをかざしてください";

    ndef.onreading = (event) => {
      unlockAudio();
      const serialNumber = event.serialNumber;
      
      if (serialNumber === CEO_CARD_ID) {
        // 許可
        document.body.className = "";
        statusEl.innerText = `【ACCESS GRANTED】\nようこそ、CEO\n(ID: ${serialNumber})`;
        playTone(880, 0.3);
      } else {
        // 拒否
        document.body.className = "denied";
        statusEl.innerText = `🚨【ACCESS DENIED】\n未登録のカードです\n(ID: ${serialNumber})`;
        playTone(200, 0.5);
      }
    };

    ndef.onreadingerror = () => {
      statusEl.innerText = "⚠️ 読み取りエラー\nもう一度かざしてください";
    };

  } catch (error) {
    statusEl.innerText = "NFC起動エラー:\n" + error + "\n\n※ページを再読み込みしてやり直してください";
  }
}

function playTone(freq, duration) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  gain.gain.value = 0.3;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
</script>

</body>
</html>
