<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEON BUMPER - Touch Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { user-select: none; touch-action: manipulation; }
    .cheat-active { animation: pulse-red 0.5s infinite alternate; }
    @keyframes pulse-red {
      from { box-shadow: inset 0 0 20px #ef4444; }
      to { box-shadow: inset 0 0 80px #dc2626; }
    }
  </style>
</head>
<body id="body-root" class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 overflow-hidden">

  <!-- ロビー画面 -->
  <div id="lobby" class="w-full max-w-md bg-slate-900 border border-cyan-500/30 rounded-3xl p-6 text-center space-y-6 shadow-2xl my-auto">
    <div>
      <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">
        NEON BUMPER
      </h1>
      <p class="text-xs text-slate-400 mt-1">4桁コードで簡単マッチング</p>
    </div>

    <!-- 部屋作成（ホスト） -->
    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
      <div class="text-xs font-bold text-slate-300">① 部屋を作って4桁コードを教える</div>
      <button id="btn-create" onclick="createRoom()" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded-xl text-sm transition">
        部屋を作る 🚀
      </button>

      <div id="host-info" class="hidden space-y-2 pt-2">
        <div class="text-[10px] text-slate-400">あなたの対戦コード:</div>
        <div id="my-code-display" class="text-3xl font-black font-mono tracking-widest text-cyan-400 py-1">----</div>
        <div class="text-[11px] text-amber-400 animate-pulse font-bold">相手の接続を待っています...</div>
      </div>
    </div>

    <div class="text-xs text-slate-600 font-bold">- OR -</div>

    <!-- 部屋参加（ゲスト） -->
    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
      <div class="text-xs font-bold text-slate-300">② 4桁コードを入力して参加する</div>
      <input id="join-code-input" type="number" maxlength="4" placeholder="4桁の数字" class="w-full bg-slate-900 border border-slate-700 text-lg font-mono text-center px-3 py-2 rounded-xl text-slate-200 focus:outline-none focus:border-cyan-500 tracking-widest">
      <button id="btn-join" onclick="joinRoom()" class="w-full py-3 bg-pink-500 hover:bg-pink-400 text-slate-950 font-black rounded-xl text-sm transition">
        対戦に参加する ⚔️
      </button>
    </div>
  </div>

  <!-- 対戦画面 -->
  <div id="game-container" class="hidden flex-col items-center justify-between w-full max-w-md h-full flex-1 py-2">
    <!-- スコアボード -->
    <div class="flex items-center justify-between w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-2xl">
      <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-cyan-400 shadow-lg shadow-cyan-500/50"></span>
        <span class="text-xs font-bold text-cyan-400">P1 (青)</span>
        <span id="p1-score" class="text-lg font-black text-white font-mono ml-1">0</span>
      </div>
      <div class="text-[10px] text-slate-500 font-bold">FIRST TO 3</div>
      <div class="flex items-center space-x-2">
        <span id="p2-score" class="text-lg font-black text-white font-mono mr-1">0</span>
        <span class="text-xs font-bold text-pink-400">P2 (赤)</span>
        <span class="w-3 h-3 rounded-full bg-pink-400 shadow-lg shadow-pink-500/50"></span>
      </div>
    </div>

    <!-- ゲーム画面 (レスポンシブサイズ) -->
    <div class="relative flex items-center justify-center my-auto">
      <canvas id="gameCanvas" width="360" height="360" class="bg-slate-900 border-2 border-slate-800 rounded-full shadow-2xl cursor-crosshair max-w-[85vw] max-h-[85vw]"></canvas>
      <div id="status-overlay" class="absolute inset-0 flex items-center justify-center bg-slate-950/80 rounded-full hidden">
        <span id="status-message" class="text-xl font-black text-cyan-400 animate-bounce">READY</span>
      </div>
    </div>

    <!-- スマホ用ジョイスティックコントローラー -->
    <div class="w-full flex justify-center py-2">
      <div id="joystick-zone" class="w-28 h-28 bg-slate-900/80 border-2 border-slate-700/50 rounded-full relative touch-none flex items-center justify-center">
        <div id="joystick-knob" class="w-10 h-10 bg-cyan-500/80 border-2 border-cyan-300 rounded-full absolute transition-transform ease-out duration-75 shadow-lg shadow-cyan-500/30"></div>
      </div>
    </div>
  </div>

  <script>
    const PEER_PREFIX = "tong-bumper-v2-";
    let peer = null, conn = null, isHost = false;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CENTER = 180, ARENA_RADIUS = 160, BALL_RADIUS = 14;

    let p1 = { x: 120, y: 180, vx: 0, vy: 0, color: '#38bdf8' };
    let p2 = { x: 240, y: 180, vx: 0, vy: 0, color: '#f43f5e' };
    let p1Score = 0, p2Score = 0;
    let isRoundActive = false;

    let cheatRainBalls = [];
    let cheatActive = false;

    const myInputs = { up: false, down: false, left: false, right: false };
    let guestInputs = { up: false, down: false, left: false, right: false };

    // --- キーボード入力 ---
    window.addEventListener('keydown', e => handleKey(e, true));
    window.addEventListener('keyup', e => handleKey(e, false));

    function handleKey(e, state) {
      if (['ArrowUp', 'KeyW'].includes(e.code)) myInputs.up = state;
      if (['ArrowDown', 'KeyS'].includes(e.code)) myInputs.down = state;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) myInputs.left = state;
      if (['ArrowRight', 'KeyD'].includes(e.code)) myInputs.right = state;

      sendInputUpdate();
    }

    // --- スマホ用バーチャルジョイスティック ---
    const stickZone = document.getElementById('joystick-zone');
    const stickKnob = document.getElementById('joystick-knob');
    let stickActive = false;
    let stickCenter = { x: 0, y: 0 };

    stickZone.addEventListener('touchstart', e => {
      e.preventDefault();
      stickActive = true;
      const rect = stickZone.getBoundingClientRect();
      stickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateStick(e.touches[0]);
    });

    stickZone.addEventListener('touchmove', e => {
      e.preventDefault();
      if (stickActive) updateStick(e.touches[0]);
    });

    const resetStick = () => {
      stickActive = false;
      stickKnob.style.transform = `translate(0px, 0px)`;
      myInputs.up = myInputs.down = myInputs.left = myInputs.right = false;
      sendInputUpdate();
    };

    stickZone.addEventListener('touchend', resetStick);
    stickZone.addEventListener('touchcancel', resetStick);

    function updateStick(touch) {
      const dx = touch.clientX - stickCenter.x;
      const dy = touch.clientY - stickCenter.y;
      const dist = Math.hypot(dx, dy);
      const maxRadius = 35;

      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxRadius);
      const knobX = Math.cos(angle) * clampedDist;
      const knobY = Math.sin(angle) * clampedDist;

      stickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

      // しきい値を超えたら方向入力
      const threshold = 10;
      myInputs.left = dx < -threshold;
      myInputs.right = dx > threshold;
      myInputs.up = dy < -threshold;
      myInputs.down = dy > threshold;

      sendInputUpdate();
    }

    function sendInputUpdate() {
      if (!isHost && conn && conn.open) {
        conn.send({ type: 'INPUT', inputs: myInputs });
      }
    }

    // --- SOSタップ検知機能（画面外タップ） ---
    let tapHistory = [];
    const SOS_PATTERN = [0, 0, 0, 1, 1, 1, 0, 0, 0];

    window.addEventListener('pointerdown', e => {
      if (e.target === canvas || stickZone.contains(e.target)) return;
      window.lastTapStart = Date.now();
    });

    window.addEventListener('pointerup', e => {
      if (e.target === canvas || stickZone.contains(e.target) || !window.lastTapStart) return;
      const duration = Date.now() - window.lastTapStart;
      const type = duration > 250 ? 1 : 0;
      const now = Date.now();

      tapHistory.push({ type, time: now });
      tapHistory = tapHistory.filter(t => now - t.time <= 3000);

      if (tapHistory.length >= 9) {
        const recent = tapHistory.slice(-9).map(t => t.type);
        if (recent.every((val, idx) => val === SOS_PATTERN[idx])) {
          triggerCheatMode();
          tapHistory = [];
        }
      }
    });

    function triggerCheatMode() {
      if (cheatActive) return;
      cheatActive = true;
      document.getElementById('body-root').classList.add('cheat-active');
      
      const attackerColor = isHost ? '#38bdf8' : '#f43f5e';
      
      if (conn && conn.open) {
        conn.send({ type: 'CHEAT_SOS', attacker: isHost ? 'p1' : 'p2' });
      }
      
      spawnCheatRain(isHost ? 'p1' : 'p2', attackerColor);
    }

    function spawnCheatRain(attacker, color) {
      showMessage("🚨 CHEAT ACTIVATED 🚨");
      
      for (let i = 0; i < 30; i++) {
        cheatRainBalls.push({
          x: CENTER + (Math.random() - 0.5) * 150,
          y: -40 - (i * 30),
          vx: (Math.random() - 0.5) * 3,
          vy: 10 + Math.random() * 6,
          radius: 20,
          color: color,
          attacker: attacker
        });
      }
    }

    // --- P2P 接続 ---
    function createRoom() {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('my-code-display').innerText = code;
      document.getElementById('host-info').classList.remove('hidden');
      document.getElementById('btn-create').disabled = true;

      isHost = true;
      peer = new Peer(PEER_PREFIX + code);

      peer.on('connection', c => {
        conn = c;
        setupConnection();
      });
      peer.on('error', err => { if(err.type === 'unavailable-id') createRoom(); });
    }

    function joinRoom() {
      const code = document.getElementById('join-code-input').value.trim();
      if (code.length !== 4) return alert('4桁の数字を入力してください');

      isHost = false;
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(PEER_PREFIX + code);
        setupConnection();
      });
      peer.on('error', () => alert('部屋が見つかりませんでした'));
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        document.getElementById('game-container').classList.add('flex');

        if (isHost) {
          startNewRound("MATCH START!");
          gameLoopHost();
        }
      });

      conn.on('data', data => {
        if (isHost) {
          if (data.type === 'INPUT') guestInputs = data.inputs;
        } else {
          if (data.type === 'STATE') {
            p1 = data.p1; p2 = data.p2;
            p1Score = data.p1Score; p2Score = data.p2Score;
            cheatRainBalls = data.cheatRainBalls || [];
            updateUI();
            render();
          } else if (data.type === 'MSG') {
            showMessage(data.msg);
          }
        }

        if (data.type === 'CHEAT_SOS') {
          const color = data.attacker === 'p1' ? '#38bdf8' : '#f43f5e';
          document.getElementById('body-root').classList.add('cheat-active');
          spawnCheatRain(data.attacker, color);
        }
      });
    }

    // --- 物理演算 (ホスト) ---
    function updatePhysics(p, inputs) {
      const accel = 0.5, friction = 0.95;
      if (inputs.up) p.vy -= accel;
      if (inputs.down) p.vy += accel;
      if (inputs.left) p.vx -= accel;
      if (inputs.right) p.vx += accel;

      p.vx *= friction; p.vy *= friction;
      p.x += p.vx; p.y += p.vy;
    }

    function gameLoopHost() {
      if (isRoundActive) {
        updatePhysics(p1, myInputs);
        updatePhysics(p2, guestInputs);

        const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.hypot(dx, dy);
        if (dist < BALL_RADIUS * 2) {
          const overlap = (BALL_RADIUS * 2) - dist;
          const nx = dx / (dist || 1), ny = dy / (dist || 1);
          p1.x -= nx * overlap * 0.5; p1.y -= ny * overlap * 0.5;
          p2.x += nx * overlap * 0.5; p2.y += ny * overlap * 0.5;
          const kx = p1.vx - p2.vx, ky = p1.vy - p2.vy;
          const p = 2 * (nx * kx + ny * ky) / 2;
          p1.vx -= p * nx * 1.5; p1.vy -= p * ny * 1.5;
          p2.vx += p * nx * 1.5; p2.vy += p * ny * 1.5;
        }

        for (let i = cheatRainBalls.length - 1; i >= 0; i--) {
          let b = cheatRainBalls[i];
          b.y += b.vy; b.x += b.vx;

          let target = b.attacker === 'p1' ? p2 : p1;
          let tDx = target.x - b.x, tDy = target.y - b.y, tDist = Math.hypot(tDx, tDy);

          if (tDist < b.radius + BALL_RADIUS) {
            target.vx += (tDx / (tDist || 1)) * 20;
            target.vy += (tDy / (tDist || 1)) * 20;
          }

          if (b.y > canvas.height + 100) cheatRainBalls.splice(i, 1);
        }

        const d1 = Math.hypot(p1.x - CENTER, p1.y - CENTER);
        const d2 = Math.hypot(p2.x - CENTER, p2.y - CENTER);

        if (d1 > ARENA_RADIUS) {
          p2Score++; handlePointScored("P2 (赤) のポイント！");
        } else if (d2 > ARENA_RADIUS) {
          p1Score++; handlePointScored("P1 (青) のポイント！");
        }
      }

      updateUI();
      render();

      if (conn && conn.open) {
        conn.send({ type: 'STATE', p1, p2, p1Score, p2Score, cheatRainBalls });
      }

      requestAnimationFrame(gameLoopHost);
    }

    function handlePointScored(msg) {
      isRoundActive = false;
      cheatActive = false;
      document.getElementById('body-root').classList.remove('cheat-active');

      if (p1Score >= 3 || p2Score >= 3) {
        const winnerMsg = p1Score >= 3 ? "P1 (青) の勝利！🏆" : "P2 (赤) の勝利！🏆";
        sendMsg(winnerMsg);
        setTimeout(() => { p1Score = 0; p2Score = 0; startNewRound("NEW MATCH"); }, 3000);
      } else {
        sendMsg(msg);
        setTimeout(() => startNewRound("ROUND START"), 2000);
      }
    }

    function startNewRound(msg) {
      p1.x = 120; p1.y = 180; p1.vx = 0; p1.vy = 0;
      p2.x = 240; p2.y = 180; p2.vx = 0; p2.vy = 0;
      cheatRainBalls = [];
      sendMsg(msg);
      setTimeout(() => { isRoundActive = true; }, 1000);
    }

    function sendMsg(msg) {
      showMessage(msg);
      if (conn && conn.open) conn.send({ type: 'MSG', msg });
    }

    function showMessage(msg) {
      const overlay = document.getElementById('status-overlay');
      const text = document.getElementById('status-message');
      text.innerText = msg;
      overlay.classList.remove('hidden');
      setTimeout(() => overlay.classList.add('hidden'), 1500);
    }

    function updateUI() {
      document.getElementById('p1-score').innerText = p1Score;
      document.getElementById('p2-score').innerText = p2Score;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.arc(CENTER, CENTER, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 3;
      ctx.stroke();

      cheatRainBalls.forEach(b => {
        ctx.save();
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.restore();
      });

      drawBall(p1.x, p1.y, '#38bdf8', '#0284c7');
      drawBall(p2.x, p2.y, '#f43f5e', '#be123c');
    }

    function drawBall(x, y, mainColor, glowColor) {
      ctx.save();
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, y, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = mainColor;
      ctx.fill();
      ctx.restore();
    }
  </script>
</body>
</html>
