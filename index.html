<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEDROOM HEADQUARTERS GATE</title>
  <style>
    body {
      background: #05050a;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
      margin: 0;
      transition: background 0.3s;
    }
    .gate-box {
      border: 2px solid #00ff66;
      border-radius: 12px;
      padding: 30px;
      margin: 40px auto;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
      background: rgba(0, 20, 10, 0.6);
    }
    h1 { font-size: 18px; letter-spacing: 2px; margin-bottom: 5px; }
    .subtitle { color: #888; font-size: 11px; margin-bottom: 25px; }
    .status-text {
      font-size: 22px;
      font-weight: bold;
      margin: 30px 0;
      min-height: 60px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    button {
      background: #00ff66;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      padding: 14px 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }
    /* 未登録カード（侵入者）警告画面 */
    .denied {
      background: #200000 !important;
      color: #ff3333 !important;
    }
    .denied .gate-box {
      border-color: #ff3333;
      box-shadow: 0 0 25px rgba(255, 51, 51, 0.6);
      background: rgba(30, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="gate-box">
    <h1>BEDROOM HQ SECURITY</h1>
    <div class="subtitle">--- GATE LEVEL 3 ONLINE ---</div>
    
    <button onclick="startGate()">ゲート監視スタート</button>
    
    <div id="status" class="status-text">ボタンを押して監視を起動</div>
  </div>

<script>
// 🔑 設定されたCEOマスターID
const CEO_CARD_ID = "04:aa:65:a6:72:26:81";

async function startGate() {
  const statusDiv = document.getElementById('status');
  
  if (!('NDEFReader' in window)) {
    statusDiv.innerText = "エラー: Web NFC非対応環境です\n(Android Chromeで開いてください)";
    statusDiv.style.color = "#ff3333";
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    statusDiv.innerText = "🟢 監視中...\nカードをかざしてください";
    statusDiv.style.color = "#00ff66";

    ndef.addEventListener("reading", ({ serialNumber }) => {
      // 登録IDと一致するか判定
      if (serialNumber === CEO_CARD_ID) {
        // CEOカード検出
        document.body.className = "";
        statusDiv.innerText = "【ACCESS GRANTED】\nようこそ、CEO";
        statusDiv.style.color = "#00ff66";
        playTone(880, 0.2); // 高音ピコン
      } else {
        // 未登録カード検出
        document.body.className = "denied";
        statusDiv.innerText = "🚨【ACCESS DENIED】\n警告: 未登録の鍵です";
        playAlarm(); // ブザー爆音
      }
    });
  } catch (error) {
    statusDiv.innerText = "エラー: " + error;
    statusDiv.style.color = "#ff3333";
  }
}

// 通過許可音（高音ピポッ）
function playTone(freq, duration) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = freq;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}

// 侵入者ブザー（低音ブー！）
function playAlarm() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.type = "sawtooth";
  osc.frequency.value = 140;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.6);
}
</script>

</body>
</html>
