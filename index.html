<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D TPS ウォーターバトル【完全】</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { touch-action: none; overflow: hidden; background: #0f172a; }
    @keyframes secretFlashAnimation { 0% { opacity: 0.8; } 100% { opacity: 0; } }
    .secret-flash { animation: secretFlashAnimation 0.15s ease-out forwards; }
    @keyframes tvScale { 0% { transform: scale(0) rotate(-5deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
    .tv-popup { animation: tvScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes screenNuke { 0% { opacity: 0; } 50% { opacity: 1; background: white; } 100% { opacity: 0; } }
    .nuke-flash { animation: screenNuke 1.5s ease-out forwards; }
  </style>
</head>
<body class="text-white font-sans min-h-screen flex flex-col items-center justify-center p-2 select-none">

  <div id="secret-flash-overlay" class="pointer-events-none fixed inset-0 bg-cyan-300 opacity-0 z-50"></div>
  <div id="nuke-overlay" class="pointer-events-none fixed inset-0 bg-white opacity-0 z-50"></div>

  <!-- ロビー -->
  <div id="lobby-view" class="w-full max-w-sm bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-6 text-center z-10">
    <h1 class="text-xl font-bold">3D TPS ウォーターバトル</h1>
    <button onclick="createRoom()" class="w-full py-3 bg-cyan-600 rounded-xl font-bold">ルーム作成</button>
    <div id="room-id-display" class="hidden text-2xl font-mono text-emerald-400"></div>
    <input type="number" id="join-room-id" placeholder="ルームコード" class="w-full p-3 bg-slate-900 rounded-xl text-center">
    <button onclick="joinRoom()" class="w-full py-3 bg-amber-600 rounded-xl font-bold">参加する</button>
    <p id="status-text" class="text-xs text-slate-400">待機中...</p>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-view" class="hidden flex-col items-center space-y-2 relative w-full max-w-md">
    <div class="flex w-full px-4 py-2 bg-slate-800/80 rounded-2xl border border-slate-700">
      <div class="w-1/2">
        <div class="text-[10px] text-cyan-400">YOU</div>
        <div class="w-full bg-slate-700 h-2 rounded-full"><div id="hp-you" class="bg-cyan-400 h-full w-full transition-all"></div></div>
      </div>
      <div class="w-1/2 ml-2">
        <div class="text-[10px] text-rose-400">ENEMY</div>
        <div class="w-full bg-slate-700 h-2 rounded-full"><div id="hp-enemy" class="bg-rose-400 h-full w-full transition-all"></div></div>
      </div>
    </div>

    <div id="view-touch-area" class="relative w-full h-[380px] rounded-2xl overflow-hidden border-2 border-slate-700 bg-slate-950">
      <div id="canvas-container" class="w-full h-full"></div>
      <div id="secret-dots" class="absolute top-2 left-2 flex space-x-1"></div>
      
      <!-- 演出要素 -->
      <div id="warning-banner" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-red-600 px-4 py-1 rounded-full animate-bounce text-xs font-black z-20">⚠️ 巨大隕石・超接近中 ⚠️</div>
      <div id="tv-overlay" class="hidden absolute inset-x-8 top-12 bg-slate-900 border-4 border-slate-700 rounded-3xl p-3 z-30 tv-popup text-center">
        <div class="text-xs text-amber-400">📺 臨時ニュース速報</div>
        <div id="tv-timer" class="text-4xl font-black text-red-500">5</div>
      </div>
      <div id="result-overlay" class="hidden absolute inset-0 bg-slate-950/90 rounded-2xl flex flex-col items-center justify-center z-40">
        <div id="result-text" class="text-3xl font-black mb-4"></div>
        <button id="retry-btn" onclick="requestRetry()" class="px-8 py-3 bg-cyan-600 rounded-xl font-bold">もう一度遊ぶ</button>
      </div>
    </div>
    <button id="shoot-btn" class="w-full py-6 bg-cyan-600 rounded-2xl font-bold active:scale-95 transition">SHOOT 💦</button>
  </div>

  <script>
    let peer, conn, isHost, myHp = 100, enemyHp = 100, isGameOver = false, secretModeActive = false;
    let myPos = { x: -6, z: 6, angle: 0 }, enemyPos = { x: 6, z: -6, angle: Math.PI };
    let waterBullets = [], clones = [], meteors = [], secretTimers = [];
    let tapPattern = [], lastTapTime = 0;
    const SOS_PATTERN = ['S','S','S','L','L','L','S','S','S'];

    function createRoom() {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer('water-battle-' + code);
      peer.on('open', () => { document.getElementById('room-id-display').innerText = code; document.getElementById('room-id-display').classList.remove('hidden'); });
      peer.on('connection', (c) => { conn = c; setupCommunication(); });
    }

    function joinRoom() {
      const code = document.getElementById('join-room-id').value;
      peer = new Peer();
      peer.on('open', () => { conn = peer.connect('water-battle-' + code); setupCommunication(); });
    }

    function setupCommunication() {
      conn.on('open', () => {
        document.getElementById('lobby-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        init3DGame();
      });
      conn.on('data', (data) => {
        if (data.type === 'state') {
          enemyPos.x = -data.pos.x; enemyPos.z = -data.pos.z; enemyPos.angle = data.pos.angle + Math.PI;
          if (data.newWater) spawnWaterBullet(-data.newWater.x, -data.newWater.z, -data.newWater.vx, -data.newWater.vz, false);
          // 完全同期：演出トリガー
          if (data.triggerSecret && !secretModeActive) triggerSecretSequence();
        }
      });
    }

    function triggerSecretSequence() {
      secretModeActive = true;
      // 5体分身
      for (let i = 0; i < 5; i++) {
        const clone = createStickman(0x38bdf8);
        scene.add(clone); clones.push(clone);
      }
      // 演出開始
      secretTimers.push(setTimeout(() => document.getElementById('warning-banner').classList.remove('hidden'), 1000));
      secretTimers.push(setTimeout(() => {
        document.getElementById('tv-overlay').classList.remove('hidden');
        let t = 5;
        const interval = setInterval(() => {
          t--; document.getElementById('tv-timer').innerText = t;
          if(t <= 0) { clearInterval(interval); document.getElementById('nuke-overlay').classList.add('nuke-flash'); setTimeout(()=>endGame(true), 700); }
        }, 1000);
      }, 3000));
    }

    function executeShootAction() {
      // 隠し演出発動ロジック
      if (!secretModeActive && tapPattern.length === SOS_PATTERN.length) {
        triggerSecretSequence();
        if (conn?.open) conn.send({ type: 'state', pos: myPos, triggerSecret: true });
      }
      // 弾の発射... (既存処理)
    }

    // 3Dレンダリング等の初期化は既存のものを流用...
    function init3DGame() { /* Three.jsの初期化 */ }
    function endGame(isWin) { isGameOver = true; document.getElementById('result-overlay').classList.remove('hidden'); document.getElementById('result-text').innerText = isWin ? "WORLD DESTROYED (WIN)" : "LOSE"; }
    
    // (タッチ操作や移動処理は既存のものをそのまま利用)
    // 最後にカメラやプレイヤーの更新ループを回す
  </script>
</body>
</html>
