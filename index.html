<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 協力防衛：ツイン・タワー・バスター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { touch-action: none; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-2 select-none">

  <!-- 1. ロビー画面 -->
  <div id="lobby-view" class="w-full max-w-sm bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-6 text-center z-10">
    <div>
      <div class="text-4xl mb-2">🛡️🤖🔫</div>
      <h1 class="text-xl font-bold text-slate-100">ツイン・タワー・バスター</h1>
      <p class="text-xs text-slate-400 mt-1">2人で1つの巨大砲台を動かして防衛せよ！</p>
    </div>

    <!-- ホスト（P1: ドライバー） -->
    <div class="p-4 bg-slate-700/50 rounded-2xl border border-slate-600 space-y-2">
      <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-wider">部屋を作る (P1: ドライバー / 移動＆シールド)</h2>
      <button onclick="createRoom()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 font-bold rounded-xl text-sm transition">
        ルームコードを発行
      </button>
      <div id="room-id-display" class="hidden p-2 bg-slate-900 rounded-xl text-xl font-mono font-bold text-emerald-400 border border-emerald-500/30"></div>
    </div>

    <div class="text-xs text-slate-500 font-bold">OR</div>

    <!-- ゲスト（P2: ガンナー） -->
    <div class="p-4 bg-slate-700/50 rounded-2xl border border-slate-600 space-y-2">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">部屋に入る (P2: ガンナー / 照準＆攻撃)</h2>
      <input type="number" id="join-room-id" placeholder="4桁コード" pattern="\d*" maxlength="4"
        class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-xl text-center font-mono text-white text-lg focus:outline-none focus:border-amber-400">
      <button onclick="joinRoom()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 font-bold rounded-xl text-sm transition">
        参加する
      </button>
    </div>

    <p id="status-text" class="text-xs text-slate-400">接続待機中...</p>
  </div>

  <!-- 2. ゲーム画面 -->
  <div id="game-view" class="hidden flex-col items-center space-y-2 relative w-full max-w-md">
    <!-- UI ヘッダー -->
    <div class="flex items-center justify-between w-full px-4 py-2 bg-slate-800/80 backdrop-blur rounded-2xl border border-slate-700">
      <div class="text-left w-36">
        <div class="text-[10px] text-cyan-400 font-bold">BASE HP</div>
        <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden mt-0.5">
          <div id="hp-base" class="bg-emerald-400 h-full w-full transition-all duration-200"></div>
        </div>
      </div>
      <div class="text-center">
        <div class="text-[10px] text-amber-400 font-bold">WAVE</div>
        <div id="wave-text" class="text-base font-black text-white">1 / 3</div>
      </div>
      <div class="text-right w-24">
        <div class="text-[10px] text-purple-400 font-bold">ROLE</div>
        <div id="role-text" class="text-xs font-bold text-slate-200">-</div>
      </div>
    </div>

    <!-- 3D 画面エリア -->
    <div id="view-touch-area" class="relative w-full h-[380px] rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-slate-950 touch-none">
      <div id="canvas-container" class="w-full h-full"></div>

      <!-- 照準（ガンナー用） -->
      <div id="crosshair" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-6 h-6 rounded-full border-2 border-amber-400 flex items-center justify-center">
          <div class="w-1 h-1 bg-amber-400 rounded-full"></div>
        </div>
      </div>

      <!-- カウントダウン -->
      <div id="countdown-overlay" class="hidden absolute inset-0 bg-slate-950/40 backdrop-blur-[2px] rounded-2xl flex items-center justify-center z-10">
        <div id="countdown-text" class="text-7xl font-black text-amber-400 drop-shadow-lg">3</div>
      </div>

      <!-- リザルト -->
      <div id="result-overlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center space-y-4 z-20">
        <div id="result-text" class="text-3xl font-extrabold tracking-wider"></div>
        <button onclick="location.reload()" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold text-sm shadow-lg">
          もう一度遊ぶ 🔄
        </button>
      </div>
    </div>

    <!-- 操作エリア（役割に応じて変化） -->
    <div id="controls-p1" class="hidden w-full h-28 bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700 items-center justify-between px-6">
      <div id="touch-zone" class="w-32 h-full flex items-center justify-center relative touch-none">
        <div class="text-[10px] text-slate-500 pointer-events-none">移動スティック</div>
        <div id="stick-base" class="hidden absolute w-16 h-16 bg-slate-700/60 rounded-full border border-slate-500/50 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
          <div id="stick-knob" class="absolute w-8 h-8 bg-cyan-500/80 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        </div>
      </div>
      <button id="shield-btn" class="w-24 h-20 bg-cyan-600 active:bg-cyan-700 font-bold rounded-2xl text-xs shadow-lg flex flex-col items-center justify-center active:scale-95 transition">
        <span class="text-xl mb-1">🛡️</span>
        <span>SHIELD</span>
      </button>
    </div>

    <div id="controls-p2" class="hidden w-full h-28 bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700 items-center justify-between px-6">
      <div class="text-xs text-slate-400">画面スワイプで照準移動</div>
      <button id="shoot-btn" class="w-28 h-20 bg-amber-600 active:bg-amber-700 font-bold rounded-2xl text-xs shadow-lg flex flex-col items-center justify-center active:scale-95 transition">
        <span class="text-xl mb-1">🔥</span>
        <span>FIRE!!</span>
      </button>
    </div>
  </div>

  <script>
    let peer = null, conn = null, isHost = false;
    let isGamePlaying = false, isGameOver = false;
    let currentWave = 1, maxWave = 3;
    let baseHp = 100;

    // ゲーム状態 (ホストがマスター)
    let basePos = { x: 0, z: 0 };
    let turretAngle = 0;
    let isShieldActive = false;
    let enemies = [];
    let bullets = [];

    // カメラ/入力ステート
    let joystickVector = { x: 0, y: 0, active: false };
    let scene, camera, renderer;
    let baseMesh, turretMesh, shieldMesh;

    function createRoom() {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer('tower-def-' + code);
      document.getElementById('status-text').innerText = "部屋を作成中...";

      peer.on('open', () => {
        isHost = true;
        document.getElementById('room-id-display').innerText = code;
        document.getElementById('room-id-display').classList.remove('hidden');
        document.getElementById('status-text').innerText = "P2（ガンナー）の参加を待っています...";
      });

      peer.on('connection', (c) => { conn = c; setupCommunication(); });
    }

    function joinRoom() {
      const code = document.getElementById('join-room-id').value.trim();
      if(!code) return alert("4桁コードを入力してください");

      peer = new Peer();
      document.getElementById('status-text').innerText = "接続中...";

      peer.on('open', () => {
        isHost = false;
        conn = peer.connect('tower-def-' + code);
        setupCommunication();
      });
    }

    function setupCommunication() {
      conn.on('open', () => {
        document.getElementById('lobby-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        
        if (isHost) {
          document.getElementById('role-text').innerText = "P1: DRIVER";
          document.getElementById('controls-p1').classList.remove('hidden');
          document.getElementById('controls-p1').classList.add('flex');
        } else {
          document.getElementById('role-text').innerText = "P2: GUNNER";
          document.getElementById('controls-p2').classList.remove('hidden');
          document.getElementById('controls-p2').classList.add('flex');
          document.getElementById('crosshair').classList.remove('hidden');
        }

        init3D();
        startCountdown();
      });

      conn.on('data', (data) => {
        if (isHost) {
          // ホスト側：ゲスト（ガンナー）からの操作を受信
          if (data.type === 'gunner_input') {
            turretAngle += data.deltaAngle;
            if (data.shoot) spawnBullet();
          }
        } else {
          // ゲスト側：ホストからの同期データを受信
          if (data.type === 'sync') {
            basePos = data.basePos;
            turretAngle = data.turretAngle;
            isShieldActive = data.isShieldActive;
            baseHp = data.baseHp;
            currentWave = data.currentWave;
            updateUI();
            
            // 敵と弾の同期
            syncEntities(data.enemies, data.bullets);
          } else if (data.type === 'game_over') {
            endGame(data.isWin);
          }
        }
      });
    }

    function startCountdown() {
      const overlay = document.getElementById('countdown-overlay');
      const text = document.getElementById('countdown-text');
      overlay.classList.remove('hidden');
      let count = 3;
      text.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) text.innerText = count;
        else if (count === 0) text.innerText = "DEFEND!";
        else {
          clearInterval(timer);
          overlay.classList.add('hidden');
          isGamePlaying = true;
          if (isHost) spawnWave(currentWave);
        }
      }, 900);
    }

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 18, 12);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // 床
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);
      scene.add(new THREE.GridHelper(30, 15, 0x38bdf8, 0x334155));

      // 拠点（タワー）構築
      baseMesh = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 1, 16), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
      body.position.y = 0.5;
      baseMesh.add(body);

      turretMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 1.5), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
      turretMesh.position.set(0, 1.1, -0.5);
      baseMesh.add(turretMesh);

      shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 }));
      shieldMesh.position.y = 0.8;
      shieldMesh.visible = false;
      baseMesh.add(shieldMesh);

      scene.add(baseMesh);

      setupInput();
      requestAnimationFrame(gameLoop);
    }

    function setupInput() {
      if (isHost) {
        // P1: 移動ジョイスティック & シールド
        const zone = document.getElementById('touch-zone');
        const base = document.getElementById('stick-base');
        const knob = document.getElementById('stick-knob');
        let startX = 0, startY = 0;

        const onStart = (e) => {
          const t = e.touches ? e.touches[0] : e;
          const rect = zone.getBoundingClientRect();
          startX = t.clientX - rect.left; startY = t.clientY - rect.top;
          base.style.left = startX + 'px'; base.style.top = startY + 'px';
          base.classList.remove('hidden');
          joystickVector.active = true;
        };

        const onMove = (e) => {
          if (!joystickVector.active) return;
          const t = e.touches ? e.touches[0] : e;
          const rect = zone.getBoundingClientRect();
          let dx = (t.clientX - rect.left) - startX;
          let dy = (t.clientY - rect.top) - startY;
          const dist = Math.hypot(dx, dy), maxR = 30;
          if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
          knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
          joystickVector.x = dx / maxR; joystickVector.y = dy / maxR;
        };

        const onEnd = () => { joystickVector.active = false; base.classList.add('hidden'); };

        zone.addEventListener('touchstart', onStart);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);

        const sBtn = document.getElementById('shield-btn');
        sBtn.addEventListener('touchstart', () => isShieldActive = true);
        sBtn.addEventListener('touchend', () => isShieldActive = false);
        sBtn.addEventListener('mousedown', () => isShieldActive = true);
        sBtn.addEventListener('mouseup', () => isShieldActive = false);
      } else {
        // P2: ガンナー照準 & 攻撃
        let lastX = 0;
        const area = document.getElementById('view-touch-area');

        area.addEventListener('touchstart', (e) => { lastX = e.touches[0].clientX; });
        area.addEventListener('touchmove', (e) => {
          const dx = e.touches[0].clientX - lastX;
          lastX = e.touches[0].clientX;
          if (conn && conn.open) conn.send({ type: 'gunner_input', deltaAngle: -dx * 0.01, shoot: false });
        });

        document.getElementById('shoot-btn').addEventListener('click', () => {
          if (conn && conn.open) conn.send({ type: 'gunner_input', deltaAngle: 0, shoot: true });
        });
      }
    }

    function spawnWave(wave) {
      const count = wave * 6;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (isGameOver) return;
          const angle = Math.random() * Math.PI * 2;
          const dist = 14;
          const mesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 8), new THREE.MeshStandardMaterial({ color: 0xf43f5e }));
          mesh.rotation.x = Math.PI / 2;
          const x = Math.sin(angle) * dist;
          const z = Math.cos(angle) * dist;
          mesh.position.set(x, 0.5, z);
          scene.add(mesh);
          enemies.push({ mesh, hp: 2 });
        }, i * 800);
      }
    }

    function spawnBullet() {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
      const dirX = -Math.sin(turretAngle);
      const dirZ = -Math.cos(turretAngle);
      mesh.position.set(basePos.x + dirX, 1.1, basePos.z + dirZ);
      scene.add(mesh);
      bullets.push({ mesh, vx: dirX * 0.4, vz: dirZ * 0.4, life: 60 });
    }

    function gameLoop() {
      if (isHost && isGamePlaying && !isGameOver) {
        // 1. 移動更新
        if (joystickVector.active) {
          basePos.x += joystickVector.x * 0.1;
          basePos.z += joystickVector.y * 0.1;
          basePos.x = Math.max(-13, Math.min(13, basePos.x));
          basePos.z = Math.max(-13, Math.min(13, basePos.z));
        }

        // 2. 弾更新 & 判定
        for (let i = bullets.length - 1; i >= 0; i--) {
          let b = bullets[i];
          b.mesh.position.x += b.vx;
          b.mesh.position.z += b.vz;
          b.life--;

          // 敵との着弾判定
          for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (b.mesh.position.distanceTo(e.mesh.position) < 0.7) {
              e.hp--;
              b.life = 0;
              if (e.hp <= 0) {
                scene.remove(e.mesh);
                enemies.splice(j, 1);
              }
              break;
            }
          }

          if (b.life <= 0) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }

        // 3. 敵移動 & 拠点判定
        for (let i = enemies.length - 1; i >= 0; i--) {
          let e = enemies[i];
          const dx = basePos.x - e.mesh.position.x;
          const dz = basePos.z - e.mesh.position.z;
          const dist = Math.hypot(dx, dz);

          e.mesh.position.x += (dx / dist) * 0.03;
          e.mesh.position.z += (dz / dist) * 0.03;
          e.mesh.lookAt(basePos.x, 0.5, basePos.z);

          if (dist < (isShieldActive ? 2.2 : 1.2)) {
            if (!isShieldActive) {
              baseHp = Math.max(0, baseHp - 10);
              updateUI();
              if (baseHp <= 0) endGame(false);
            }
            scene.remove(e.mesh);
            enemies.splice(i, 1);
          }
        }

        // WAVEクリア判定
        if (enemies.length === 0 && isGamePlaying) {
          if (currentWave < maxWave) {
            currentWave++;
            spawnWave(currentWave);
          } else {
            endGame(true);
          }
        }

        // ゲストへ同期送信
        if (conn && conn.open) {
          conn.send({
            type: 'sync',
            basePos, turretAngle, isShieldActive, baseHp, currentWave,
            enemies: enemies.map(e => ({ x: e.mesh.position.x, z: e.mesh.position.z })),
            bullets: bullets.map(b => ({ x: b.mesh.position.x, z: b.mesh.position.z }))
          });
        }
      }

      // 3Dオブジェクト描画反映
      baseMesh.position.set(basePos.x, 0, basePos.z);
      turretMesh.rotation.y = turretAngle;
      shieldMesh.visible = isShieldActive;

      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    function syncEntities(enemyData, bulletData) {
      // ゲスト側の描画用オブジェクト同期
      enemies.forEach(e => scene.remove(e.mesh));
      bullets.forEach(b => scene.remove(b.mesh));
      enemies = []; bullets = [];

      enemyData.forEach(d => {
        const mesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 8), new THREE.MeshStandardMaterial({ color: 0xf43f5e }));
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(d.x, 0.5, d.z);
        scene.add(mesh);
        enemies.push({ mesh });
      });

      bulletData.forEach(d => {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
        mesh.position.set(d.x, 1.1, d.z);
        scene.add(mesh);
        bullets.push({ mesh });
      });
    }

    function updateUI() {
      document.getElementById('hp-base').style.width = baseHp + '%';
      document.getElementById('wave-text').innerText = `${currentWave} / ${maxWave}`;
    }

    function endGame(isWin) {
      isGameOver = true;
      isGamePlaying = false;
      if (isHost && conn && conn.open) conn.send({ type: 'game_over', isWin });

      const overlay = document.getElementById('result-overlay');
      const text = document.getElementById('result-text');
      overlay.classList.remove('hidden');

      if (isWin) {
        text.innerText = "MISSION CLEAR! 🎉";
        text.className = "text-3xl font-extrabold text-cyan-400 tracking-wider";
      } else {
        text.innerText = "BASE DESTROYED... 💥";
        text.className = "text-3xl font-extrabold text-rose-500 tracking-wider";
      }
    }
  </script>
</body>
</html>
