<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TongGames - 毎週月曜10時更新！限定ブラウザゲームポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.015); }
    }
    .glow-effect { animation: pulse-glow 3s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-amber-400 flex items-center justify-center text-xl font-black text-slate-950 shadow-lg shadow-cyan-500/20">
          T
        </div>
        <div>
          <span class="text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 to-amber-400 bg-clip-text text-transparent">TongGames</span>
          <p class="text-[10px] text-slate-400 font-medium">毎週月曜 10:00AM 新作解禁</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-full text-xs text-slate-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="font-bold">1週間限定プレイ</span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-4xl mx-auto px-4 py-8 w-full space-y-10">

    <!-- 今週のゲーム（自動切り替え対応メインセクション） -->
    <section class="relative bg-slate-900 border border-cyan-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden">
      <div class="absolute -top-12 -right-12 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex flex-col md:flex-row gap-6 items-center justify-between">
        <div class="space-y-4 text-center md:text-left flex-1">
          <div class="inline-flex items-center space-x-2 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs px-3 py-1 rounded-full font-bold">
            <span>🔥 今週の無料公開ゲーム</span>
          </div>

          <h1 id="current-title" class="text-3xl sm:text-4xl font-extrabold text-white leading-tight">
            <!-- JavaScriptで動的生成 -->
          </h1>

          <p id="current-desc" class="text-slate-400 text-sm leading-relaxed">
            <!-- JavaScriptで動的生成 -->
          </p>

          <!-- 次回更新（月曜10時）までのカウントダウン -->
          <div class="pt-2 bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 inline-block w-full md:w-auto">
            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1 text-center md:text-left">
              次回更新（来週月曜 10:00）まで
            </div>
            <div id="countdown-timer" class="text-2xl font-mono font-black text-amber-400 text-center md:text-left">
              00日 00時間 00分 00秒
            </div>
          </div>

          <div class="pt-2">
            <button onclick="playCurrentGame()" class="glow-effect w-full md:w-auto px-8 py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black rounded-2xl text-lg shadow-lg shadow-cyan-500/20 active:scale-95 transition">
              今すぐ遊ぶ！ 🚀
            </button>
          </div>
        </div>

        <!-- ゲームアイコン/ビジュアルプレビュー -->
        <div class="w-full md:w-60 h-52 bg-slate-950 rounded-2xl border border-slate-800 flex flex-col items-center justify-center p-4 text-center relative group">
          <div id="current-icon" class="text-6xl mb-3 group-hover:scale-110 transition duration-300">🎮</div>
          <span class="text-xs font-bold text-slate-400">1週間限定アクセス</span>
          <span class="text-[10px] text-slate-600 mt-1">月曜 10:00 に自動入替</span>
        </div>
      </div>
    </section>

    <!-- 来週の予告 & アーカイブ -->
    <div class="grid md:grid-cols-2 gap-6">
      
      <!-- 来週の予告 -->
      <section class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
        <div>
          <div class="inline-flex items-center space-x-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-3 py-1 rounded-full font-bold mb-3">
            <span>⏳ NEXT WEEK</span>
          </div>
          <h2 id="next-title" class="text-xl font-bold text-white mb-2">
            <!-- JavaScriptで動的生成 -->
          </h2>
          <p id="next-desc" class="text-xs text-slate-400 leading-relaxed">
            <!-- JavaScriptで動的生成 -->
          </p>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-500">
          <span>解禁日時: 次回月曜日 10:00 AM</span>
          <span class="bg-slate-800 text-amber-400 font-bold px-2.5 py-1 rounded-md text-[10px]">公開準備中</span>
        </div>
      </section>

      <!-- 過去に公開されたゲーム（アーカイブ） -->
      <section class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
        <div>
          <div class="inline-flex items-center space-x-2 bg-purple-500/10 border border-purple-500/30 text-purple-400 text-xs px-3 py-1 rounded-full font-bold mb-3">
            <span>📦 ARCHIVE</span>
          </div>
          <h2 class="text-xl font-bold text-white mb-2">公開終了したゲーム</h2>
          <div id="archive-list" class="space-y-2 mt-3">
            <!-- JavaScriptで動的生成 -->
          </div>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-800/60 text-[10px] text-slate-500">
          ※ 1週間限定配信のため、公開が終了した作品は現在プレイできません。
        </div>
      </section>

    </div>

  </main>

  <!-- フッター -->
  <footer class="border-t border-slate-800 bg-slate-900/30 py-6 text-center text-xs text-slate-500 mt-8">
    <p>© 2026 TongGames. All rights reserved.</p>
  </footer>

  <!-- 擬似モーダル（ゲーム画面） -->
  <div id="game-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden z-50 flex-col items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-3xl p-6 space-y-4 relative text-center shadow-2xl">
      <button onclick="closeGame()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
      <h3 id="modal-title" class="text-lg font-bold text-cyan-400">ゲームを起動中...</h3>
      
      <div class="p-12 bg-slate-950 rounded-2xl border border-slate-800 text-slate-400 text-sm flex flex-col items-center justify-center space-y-3">
        <div id="modal-icon" class="text-5xl">🎮</div>
        <p id="modal-msg" class="text-xs text-slate-500">[ ここにゲーム本体のコードが読み込まれます ]</p>
      </div>

      <button onclick="closeGame()" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl text-slate-300 transition">
        閉じる
      </button>
    </div>
  </div>

  <script>
    // --- 1. ゲームのローテーション配信リストデータ ---
    const gameSchedule = [
      {
        id: "game-1",
        title: "🛡️🤖🔫 ツイン・タワー・バスター (3D)",
        desc: "2人で1つの拠点と巨大砲台を操作して迫りくる敵から防衛せよ！PeerJS対応でオンライン協力プレイが可能。",
        icon: "🤖"
      },
      {
        id: "game-2",
        title: "✊✌️✋ 超速！心理戦じゃんけんバトル",
        desc: "心理戦とスピードが交錯する新感覚対戦ゲーム。相手の手を読んで連続勝利を狙え！",
        icon: "✊"
      },
      {
        id: "game-3",
        title: "🏃‍♂️💨 霧の中の鬼ごっこ (3D)",
        desc: "足音と波紋だけを頼りに視界の狭い迷路を逃げ切る、ハラハラドキドキのオンライン対戦。",
        icon: "👻"
      },
      {
        id: "game-4",
        title: "🎨 リアルタイム陣取りラグナロク",
        desc: "制限時間60秒！自分の色のペンキを撃ちまくってステージを塗りつぶせ！",
        icon: "🎨"
      }
    ];

    // 基準日（2026年1月5日 月曜日 10:00 AM）
    const BASE_MONDAY_10AM = new Date(2026, 0, 5, 10, 0, 0).getTime();
    const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;

    // --- 2. 現在の週インデックスと次回更新日時（月曜10:00）を計算 ---
    function getScheduleState() {
      const now = new Date().getTime();
      const timePassed = now - BASE_MONDAY_10AM;

      let weekIndex = Math.floor(timePassed / ONE_WEEK_MS);
      if (weekIndex < 0) weekIndex = 0;

      const nextSwitchTime = BASE_MONDAY_10AM + ((weekIndex + 1) * ONE_WEEK_MS);

      return { weekIndex, nextSwitchTime };
    }

    // --- 3. UIの動的更新 ---
    function renderPortal() {
      const { weekIndex, nextSwitchTime } = getScheduleState();

      // 今週・来週・過去のインデックスを計算（ループ対応）
      const currentIdx = weekIndex % gameSchedule.length;
      const nextIdx = (weekIndex + 1) % gameSchedule.length;

      const currentGame = gameSchedule[currentIdx];
      const nextGame = gameSchedule[nextIdx];

      // 今週のゲーム反映
      document.getElementById('current-title').innerText = currentGame.title;
      document.getElementById('current-desc').innerText = currentGame.desc;
      document.getElementById('current-icon').innerText = currentGame.icon;

      // 来週の予告反映
      document.getElementById('next-title').innerText = nextGame.title;
      document.getElementById('next-desc').innerText = nextGame.desc;

      // アーカイブ一覧の生成
      const archiveContainer = document.getElementById('archive-list');
      archiveContainer.innerHTML = '';

      if (weekIndex === 0) {
        archiveContainer.innerHTML = '<p class="text-xs text-slate-600 italic">まだ公開終了したゲームはありません。</p>';
      } else {
        // 過去最大3件表示
        for (let i = 1; i <= Math.min(3, weekIndex); i++) {
          const pastIdx = (weekIndex - i) % gameSchedule.length;
          const pastGame = gameSchedule[pastIdx];

          const item = document.createElement('div');
          item.className = "flex items-center justify-between bg-slate-950/50 p-2.5 rounded-xl border border-slate-800/80 text-xs";
          item.innerHTML = `
            <div class="flex items-center space-x-2 opacity-60">
              <span>${pastGame.icon}</span>
              <span class="font-bold text-slate-300">${pastGame.title}</span>
            </div>
            <span class="text-[10px] text-slate-600 bg-slate-900 px-2 py-0.5 rounded">公開終了</span>
          `;
          archiveContainer.appendChild(item);
        }
      }

      // カウントダウンタイマー更新
      updateCountdown(nextSwitchTime);
    }

    // カウントダウンタイマー処理
    function updateCountdown(targetTime) {
      function tick() {
        const now = new Date().getTime();
        const diff = targetTime - now;

        if (diff <= 0) {
          // 月曜10時を超えたら自動リロードして次のゲームに切替
          renderPortal();
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('countdown-timer').innerText = 
          `${String(days).padStart(2, '0')}日 ${String(hours).padStart(2, '0')}時間 ${String(minutes).padStart(2, '0')}分 ${String(seconds).padStart(2, '0')}秒`;
      }

      tick();
      setInterval(tick, 1000);
    }

    // モーダル表示機能
    function playCurrentGame() {
      const { weekIndex } = getScheduleState();
      const currentGame = gameSchedule[weekIndex % gameSchedule.length];

      document.getElementById('modal-title').innerText = `${currentGame.title} を起動中...`;
      document.getElementById('modal-icon').innerText = currentGame.icon;
      document.getElementById('game-modal').classList.remove('hidden');
      document.getElementById('game-modal').classList.add('flex');
    }

    function closeGame() {
      document.getElementById('game-modal').classList.add('hidden');
      document.getElementById('game-modal').classList.remove('flex');
    }

    // 初期化実行
    renderPortal();
  </script>
</body>
</html>
