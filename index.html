<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEDROOM HQ SECURITY GATE</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05050a;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      text-align: center;
      user-select: none;
    }
    .full-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      padding: 20px;
      transition: background 0.3s;
    }
    .gate-box {
      border: 2px solid #00ff66;
      border-radius: 12px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
      background: rgba(0, 20, 10, 0.6);
    }
    h1 { font-size: 18px; letter-spacing: 2px; margin: 0 0 5px 0; }
    .subtitle { color: #888; font-size: 11px; margin-bottom: 25px; }
    .status-text {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hint { font-size: 12px; color: #555; margin-top: 15px; }
    
    /* 侵入者警告スタイル */
    .denied { background: #200000 !important; color: #ff3333 !important; }
    .denied .gate-box { border-color: #ff3333; box-shadow: 0 0 25px rgba(255, 51, 51, 0.6); background: rgba(30, 0, 0, 0.6); }
  </style>
</head>
<body onclick="enableGate()">

<div id="main-screen" class="full-screen">
  <div class="gate-box">
    <h1>BEDROOM HQ SECURITY</h1>
    <div class="subtitle">--- GATE LEVEL 3 ONLINE ---</div>
    
    <div id="status" class="status-text">👆 画面のどこかを1回タップして<br>監視を開始してください</div>
    <div id="hint" class="hint">1度起動すれば全自動で待機します</div>
  </div>
</div>

<script>
const CEO_CARD_ID = "04:aa:65:a6:72:26:81";
let isRunning = false;

// 画面のどこかを1回タップしたら永久スタート
async function enableGate() {
  if (isRunning) return;
  
  const statusDiv = document.getElementById('status');
  document.getElementById('hint').style.display = 'none';

  // 画面のスリープを防止（常時オン）
  requestWakeLock();

  // NFCループ開始
  isRunning = true;
  startNfcLoop();
}

async function startNfcLoop() {
  const statusDiv = document.getElementById('status');

  if (!('NDEFReader' in window)) {
    statusDiv.innerText = "エラー: Web NFC非対応環境です";
    statusDiv.style.color = "#ff3333";
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    
    statusDiv.innerText = "🟢 監視中...\nカードをかざしてください";
    statusDiv.style.color = "#00ff66";

    ndef.addEventListener("reading", ({ serialNumber }) => {
      handleCardScan(serialNumber);
    });

    // エラーが起きても勝手に再起動するイベント
    ndef.addEventListener("readingerror", () => {
      console.log("読み取り失敗、再試行中...");
    });

  } catch (error) {
    statusDiv.innerText = "NFC初期化エラー: " + error + "\n再試行中...";
    // エラーが起きたら3秒後に自動でやり直す
    setTimeout(startNfcLoop, 3000);
  }
}

let resetTimer = null;

function handleCardScan(serialNumber) {
  const statusDiv = document.getElementById('status');
  const screen = document.getElementById('main-screen');

  clearTimeout(resetTimer);

  if (serialNumber === CEO_CARD_ID) {
    // CEO（通過許可）
    screen.className = "full-screen";
    statusDiv.innerText = "【ACCESS GRANTED】\nようこそ、CEO";
    statusDiv.style.color = "#00ff66";
    playTone(880, 0.2);
  } else {
    // 侵入者（拒否）
    screen.className = "full-screen denied";
    statusDiv.innerText = "🚨【ACCESS DENIED】\n警告: 未登録の鍵です";
    playAlarm();
  }

  // 4秒後に自動で元の「🟢 監視中」画面に戻す
  resetTimer = setTimeout(() => {
    screen.className = "full-screen";
    statusDiv.innerText = "🟢 監視中...\nカードをかざしてください";
    statusDiv.style.color = "#00ff66";
  }, 4000);
}

// スリープ防止（画面を消さない）
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.log("WakeLock Error: " + err);
  }
}

// 画面切り替え時にスリープ防止を再保持
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
  }
});
</script>

</body>
</html>
