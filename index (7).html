<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Buy Buy</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111c2e;
      --panel-2: #16243a;
      --panel-3: #1b2b43;
      --line: rgba(196, 216, 240, .11);
      --text: #f4f8ff;
      --muted: #91a4bd;
      --mint: #7cf0c4;
      --mint-dark: #1eae87;
      --blue: #91b8ff;
      --red: #ff667e;
      --gold: #ffd37d;
      --shadow: 0 22px 60px rgba(0,0,0,.28);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); color-scheme: dark; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: radial-gradient(circle at 75% -5%, rgba(78,135,255,.13), transparent 34%), var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--mint); }
    .brand-mark { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: 0 0 36px; border-radius: 13px; color: #09231b; background: linear-gradient(145deg, #a3ffdc, #51d8ae); font-size: 20px; font-weight: 950; box-shadow: 0 8px 25px rgba(93,229,183,.15); }
    .brand-word { letter-spacing: -.055em; font-size: 22px; font-weight: 850; }
    .brand-word span { color: var(--mint); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 1px solid transparent; border-radius: 13px; padding: 10px 15px; font-weight: 750; font-size: 13px; transition: transform .18s ease, filter .18s ease, background .18s ease; }
    .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary { color: #06251b; background: var(--mint); box-shadow: 0 9px 25px rgba(124,240,196,.12); }
    .btn-secondary { color: var(--text); background: #21334c; border-color: var(--line); }
    .btn-quiet { color: var(--muted); background: transparent; border-color: var(--line); }
    .btn-danger { color: #fff; background: rgba(255,102,126,.13); border-color: rgba(255,102,126,.22); }
    .btn-gold { color: #261902; background: var(--gold); }
    .btn-wide { width: 100%; }
    .btn-sm { min-height: 34px; border-radius: 10px; padding: 7px 10px; font-size: 12px; }
    .field { display: grid; gap: 7px; margin-bottom: 15px; }
    .field label { font-size: 12px; color: #c7d4e6; font-weight: 700; }
    .input, .select, .textarea { display: block; width: 100%; color: var(--text); background: #0d1727; border: 1px solid rgba(174,197,225,.17); border-radius: 12px; padding: 12px 13px; outline: none; min-height: 45px; }
    .textarea { min-height: 84px; resize: vertical; }
    .input::placeholder, .textarea::placeholder { color: #61748e; }
    .input:focus, .select:focus, .textarea:focus { border-color: rgba(124,240,196,.75); box-shadow: 0 0 0 3px rgba(124,240,196,.08); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 14px; }
    .full { grid-column: 1 / -1; }
    .panel { border: 1px solid var(--line); background: linear-gradient(150deg, rgba(22,36,58,.96), rgba(15,25,42,.97)); border-radius: var(--radius); box-shadow: 0 12px 36px rgba(0,0,0,.09); }
    .panel-pad { padding: 22px; }
    .panel-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .panel-title h2, .panel-title h3 { padding: 0; margin: 0; font-size: 16px; letter-spacing: -.025em; }
    .panel-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 750; color: #c7d5e8; background: rgba(255,255,255,.035); white-space: nowrap; }
    .pill-mint { color: var(--mint); border-color: rgba(124,240,196,.2); background: rgba(124,240,196,.07); }
    .pill-red { color: var(--red); border-color: rgba(255,102,126,.22); background: rgba(255,102,126,.07); }
    .divider { height: 1px; background: var(--line); margin: 18px 0; }

    /* Login / first-run */
    .auth-wrap { min-height: 100vh; display: grid; grid-template-columns: minmax(0,1fr) minmax(360px,480px); align-items: stretch; gap: 28px; max-width: 1260px; margin: 0 auto; padding: clamp(18px,4vw,54px); }
    .auth-visual { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 610px; overflow: hidden; border-radius: 30px; padding: clamp(25px,4vw,52px); background: radial-gradient(circle at 75% 22%, rgba(124,240,196,.2), transparent 28%), radial-gradient(circle at 10% 90%, rgba(93,140,255,.23), transparent 38%), linear-gradient(145deg,#122239,#0e1a2c 65%,#102b31); border: 1px solid var(--line); }
    .auth-visual:after { content: ""; width: 380px; height: 380px; position: absolute; border-radius: 50%; border: 1px solid rgba(124,240,196,.14); right: -130px; bottom: 28px; box-shadow: 0 0 0 35px rgba(124,240,196,.025), 0 0 0 72px rgba(124,240,196,.02); pointer-events: none; }
    .auth-visual h1 { font-size: clamp(40px,5vw,72px); letter-spacing: -.075em; line-height: .98; margin: 28px 0 18px; max-width: 580px; }
    .auth-visual h1 span { color: var(--mint); }
    .auth-visual p { max-width: 460px; color: #b2c4d9; line-height: 1.8; font-size: 15px; }
    .feature-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; max-width: 530px; margin-top: 35px; }
    .feature { padding: 13px; border: 1px solid rgba(214,231,255,.1); background: rgba(255,255,255,.035); border-radius: 14px; font-size: 12px; color: #cdd9e8; }
    .feature b { display: block; margin-bottom: 5px; font-size: 14px; color: white; }
    .auth-card-wrap { display: flex; flex-direction: column; justify-content: center; padding: 8px 0; }
    .auth-card { padding: clamp(22px,3vw,34px); border-radius: 26px; border: 1px solid var(--line); background: rgba(17,28,46,.94); box-shadow: var(--shadow); }
    .auth-card h2 { margin: 0; font-size: 26px; letter-spacing: -.05em; }
    .auth-card .sub { margin: 8px 0 25px; line-height: 1.7; color: var(--muted); font-size: 13px; }
    .auth-foot { text-align: center; font-size: 11px; color: #667b95; padding: 17px 10px 0; line-height: 1.7; }
    .setup-notice { border: 1px solid rgba(255,211,125,.2); background: rgba(255,211,125,.07); border-radius: 12px; padding: 12px; margin-bottom: 16px; color: #e7d5ae; line-height: 1.65; font-size: 12px; }
    .error-inline { padding: 11px 12px; margin-bottom: 13px; border-radius: 12px; border: 1px solid rgba(255,102,126,.28); background: rgba(255,102,126,.08); color: #ffb0bd; font-size: 12px; line-height: 1.6; }

    /* Main application */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { position: fixed; z-index: 20; inset: 0 auto 0 0; width: 248px; display: flex; flex-direction: column; padding: 22px 15px 16px; background: rgba(10,18,31,.96); border-right: 1px solid var(--line); backdrop-filter: blur(18px); }
    .brand-button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; color: var(--text); background: transparent; padding: 6px 10px 24px; text-align: left; }
    .brand-caption { display: block; margin-top: 3px; font-size: 9px; letter-spacing: .15em; color: var(--muted); font-weight: 800; }
    .nav-label { padding: 16px 12px 8px; color: #62758e; font-size: 10px; font-weight: 850; letter-spacing: .16em; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 12px; min-height: 45px; padding: 0 12px; border-radius: 12px; border: 1px solid transparent; color: #9fb0c5; background: transparent; text-align: left; font-weight: 700; font-size: 13px; }
    .nav-item .nav-icon { display: grid; place-items: center; width: 25px; font-size: 17px; }
    .nav-item:hover { background: rgba(255,255,255,.04); color: white; }
    .nav-item.active { color: var(--mint); background: rgba(124,240,196,.085); border-color: rgba(124,240,196,.12); }
    .nav-item .count { margin-left: auto; color: #06251b; background: var(--mint); min-width: 20px; padding: 3px 6px; border-radius: 999px; font-size: 10px; text-align: center; }
    .sidebar-spacer { flex: 1; }
    .sidebar-note { margin: 12px 4px; padding: 13px; color: #8498b2; border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 14px; font-size: 10px; line-height: 1.75; }
    .account-mini { padding: 13px 9px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .avatar { display: grid; place-items: center; flex: 0 0 36px; width: 36px; height: 36px; border-radius: 13px; background: linear-gradient(145deg,#304d6b,#1b2e47); color: var(--mint); font-weight: 900; }
    .account-mini .user-name { min-width: 0; font-weight: 750; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-mini .user-role { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .account-mini button { margin-left: auto; background: transparent; color: #8ea3bd; border: 0; font-size: 17px; padding: 5px; }
    .workspace { min-width: 0; width: calc(100% - 248px); margin-left: 248px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 78px; padding: 15px clamp(18px,3vw,38px); border-bottom: 1px solid var(--line); background: rgba(11,18,32,.48); }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .page-kicker { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    .page-heading { margin: 0; font-size: 21px; letter-spacing: -.045em; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .business-indicator { color: var(--red); border: 1px solid rgba(255,102,126,.3); background: rgba(255,102,126,.07); }
    .mobile-menu { display: none; }
    .page { max-width: 1500px; padding: clamp(18px,3vw,36px); margin: 0 auto; }
    .page-intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin: 0 0 24px; }
    .page-intro h1 { margin: 5px 0 7px; font-size: clamp(25px,3vw,35px); letter-spacing: -.06em; }
    .page-intro p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 13px; }
    .balance-hero { position: relative; overflow: hidden; min-height: 220px; padding: clamp(23px,3vw,35px); border-radius: 25px; background: radial-gradient(circle at 88% 18%, rgba(255,255,255,.23), transparent 26%), radial-gradient(circle at 75% 100%, rgba(14,117,89,.26), transparent 40%), linear-gradient(115deg,#76eec0,#53d9ae 52%,#39bca0); color: #06251b; box-shadow: 0 25px 50px rgba(45,204,155,.1); }
    .balance-hero:after { content: "BB"; position: absolute; top: -55px; right: 22px; font-size: clamp(170px,22vw,270px); line-height: 1; color: rgba(255,255,255,.12); font-weight: 950; letter-spacing: -.12em; transform: rotate(-9deg); pointer-events: none; }
    .balance-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; position: relative; z-index: 1; }
    .balance-top .eyebrow { color: rgba(5,44,32,.7); }
    .balance-value { position: relative; z-index: 1; font-size: clamp(39px,5.5vw,62px); line-height: 1.12; margin: 18px 0 6px; letter-spacing: -.07em; font-weight: 900; font-variant-numeric: tabular-nums; }
    .balance-unit { font-size: 15px; letter-spacing: -.01em; font-weight: 750; }
    .balance-caption { position: relative; z-index: 1; color: rgba(5,44,32,.73); font-size: 12px; }
    .balance-bottom { display: flex; justify-content: space-between; align-items: end; gap: 14px; position: relative; z-index: 1; margin-top: 22px; }
    .balance-bottom .btn { color: #092c20; background: rgba(255,255,255,.36); border-color: rgba(255,255,255,.28); }
    .stats-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 13px; margin: 17px 0 25px; }
    .stat-card { padding: 18px; border: 1px solid var(--line); background: rgba(17,28,46,.8); border-radius: 18px; min-width: 0; }
    .stat-card .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .stat-card .stat-icon { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 12px; background: rgba(124,240,196,.09); margin-bottom: 14px; font-size: 17px; }
    .stat-card .stat-value { font-size: clamp(22px,2.3vw,29px); font-weight: 850; letter-spacing: -.06em; margin-top: 7px; font-variant-numeric: tabular-nums; }
    .stat-card .stat-caption { color: #637890; font-size: 10px; margin-top: 4px; }
    .content-grid { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(280px,.85fr); gap: 17px; align-items: start; }
    .stack { display: grid; gap: 17px; min-width: 0; }
    .quick-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; }
    .quick-btn { display: flex; flex-direction: column; align-items: flex-start; min-height: 105px; padding: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 16px; color: white; text-align: left; }
    .quick-btn:hover { background: rgba(124,240,196,.07); border-color: rgba(124,240,196,.22); }
    .quick-btn .quick-icon { font-size: 21px; margin-bottom: auto; }
    .quick-btn b { display: block; font-size: 12px; margin-top: 16px; }
    .quick-btn span:last-child { color: var(--muted); font-size: 10px; margin-top: 4px; }
    .item-list { display: grid; gap: 0; }
    .list-item { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 13px 0; border-bottom: 1px solid rgba(196,216,240,.07); }
    .list-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .list-item:first-child { padding-top: 0; }
    .item-icon { display: grid; place-items: center; flex: 0 0 39px; width: 39px; height: 39px; border-radius: 13px; background: rgba(145,184,255,.1); font-size: 16px; }
    .item-main { min-width: 0; flex: 1; }
    .item-title { font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-sub { color: var(--muted); font-size: 10px; margin-top: 4px; line-height: 1.5; overflow-wrap: anywhere; }
    .item-amount { text-align: right; flex: 0 0 auto; font-size: 13px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .amount-plus { color: var(--mint); }
    .amount-minus { color: #e6edf7; }
    .empty { padding: 24px 12px; text-align: center; color: #72869f; font-size: 12px; line-height: 1.7; }
    .empty .empty-icon { font-size: 26px; opacity: .8; margin-bottom: 8px; }
    .notice { position: relative; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.025); margin-bottom: 10px; }
    .notice:last-child { margin-bottom: 0; }
    .notice-title { font-size: 13px; font-weight: 800; margin: 0 0 6px; }
    .notice-body { font-size: 12px; color: #a2b4ca; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .notice-meta { color: #647a93; font-size: 10px; margin-top: 9px; }
    .transaction-tag { font-size: 9px; font-weight: 800; padding: 4px 7px; border-radius: 6px; color: #a7bad0; background: rgba(255,255,255,.055); display: inline-block; margin-top: 4px; }

    /* Feature pages */
    .form-panel { max-width: 760px; }
    .form-panel .panel-pad { padding: clamp(20px,3vw,30px); }
    .form-symbol { display: grid; place-items: center; width: 55px; height: 55px; margin-bottom: 20px; border-radius: 17px; background: rgba(124,240,196,.1); font-size: 25px; }
    .amount-input-wrap { position: relative; }
    .amount-input-wrap .input { padding-right: 90px; font-weight: 800; font-size: 19px; }
    .amount-suffix { position: absolute; top: 50%; right: 13px; transform: translateY(-50%); color: var(--muted); font-size: 11px; pointer-events: none; }
    .info-note { padding: 12px 14px; border: 1px solid rgba(145,184,255,.16); background: rgba(145,184,255,.055); border-radius: 12px; color: #9db6d6; font-size: 11px; line-height: 1.75; margin: 15px 0 18px; }
    .request-card { border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 16px; padding: 16px; margin-bottom: 11px; }
    .request-card:last-child { margin-bottom: 0; }
    .request-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .request-amount { font-size: 22px; font-weight: 900; letter-spacing: -.055em; white-space: nowrap; }
    .request-note { color: #a0b3c9; font-size: 11px; line-height: 1.6; margin: 8px 0 12px; overflow-wrap: anywhere; }
    .request-actions { display: flex; align-items: end; gap: 9px; flex-wrap: wrap; }
    .request-actions .field { flex: 1; min-width: 130px; margin: 0; }
    .request-actions .input { min-height: 38px; padding: 9px 11px; }
    .store-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 15px; }
    .store-card { overflow: hidden; border: 1px solid var(--line); background: rgba(17,28,46,.8); border-radius: 20px; min-width: 0; }
    .store-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; padding: 18px 18px 0; }
    .store-icon { display: grid; place-items: center; width: 45px; height: 45px; background: linear-gradient(145deg,rgba(124,240,196,.16),rgba(145,184,255,.12)); border-radius: 14px; font-size: 21px; }
    .store-name { margin: 12px 0 4px; font-size: 17px; font-weight: 850; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .store-id { color: #70849d; font-size: 10px; overflow-wrap: anywhere; }
    .store-body { padding: 16px 18px 18px; }
    .store-metrics { display: flex; justify-content: space-between; gap: 8px; padding: 12px; background: rgba(255,255,255,.025); border-radius: 12px; margin-bottom: 14px; }
    .store-metrics span { display: block; color: var(--muted); font-size: 10px; }
    .store-metrics b { display: block; margin-top: 4px; font-size: 14px; }
    .store-qr { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; margin: 13px 0; }
    .store-qr img { width: 88px; height: 88px; object-fit: contain; flex: 0 0 88px; background: white; border-radius: 8px; }
    .store-qr p { color: var(--muted); line-height: 1.65; font-size: 10px; margin: 0; }
    .business-banner { display: flex; align-items: center; gap: 15px; padding: 19px; border: 1px solid rgba(255,102,126,.23); background: linear-gradient(120deg,rgba(255,102,126,.09),rgba(17,28,46,.8)); border-radius: 18px; margin-bottom: 18px; }
    .business-banner .icon { font-size: 30px; }
    .business-banner h3 { margin: 0; color: var(--red); font-size: 15px; }
    .business-banner p { margin: 5px 0 0; color: #9caec3; font-size: 11px; line-height: 1.5; }
    .chart { display: flex; align-items: end; gap: 10px; height: 190px; padding: 15px 3px 0; }
    .chart-col { display: flex; flex-direction: column; justify-content: end; align-items: center; flex: 1; height: 100%; min-width: 0; gap: 8px; }
    .chart-value { font-size: 9px; color: #a8bad0; white-space: nowrap; }
    .chart-bar-track { display: flex; align-items: end; width: 100%; max-width: 42px; height: 135px; border-radius: 9px; background: rgba(255,255,255,.035); overflow: hidden; }
    .chart-bar { width: 100%; border-radius: 8px; min-height: 3px; background: linear-gradient(180deg,#a0ffdc,#2fb98e); }
    .chart-label { color: var(--muted); font-size: 9px; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 500px; }
    .table-wrap { overflow-x: auto; }
    .data-table th, .data-table td { text-align: left; padding: 12px 13px; border-bottom: 1px solid var(--line); font-size: 11px; vertical-align: middle; }
    .data-table th { color: #7d91aa; font-weight: 800; font-size: 10px; letter-spacing: .04em; }
    .data-table td { color: #cbd7e7; }
    .data-table tr:last-child td { border-bottom: 0; }
    .table-actions { display: flex; flex-wrap: wrap; gap: 5px; }
    .section-gap { margin-top: 18px; }
    .bottom-note { padding: 16px 24px 24px; text-align: center; color: #546a85; font-size: 10px; line-height: 1.7; }
    .settings-grid { display: grid; grid-template-columns: minmax(0,760px) minmax(240px,1fr); gap: 17px; align-items: start; }

    /* Modal, scanner and toast */
    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.72); backdrop-filter: blur(10px); }
    .modal { width: min(100%,560px); max-height: min(90vh,780px); overflow: auto; padding: 22px; border: 1px solid rgba(196,216,240,.16); border-radius: 23px; background: #111c2e; box-shadow: 0 30px 100px rgba(0,0,0,.5); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .modal-head h3 { margin: 0; font-size: 17px; }
    .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.035); color: white; }
    .scanner-video { width: 100%; min-height: 230px; max-height: 55vh; object-fit: cover; background: #050a12; border-radius: 15px; }
    .toast { position: fixed; z-index: 200; bottom: 23px; left: 50%; transform: translate(-50%,25px); opacity: 0; pointer-events: none; padding: 13px 17px; max-width: min(90vw,600px); border: 1px solid rgba(124,240,196,.2); border-radius: 14px; color: var(--text); background: #17283c; box-shadow: var(--shadow); font-size: 12px; transition: opacity .2s, transform .2s; }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    .toast.error { border-color: rgba(255,102,126,.35); }
    .sidebar-shade { display: none; }
    .business-mode .sidebar { border-right-color: rgba(255,102,126,.25); }
    .business-mode .brand-mark { background: linear-gradient(145deg,#ff9eae,#ff667e); color: #340913; }
    .business-mode .nav-item.active { color: #ff8798; background: rgba(255,102,126,.09); border-color: rgba(255,102,126,.15); }

    @media (max-width: 1120px) {
      .sidebar { width: 220px; }
      .workspace { width: calc(100% - 220px); margin-left: 220px; }
      .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .quick-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .auth-wrap { grid-template-columns: minmax(0,1fr) minmax(340px,430px); }
    }
    @media (max-width: 850px) {
      .auth-wrap { grid-template-columns: 1fr; max-width: 590px; }
      .auth-visual { min-height: 340px; padding: 25px; }
      .auth-visual h1 { font-size: 48px; margin-top: 28px; }
      .auth-visual p { font-size: 13px; }
      .feature-list { display: none; }
      .auth-foot { padding-bottom: 15px; }
      .sidebar { transform: translateX(-105%); transition: transform .23s ease; width: min(82vw,290px); box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-shade.show { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.55); }
      .workspace { width: 100%; margin-left: 0; }
      .mobile-menu { display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center; background: transparent; color: white; border: 1px solid var(--line); border-radius: 12px; }
      .topbar { min-height: 68px; padding: 12px 18px; }
      .page-heading { font-size: 18px; }
      .content-grid { grid-template-columns: 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
      .page { padding: 20px 17px 28px; }
    }
    @media (max-width: 570px) {
      .auth-wrap { padding: 13px; gap: 14px; }
      .auth-visual { min-height: 300px; border-radius: 23px; padding: 23px; }
      .auth-visual h1 { font-size: 43px; }
      .auth-visual:after { width: 260px; height: 260px; right: -130px; }
      .auth-card { padding: 22px 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .topbar-right .pill { display: none; }
      .topbar { gap: 9px; }
      .topbar-right { gap: 6px; }
      .topbar-right .btn { min-height: 38px; padding: 8px 10px; font-size: 11px; }
      .page-intro { align-items: flex-start; flex-direction: column; }
      .balance-hero { min-height: 204px; padding: 22px; }
      .balance-value { font-size: 43px; }
      .stats-grid { gap: 9px; margin-top: 12px; }
      .stat-card { padding: 14px; border-radius: 15px; }
      .stat-card .stat-icon { width: 31px; height: 31px; margin-bottom: 10px; }
      .stat-card .stat-value { font-size: 22px; }
      .quick-grid { gap: 8px; }
      .quick-btn { min-height: 95px; padding: 12px; }
      .panel-pad { padding: 17px; }
      .store-grid { grid-template-columns: 1fr; }
      .store-qr img { width: 74px; height: 74px; flex-basis: 74px; }
      .request-actions { align-items: stretch; }
      .request-actions .field { min-width: 100%; }
      .request-actions .btn { flex: 1; }
      .data-table { min-width: 470px; }
      .bottom-note { padding: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div id="root"><div style="padding:40px;color:#91a4bd">Buy Buy を起動しています…</div></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <script>
    'use strict';
    const app = {
      token: '', user: null, dashboard: null, admin: null, business: null,
      setupState: null, view: 'home', businessMode: false, selectedStoreId: '',
      logoTaps: 0, logoTimer: null, toastTimer: null, scannerStream: null, scannerTimer: null
    };

    const PAGE_INFO = {
      home: ['概要', 'ホーム'], send: ['送金', '送る'], receive: ['入金・受取', '受取'],
      request: ['請求', '請求する'], pay: ['支払い', '支払う'], stores: ['店舗決済', '支払う'],
      business: ['STORE BUSINESS', 'Businessモード'], admin: ['システム管理', '管理センター'], settings: ['アカウント', '設定']
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }
    function fmt(value) { return new Intl.NumberFormat('ja-JP').format(Number(value || 0)); }
    function roleName(role) { return ({ user: '一般社員', admin: '管理者', boss: '最高管理者' })[role] || '社員'; }
    function optionUsers(selected) {
      const list = (app.dashboard && app.dashboard.directory) || [];
      return '<option value="">ユーザーを選択</option>' + list.map(u => '<option value="' + escapeHtml(u.id) + '" ' + (u.id === selected ? 'selected' : '') + '>' + escapeHtml(u.name) + '（' + escapeHtml(u.id) + '）</option>').join('');
    }
    function optionAllUsers(selected) {
      const list = (app.admin && app.admin.users) || [];
      return '<option value="">ユーザーを選択</option>' + list.filter(u => u.status === 'ACTIVE').map(u => '<option value="' + escapeHtml(u.id) + '" ' + (u.id === selected ? 'selected' : '') + '>' + escapeHtml(u.name) + '（' + escapeHtml(u.id) + '）</option>').join('');
    }
    function invoke(method, ...args) {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error('GAS Webアプリとして開いてください。HTMLファイル単体ではサーバー機能を利用できません。'));
          return;
        }
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error(err && err.message ? err.message : 'サーバーとの通信に失敗しました。')));
        try { runner[method](...args); }
        catch (err) { reject(err); }
      }).then(result => {
        if (!result || result.ok !== true) {
          const message = result && result.message ? result.message : '処理に失敗しました。';
          if (message.indexOf('ログイン期限') >= 0 && app.token) expireSession();
          throw new Error(message);
        }
        return result.data;
      });
    }
    function showToast(message, isError) {
      const el = document.getElementById('toast');
      el.textContent = String(message || '完了しました');
      el.classList.toggle('error', !!isError);
      el.classList.add('show');
      clearTimeout(app.toastTimer);
      app.toastTimer = setTimeout(() => el.classList.remove('show'), 3400);
    }
    function expireSession() {
      app.token = ''; app.user = null; app.dashboard = null; app.admin = null; app.business = null; app.businessMode = false;
      renderLogin(app.setupState, 'ログイン期限が切れました。もう一度ログインしてください。');
    }
    async function init() {
      try {
        const result = await invoke('apiGetSetupState');
        app.setupState = result;
        if (result.setupRequired) renderLogin(result, '');
        else if (!result.initialized || !result.canLogin) renderLogin(result, result.message || 'セットアップが必要です。');
        else renderLogin(result, '');
      } catch (err) {
        renderLogin({ initialized: false, setupRequired: false, message: err.message }, err.message);
      }
    }

    function renderLogin(setup, error) {
      const root = document.getElementById('root');
      const firstRun = !!(setup && setup.setupRequired);
      const noDatabase = !(setup && setup.initialized);
      const hidden = !!(app.businessMode && app.user);
      const title = hidden ? '金融カンパニー' : (firstRun ? '最高管理者を登録' : (noDatabase ? '初回セットアップ' : 'おかえりなさい'));
      let form = '';
      if (firstRun) {
        form = '<form onsubmit="setupBossSubmit(event)">' +
          '<div class="field"><label for="setupToken">一回限りのセットアップトークン</label><input class="input" id="setupToken" autocomplete="one-time-code" required placeholder="実行ログに表示されたトークン"></div>' +
          '<div class="form-grid"><div class="field"><label for="setupId">管理者ID</label><input class="input" id="setupId" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_-]{3,24}" autocomplete="username" placeholder="boss"></div>' +
          '<div class="field"><label for="setupName">表示名</label><input class="input" id="setupName" required maxlength="40" placeholder="金融カンパニー"></div></div>' +
          '<div class="field"><label for="setupPassword">パスワード（8文字以上）</label><input class="input" type="password" id="setupPassword" required minlength="8" maxlength="128" autocomplete="new-password"></div>' +
          '<div class="field"><label for="setupPin">取引PIN（数字4〜12桁）</label><input class="input" type="password" id="setupPin" required minlength="4" maxlength="12" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="off"></div>' +
          '<button class="btn btn-primary btn-wide" type="submit">最高管理者を作成　↗</button></form>';
      } else if (noDatabase) {
        form = '<div class="setup-notice">データベースがまだ準備されていません。Apps Script エディタで <b>setupBuyBuy()</b> を実行し、実行ログに表示されたトークンを準備してください。</div>' +
          '<button class="btn btn-secondary btn-wide" type="button" onclick="retryInit()">セットアップ状態を再確認 ↻</button>';
      } else {
        form = '<form onsubmit="loginSubmit(event)">' +
          '<div class="field"><label for="loginId">ユーザーID</label><input class="input" id="loginId" required minlength="3" maxlength="24" autocomplete="username" placeholder="ユーザーID"></div>' +
          '<div class="field"><label for="loginPassword">パスワード</label><input class="input" type="password" id="loginPassword" required autocomplete="current-password" placeholder="パスワード"></div>' +
          '<button class="btn btn-primary btn-wide" type="submit">安全にログイン　↗</button></form>';
      }
      root.innerHTML = '<div class="auth-wrap"><section class="auth-visual">' +
        '<button class="brand-button" style="padding:0;width:max-content" onclick="logoTap()"><span class="brand-mark">B</span><span><span class="brand-word">Buy <span>Buy</span></span><span class="brand-caption">CLASS FINANCE PLATFORM</span></span></button>' +
        '<div><div class="eyebrow">SIMPLE · PRIVATE · CLASSROOM</div><h1>お金の動きを、<br><span>もっとスマートに。</span></h1><p>送る、受け取る、請求する、支払う。クラスの会社活動を、ひとつの画面でわかりやすく管理するシステム。</p>' +
        '<div class="feature-list"><div class="feature"><b>↗ かんたん送金</b>PINで確認してを移動</div><div class="feature"><b>◈ お店の精算</b>売上をまとめてオーナーへ</div><div class="feature"><b>⌁ 権限管理</b>役割ごとに操作を制限</div><div class="feature"><b>◎ 監査ログ</b>重要な操作を記録</div></div></div>' +
        '<div class="small" style="color:#8196ae;line-height:1.7">Buy Buy · クラス内専用<br>実際の円・銀行口座・外部決済には接続しません。</div></section>' +
        '<section class="auth-card-wrap"><div class="auth-card"><div class="eyebrow">' + (firstRun ? 'INITIAL CONFIGURATION' : (hidden ? 'RESTRICTED ACCESS' : 'MEMBER ACCESS')) + '</div><h2 style="margin-top:9px">' + escapeHtml(title) + '</h2><p class="sub">' + (firstRun ? '最初に最高管理者アカウントを1つ作成します。トークンは初回登録後に無効になります。' : (hidden ? '権限を持つアカウントで認証してください。' : 'あなたのアカウントでログインしてください。')) + '</p>' +
        (error ? '<div class="error-inline">' + escapeHtml(error) + '</div>' : '') + form +
        '<div class="auth-foot">セキュリティのため、パスワードとPINは別々のソルト付きハッシュとして保存します。<br>パスワードやPINを友達と共有しないでください。</div></div></section></div>';
    }

    async function retryInit() {
      try { const result = await invoke('apiGetSetupState'); app.setupState = result; renderLogin(result, result.message || ''); }
      catch (err) { showToast(err.message, true); }
    }
    async function setupBossSubmit(e) {
      e.preventDefault();
      const button = e.submitter; if (button) button.disabled = true;
      try {
        const data = await invoke('apiCreateBoss', {
          setupToken: val('setupToken'), id: val('setupId'), name: val('setupName'), password: val('setupPassword'), pin: val('setupPin')
        });
        app.setupState = { initialized: true, canLogin: true, setupRequired: false };
        await enterApp(data, false);
        showToast('最高管理者アカウントを作成しました。');
      } catch (err) { renderLogin(app.setupState, err.message); }
      finally { if (button) button.disabled = false; }
    }
    async function loginSubmit(e) {
      e.preventDefault();
      const button = e.submitter; if (button) button.disabled = true;
      try {
        const data = await invoke('apiLogin', val('loginId'), val('loginPassword'));
        await enterApp(data, false);
        showToast('ログインしました。');
      } catch (err) { renderLogin(app.setupState, err.message); }
      finally { if (button) button.disabled = false; }
    }
    async function businessLoginSubmit(e) {
      e.preventDefault();
      const storeId = val('secretId').trim();
      const store = (app.dashboard && app.dashboard.businesses || []).find(s => s.id === storeId);
      if (!store) { renderSecretLogin('店舗IDが見つかりません。ログイン中のアカウントが利用できる店舗IDを入力してください。'); return; }
      closeModal(); app.selectedStoreId = store.id; app.businessMode = true; app.view = 'business'; renderApp();
      showToast(store.name + ' の店舗決済モードを開きました。');
    }
    async function enterApp(session, businessMode) {
      app.token = session.token; app.user = session.user; app.businessMode = !!businessMode;
      app.view = businessMode ? 'business' : 'home';
      app.admin = null; app.business = null;
      app.dashboard = await invoke('apiGetDashboard', app.token);
      if (businessMode) await loadBusiness();
      renderApp();
    }

    function logoTap() {
      app.logoTaps++;
      clearTimeout(app.logoTimer);
      app.logoTimer = setTimeout(() => { app.logoTaps = 0; }, 2200);
      if (app.logoTaps >= 5) {
        app.logoTaps = 0;
        openSecretCurtain();
      }
    }
    function openSecretCurtain() {
      document.getElementById('modal-root').innerHTML = '<div class="modal-backdrop" id="secret-curtain"><div class="modal" style="text-align:center;max-width:460px;border-color:rgba(255,102,126,.28);background:linear-gradient(150deg,#1b1826,#111827)"><div class="brand-mark" style="margin:0 auto 18px;background:linear-gradient(145deg,#ff9eae,#ff667e);color:#340913">B</div><div class="eyebrow" style="color:var(--red)">BUYBUY FOR BUSINESS</div><h2 style="font-size:30px;letter-spacing:-.06em;margin:9px 0">金融カンパニー</h2><p class="muted" style="font-size:12px;line-height:1.7;margin:0 0 22px">管理者専用の入口です。アカウント認証が必要です。</p><button class="btn btn-danger btn-wide" onclick="renderSecretLogin(\'\')">管理者ログインへ進む ↗</button><button class="btn btn-quiet btn-wide" style="margin-top:8px" onclick="closeModal()">閉じる</button></div></div>';
    }
    function renderSecretLogin(error) {
      document.getElementById('modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal" style="max-width:460px;border-color:rgba(255,102,126,.27)"><div class="modal-head"><h3 style="color:var(--red)">BuyBuy for Business</h3><button class="icon-btn" onclick="closeModal()" aria-label="閉じる">×</button></div><p class="muted" style="font-size:12px;line-height:1.7">作成済みの店舗IDを入力してください。店舗画面では支払い用QRコードを表示できます。</p>' + (error ? '<div class="error-inline">' + escapeHtml(error) + '</div>' : '') + '<form onsubmit="businessLoginSubmit(event)"><div class="field"><label for="secretId">店舗ID</label><input class="input" id="secretId" required maxlength="80" placeholder="biz_..."></div><button class="btn btn-danger btn-wide" type="submit">店舗を開く　↗</button></form><button class="btn btn-quiet btn-wide" style="margin-top:9px" onclick="closeModal()">キャンセル</button></div></div>';
    }

    function navButton(key, icon, label, count) {
      const active = app.view === key ? ' active' : '';
      return '<button class="nav-item' + active + '" onclick="switchTab(\'' + key + '\')"><span class="nav-icon">' + icon + '</span><span>' + label + '</span>' + (count ? '<span class="count">' + count + '</span>' : '') + '</button>';
    }
    function renderApp() {
      if (!app.user || !app.dashboard) return;
      const u = app.user, d = app.dashboard;
      if (app.businessMode) {
        document.body.classList.add('business-mode');
        document.getElementById('root').innerHTML = renderBusinessShell();
        return;
      }
      document.body.classList.remove('business-mode');
      const canAdmin = ['boss','admin'].indexOf(u.role) >= 0;
      const canBusiness = (d.businesses || []).some(s => s.canOperate === true);
      document.body.classList.toggle('business-mode', app.businessMode);
      const menu = navButton('home','⌂','ホーム') + navButton('send','↗','送る') + navButton('receive','⇣','受取') + navButton('request','⌁','請求する') + navButton('pay','✓','支払う',d.pendingCount) + (canBusiness ? navButton('business','▦','Business') : '') + (canAdmin ? navButton('admin','⚙','管理センター') : '') + navButton('settings','◎','アカウント設定');
      const info = PAGE_INFO[app.view] || PAGE_INFO.home;
      document.getElementById('root').innerHTML = '<div class="app-shell"><aside class="sidebar" id="sidebar"><button class="brand-button" onclick="switchTab(\'home\')"><span class="brand-mark">B</span><span><span class="brand-word">Buy <span>Buy</span></span><span class="brand-caption">CLASS FINANCE PLATFORM</span></span></button><div class="nav-label">WORKSPACE</div><nav class="nav-list">' + menu + '</nav><div class="sidebar-spacer"></div><div class="sidebar-note"><b style="color:#bccbdd">プライベートなクラス用システム</b><br>残高と取引はアプリ内です。実際の円や銀行口座とは接続していません。</div><div class="account-mini"><div class="avatar">' + escapeHtml((u.name || 'B').slice(0,1)) + '</div><div style="min-width:0"><div class="user-name">' + escapeHtml(u.name) + '</div><div class="user-role">' + escapeHtml(roleName(u.role)) + ' · ' + escapeHtml(u.id) + '</div></div><button onclick="logout()" title="ログアウト" aria-label="ログアウト">⇥</button></div></aside><div class="sidebar-shade" id="sidebar-shade" onclick="toggleSidebar(false)"></div><div class="workspace"><header class="topbar"><div class="topbar-left"><button class="mobile-menu" onclick="toggleSidebar()" aria-label="メニュー">☰</button><div><div class="page-kicker">' + escapeHtml(info[0]) + '</div><h1 class="page-heading">' + escapeHtml(info[1]) + '</h1></div></div><div class="topbar-right">' + (app.businessMode ? '<span class="pill business-indicator">● BUSINESS MODE</span>' : '<span class="pill pill-mint">● SECURE SESSION</span>') + '<button class="btn btn-secondary" onclick="switchTab(\'settings\')">' + escapeHtml(u.name) + ' ▾</button></div></header><main id="pageContent" class="page">' + renderPage() + '</main><footer class="bottom-note">Buy Buy はクラス内の仮想管理用です。実際の金銭の支払い・送金・換金は行いません。<br>取引の安全性を確認してから操作してください。</footer></div></div>';
      if (window.QRCode) document.querySelectorAll('[data-store-qr]').forEach(el => { if (!el.childElementCount) new QRCode(el, { text: el.getAttribute('data-store-qr'), width: 80, height: 80, correctLevel: QRCode.CorrectLevel.M }); });
    }

    function renderPage() {
      try { switch (app.view) {
        case 'send': return renderSendPage();
        case 'receive': return renderReceivePage();
        case 'request': return renderRequestPage();
        case 'pay': return renderPayPage();
        case 'business': return renderBusinessPage();
        case 'admin': return renderAdminPage();
        case 'settings': return renderSettingsPage();
        default: return renderHomePage();
      } } catch (err) { console.error('BuyBuy render error:', err); return '<div class="panel panel-pad"><h2>画面の表示でエラーが発生しました</h2><p class="muted">画面を更新してください。改善しない場合は管理者に連絡してください。</p><button class="btn btn-primary" onclick="refreshDashboard()">再読み込み</button></div>'; }
    }
    function pageIntro(eyebrow, title, desc, action) {
      return '<div class="page-intro"><div><div class="eyebrow">' + eyebrow + '</div><h1>' + title + '</h1><p>' + desc + '</p></div>' + (action || '') + '</div>';
    }
    function renderHomePage() {
      const d = app.dashboard, u = app.user;
      const income = (d.transactions || []).filter(t => t.toId === u.id || (t.type === 'ADMIN_CHARGE' && t.toId === u.id) || (t.type === 'STORE_SETTLEMENT' && t.toId === u.id)).reduce((sum,t) => sum + t.amount,0);
      const outgoing = (d.transactions || []).filter(t => t.fromId === u.id).reduce((sum,t) => sum + t.amount,0);
      return pageIntro('YOUR MONEY, AT A GLANCE','こんにちは、' + escapeHtml(u.name) + ' さん','今日の残高と取引を確認できます。', '<button class="btn btn-secondary" onclick="refreshDashboard()">↻ 更新</button>') +
        '<section class="balance-hero" role="button" tabindex="0" onclick="showMyQr()" title="タップして自分のQRコードを表示"><div class="balance-top"><div><div class="eyebrow">AVAILABLE BALANCE</div><div class="balance-caption" style="margin-top:6px">あなたが今使える</div></div><span class="pill" style="color:#073b2b;border-color:rgba(4,57,40,.17);background:rgba(255,255,255,.24)">● ' + escapeHtml(roleName(u.role)) + '</span></div><div class="balance-value">' + fmt(u.balance) + ' <span class="balance-unit">億</span></div><div class="balance-caption">金額はアプリ内の単位です。実際のお金ではありません。</div><div class="balance-bottom"><div class="small" style="color:rgba(5,44,32,.73)">アカウント　<b>' + escapeHtml(u.id) + '</b></div><button class="btn" onclick="switchTab(\'send\')">送る　↗</button></div></section>' +

    function startScanner() {
      document.getElementById('modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>QRコードをファイルから読み取る</h3><button class="icon-btn" onclick="closeModal()" aria-label="閉じる">×</button></div><p class="muted small" style="line-height:1.7">端末に保存したBuy BuyのQR画像を選択してください。カメラは使用せず、画像ファイルを読み取ります。</p><div class="field"><label for="qr-file-input">QR画像ファイル</label><input class="input" id="qr-file-input" type="file" accept="image/*" onchange="readQrFile(event)"></div><canvas id="qr-file-canvas" style="display:none"></canvas><div id="qr-file-message" class="info-note">PNG・JPGなどのQR画像を選択してください。</div><button class="btn btn-quiet btn-wide" style="margin-top:8px" onclick="closeModal()">キャンセル</button></div></div>';
    }
    function readQrFile(event) {
      const file = event.target.files && event.target.files[0]; if (!file) return;
      const msg = document.getElementById('qr-file-message');
      if (!window.jsQR) { msg.textContent = 'QR読み取りライブラリを読み込めません。通信を確認して再読み込みしてください。'; return; }
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = function() {
        try {
          const canvas = document.getElementById('qr-file-canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
          const maxSide = 1800, scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          canvas.width = Math.max(1, Math.round(img.naturalWidth * scale)); canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
          ctx.imageSmoothingEnabled = false; ctx.drawImage(img,0,0,canvas.width,canvas.height);
          let code = null;
          const attempts = [1, 1.5, 2];
          for (const factor of attempts) {
            const w = Math.max(1, Math.round(canvas.width * factor)), h = Math.max(1, Math.round(canvas.height * factor));
            const work = document.createElement('canvas'); work.width = w; work.height = h;
            const workCtx = work.getContext('2d', { willReadFrequently: true }); workCtx.imageSmoothingEnabled = false; workCtx.drawImage(canvas,0,0,w,h);
            const pixels = workCtx.getImageData(0,0,w,h);
            code = window.jsQR(pixels.data,w,h,{ inversionAttempts:'attemptBoth' });
            if (code && code.data) break;
          }
          URL.revokeObjectURL(url);
          if (!code || !code.data) { msg.textContent = 'QRコードを読み取れません。QR全体が写ったPNG/JPG画像を選び、余白を含めて再保存してください。'; return; }
          handleScannedCode(code.data);
        } catch (err) { URL.revokeObjectURL(url); msg.textContent = '画像を読み取れませんでした。別の画像を選択してください。'; }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); msg.textContent = '画像ファイルを開けませんでした。'; };
      img.src = url;
    }
    function handleScannedCode(raw) {
      let parsed = null, value = String(raw || '').trim();
      try { const obj = JSON.parse(value); if (obj && obj.app === 'BUYBUY_PAY' && obj.version === 1) parsed = obj; } catch (_) {}
      if (value.indexOf('BUYBUY:USER:') === 0) {
        const customerId = value.substring('BUYBUY:USER:'.length).trim();
        if (app.businessMode && app.selectedStoreId) { closeModal(); showToast('お客さんID：' + customerId + '。お客さん側で店舗QRを読み取り、金額・PINを確認して支払ってください。'); return; }
        showToast('ユーザーQRを読み取りました。送金先として利用する場合は「送る」で相手を選んでください。', true); return;
      }
      if (parsed) {
        const store = (app.dashboard && app.dashboard.businesses || []).find(s => s.id === String(parsed.storeId || ''));
        const amount = Number(parsed.amount);
        if (!store || !Number.isSafeInteger(amount) || amount < 1 || amount > 1000000000) { showToast('支払いQRの内容が正しくありません。', true); return; }
        closeModal(); showStorePaymentConfirm(store, amount, String(parsed.item || '')); return;
      }
      if (value.indexOf('BUYBUY:BIZ:') === 0) value = value.substring('BUYBUY:BIZ:'.length);
      const store = (app.dashboard && app.dashboard.businesses || []).find(s => s.id === value);
      if (!store) { showToast('店舗が見つかりません。QRまたは店舗IDを確認してください。', true); return; }
      closeModal(); showToast('旧形式の店舗QRです。お店に新しい支払いQRを表示してもらってください。', true);
    }
    function manualStoreLookup(e) {
      e.preventDefault(); const id = val('manualStoreId').trim();
      const store = (app.dashboard && app.dashboard.businesses || []).find(s => s.id === id);
      if (!store) { showToast('店舗IDが見つかりません。', true); return; }
      app.selectedStoreId = store.id; renderApp(); setTimeout(() => { const el = document.getElementById('store-' + store.id); if (el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, 50); showToast('店舗を選択しました。金額を入力して支払いを確定できます。');
    }
    function showStorePaymentConfirm(store, amount, item) {
      const safeItem = String(item || '');
      document.getElementById('modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>支払い内容の確認</h3><button class="icon-btn" onclick="closeModal()" aria-label="閉じる">×</button></div><div class="info-note">店舗：' + escapeHtml(store.name) + '<br>商品：' + escapeHtml(safeItem || '商品指定なし') + '<br>金額：<b>' + fmt(amount) + ' 億</b><br>支払い後残高：<b>' + fmt(Number(app.user.balance) - amount) + ' 億</b></div>' + (Number(app.user.balance) < amount ? '<div class="error-inline">残高が不足しているため支払えません。</div>' : '<div class="field" style="margin-top:16px"><label for="storePayPin">取引PIN</label><input class="input" id="storePayPin" type="password" inputmode="numeric" maxlength="12" placeholder="取引PIN" autocomplete="off"></div><button class="btn btn-primary btn-wide" onclick="confirmStorePayment(\'' + escapeHtml(store.id) + '\',' + amount + ')">内容を確認して支払う</button>') + '<button class="btn btn-quiet btn-wide" style="margin-top:8px" onclick="closeModal()">キャンセル</button></div></div>';
      app.pendingStoreItem = safeItem;
    }
    async function confirmStorePayment(storeId, amount) {
      const pin = val('storePayPin'); if (!pin) { showToast('取引PINを入力してください。', true); return; }
      if (Number(app.user.balance) < Number(amount)) { showToast('残高が不足しています。', true); return; }
      if (!confirm('この内容で支払いを確定しますか？')) return;
      try { const d = await invoke('apiPayStore', app.token, { storeId: storeId, amount: amount, pin: pin, note: app.pendingStoreItem || '店舗QR決済' }); closeModal(); await afterMutation(d.message); }
      catch (err) { showToast(err.message, true); }
    }
    function stopScanner() {
      clearTimeout(app.scannerTimer); app.scannerTimer = null;
      if (app.scannerStream) { app.scannerStream.getTracks().forEach(t => t.stop()); app.scannerStream = null; }
    }
    function closeModal() { stopScanner(); document.getElementById('modal-root').innerHTML = ''; }

    init();
  </script>
</body>
</html>
